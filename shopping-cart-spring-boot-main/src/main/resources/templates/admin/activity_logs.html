<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic::layout(~{::section})}">

<body>
    <section>
        <div class="container py-4">
            <div class="card card-academic">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0"><i class="fas fa-history"></i> ประวัติกิจกรรม (Activity Log)</h4>
                    <span class="badge bg-primary" th:text="'ทั้งหมด ' + ${logs.totalElements} + ' รายการ'"></span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th style="width:160px">วันเวลา</th>
                                    <th style="width:160px">ผู้ดำเนินการ</th>
                                    <th style="width:160px">การกระทำ</th>
                                    <th>รายละเอียด</th>
                                    <th style="width:130px">IP Address</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="log : ${logs.content}">
                                    <td>
                                        <small
                                            th:text="${#temporals.format(log.timestamp, 'dd/MM/yyyy HH:mm')}"></small>
                                    </td>
                                    <td>
                                        <div th:text="${log.adminName}"></div>
                                        <small class="text-muted" th:text="${log.adminEmail}"></small>
                                    </td>
                                    <td>
                                        <span class="badge"
                                            th:classappend="${log.action == 'CREATE_ACCOUNT'} ? 'bg-success' :
                                                (${log.action == 'UPDATE_ACCOUNT_STATUS'} ? 'bg-warning text-dark' :
                                                (${log.action == 'CHANGE_PASSWORD'} ? 'bg-info' :
                                                (${log.action == 'GENERATE_DOCUMENT'} ? 'bg-primary' :
                                                (${log.action == 'UPDATE_REQUEST_STATUS'} ? 'bg-secondary' : 'bg-dark'))))"
                                            th:text="${log.action}"></span>
                                    </td>
                                    <td><small th:text="${log.details}"></small></td>
                                    <td><code th:text="${log.ipAddress}"></code></td>
                                </tr>
                                <tr th:if="${logs.totalElements == 0}">
                                    <td colspan="5" class="text-center py-5 text-muted">
                                        <i class="fas fa-inbox fa-3x mb-3 d-block"></i>
                                        ยังไม่มีประวัติกิจกรรม
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="d-flex justify-content-center py-3" th:if="${logs.totalPages > 1}">
                        <nav>
                            <ul class="pagination mb-0">
                                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                    <a class="page-link" th:href="'/admin/activity-logs?page=' + ${currentPage - 1}">
                                        <i class="fas fa-chevron-left"></i>
                                    </a>
                                </li>
                                <li th:each="i : ${#numbers.sequence(0, logs.totalPages - 1)}" class="page-item"
                                    th:classappend="${i == currentPage} ? 'active'">
                                    <a class="page-link" th:href="'/admin/activity-logs?page=' + ${i}"
                                        th:text="${i + 1}"></a>
                                </li>
                                <li class="page-item"
                                    th:classappend="${currentPage == logs.totalPages - 1} ? 'disabled'">
                                    <a class="page-link" th:href="'/admin/activity-logs?page=' + ${currentPage + 1}">
                                        <i class="fas fa-chevron-right"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
