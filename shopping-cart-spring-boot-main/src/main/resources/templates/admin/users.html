<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic::layout(~{::section})}">

<head>
	<meta charset="UTF-8">
	<title>Users</title>
</head>

<body>
	<section>
		<div class="container-fluid mt-5 p-5">
			<!-- Back Button -->
			<div class="col-12 mb-3">
				<a href="/admin/" class="btn btn-outline-secondary"> <i class="fa-solid fa-arrow-left me-2"></i>Back to
					Dashboard
				</a>
			</div>
			<div class="card card-sh">
				<div class="card-header text-center">
					<p class="fs-4" th:if="${userType==1}">Users</p>
					<p class="fs-4" th:if="${userType==2}">Admin</p>
					

					<th:block th:if="${succMsg}">
						<p class="text-success fw-bold">[[${succMsg}]]</p>
					</th:block>

					<th:block th:if="${errorMsg}">
						<p class="text-danger fw-bold">[[${errorMsg}]]</p>
					</th:block>
				</div>

				<div class="card-body">
					<table class="table">
						<thead>
							<tr>
								<th scope="col">Sl No.</th>
								<th scope="col">Profile</th>
								<th scope="col">Name</th>
								<th scope="col">Email</th>
								<th scope="col">Mobile No</th>
								<th scope="col">ตำแหน่งทางวิชาการ</th>
								<th scope="col">Status</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="u,c:${users}">
								<th scope="row">[[${c.count}]]</th>
								<td><img th:src="${u.profileImage}" width="70px" height="70px"
										style="object-fit: cover; border-radius: 50%;"
										onerror="this.src='/img/profile_img/default.png'"></td>

								<td>[[${u.name}]]</td>
								<td>[[${u.email}]]</td>
								<td>[[${u.mobileNumber}]]</td>
								<td>[[${u.academicPosition != null ? u.academicPosition : '-'}]]</td>
								<td>
									<div class="form-check form-switch d-flex align-items-center gap-2 mb-0">
										<input class="form-check-input status-toggle" type="checkbox" role="switch"
											th:checked="${u.isEnable}"
											th:data-id="${u.id}"
											th:data-type="${userType}"
											style="width: 3em; height: 1.5em; cursor: pointer;"
											onchange="toggleStatus(this)">
										<label class="form-check-label fw-semibold"
											th:classappend="${u.isEnable} ? 'text-success' : 'text-danger'"
											th:text="${u.isEnable} ? 'Active' : 'Inactive'"></label>
									</div>
								</td>

							</tr>

						</tbody>
					</table>
				</div>
			</div>
		</div>

		<script th:inline="javascript">
			function toggleStatus(el) {
				const id = el.dataset.id;
				const type = el.dataset.type;
				const newStatus = el.checked;

				if (!newStatus) {
					if (!confirm('Are you sure you want to deactivate this user account?')) {
						el.checked = true;
						return;
					}
				}

				window.location.href = '/admin/updateSts?status=' + newStatus + '&id=' + id + '&type=' + type;
			}
		</script>

	</section>
</body>

</html>
