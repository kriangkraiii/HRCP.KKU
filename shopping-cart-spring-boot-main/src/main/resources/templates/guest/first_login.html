<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบครั้งแรก - ระบบตำแหน่งทางวิชาการ</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d1b3e 0%, #1a237e 30%, #0d47a1 60%, #1565c0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
        }

        .header .logo-icon {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header .logo-icon i {
            font-size: 32px;
            color: #fff;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.8;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 35px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1a237e;
            text-align: center;
            margin-bottom: 8px;
        }

        .card .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .step {
            width: 40px;
            height: 4px;
            border-radius: 2px;
            background: #e0e0e0;
        }

        .step.active {
            background: #1a237e;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Sarabun', sans-serif;
            font-size: 15px;
            transition: border-color 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #1a237e;
            box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #1a237e, #0d47a1);
            color: #fff;
            font-family: 'Sarabun', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 5px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(13, 71, 161, 0.4);
        }

        .back-link {
            text-align: center;
            margin-top: 15px;
        }

        .back-link a {
            color: #0d47a1;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .alert-danger {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
            <h1>ระบบตำแหน่งทางวิชาการ</h1>
            <p>วิทยาลัยการคอมพิวเตอร์ มหาวิทยาลัยขอนแก่น</p>
        </div>
        <div class="card">
            <div class="step-indicator">
                <div class="step active"></div>
                <div class="step"></div>
                <div class="step"></div>
            </div>
            <h2>เข้าสู่ระบบครั้งแรก</h2>
            <p class="subtitle">กรุณากรอกอีเมลที่ผู้ดูแลระบบลงทะเบียนไว้<br>ระบบจะส่งรหัส OTP ไปยังอีเมลของคุณ</p>

            <div th:if="${succMsg}" class="alert alert-success">
                <i class="fas fa-check-circle"></i>
                <span th:text="${succMsg}"></span>
            </div>
            <div th:if="${errorMsg}" class="alert alert-danger">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${errorMsg}"></span>
            </div>

            <form th:action="@{/first-login}" method="post">
                <div class="form-group">
                    <label>อีเมล</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" name="email" placeholder="กรอกอีเมลของคุณ" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-paper-plane"></i> ส่งรหัส OTP
                </button>
            </form>
            <div class="back-link">
                <a th:href="@{/signin}"><i class="fas fa-arrow-left"></i> กลับไปหน้าเข้าสู่ระบบ</a>
            </div>
        </div>
        <div class="footer-text">© 2025 วิทยาลัยการคอมพิวเตอร์ มหาวิทยาลัยขอนแก่น</div>
    </div>
</body>

</html>
