<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>รีเซ็ตรหัสผ่าน - ระบบตำแหน่งทางวิชาการ</title>
	<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: 'Sarabun', sans-serif;
			min-height: 100vh;
			background: linear-gradient(135deg, #0d1b3e 0%, #1a237e 30%, #0d47a1 60%, #1565c0 100%);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}

		.container {
			width: 100%;
			max-width: 440px;
		}

		.header {
			text-align: center;
			margin-bottom: 30px;
			color: #fff;
		}

		.header .logo-icon {
			width: 70px;
			height: 70px;
			background: rgba(255, 255, 255, 0.15);
			border-radius: 20px;
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0 auto 15px;
			backdrop-filter: blur(10px);
			border: 1px solid rgba(255, 255, 255, 0.2);
		}

		.header .logo-icon i {
			font-size: 32px;
			color: #fff;
		}

		.header h1 {
			font-size: 22px;
			font-weight: 700;
			margin-bottom: 5px;
		}

		.header p {
			font-size: 14px;
			opacity: 0.8;
		}

		.card {
			background: #fff;
			border-radius: 16px;
			padding: 35px 30px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
		}

		.card h2 {
			font-size: 20px;
			font-weight: 700;
			color: #1a237e;
			text-align: center;
			margin-bottom: 25px;
		}

		.form-group {
			margin-bottom: 18px;
		}

		.form-group label {
			display: block;
			font-size: 14px;
			font-weight: 600;
			color: #333;
			margin-bottom: 6px;
		}

		.form-group .input-wrapper {
			position: relative;
		}

		.form-group .input-wrapper i {
			position: absolute;
			left: 14px;
			top: 50%;
			transform: translateY(-50%);
			color: #999;
		}

		.form-group input {
			width: 100%;
			padding: 12px 14px 12px 42px;
			border: 2px solid #e0e0e0;
			border-radius: 10px;
			font-family: 'Sarabun', sans-serif;
			font-size: 15px;
			outline: none;
			transition: border-color 0.3s;
		}

		.form-group input:focus {
			border-color: #1a237e;
			box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.1);
		}

		.btn-primary {
			width: 100%;
			padding: 13px;
			border: none;
			border-radius: 10px;
			background: linear-gradient(135deg, #1a237e, #0d47a1);
			color: #fff;
			font-family: 'Sarabun', sans-serif;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.3s;
		}

		.btn-primary:hover {
			transform: translateY(-2px);
			box-shadow: 0 5px 20px rgba(13, 71, 161, 0.4);
		}

		.match-status {
			text-align: center;
			font-size: 13px;
			margin-top: -10px;
			margin-bottom: 15px;
			height: 18px;
		}

		.match-status.match {
			color: #2e7d32;
		}

		.match-status.no-match {
			color: #c62828;
		}

		.alert {
			padding: 12px 15px;
			border-radius: 10px;
			margin-bottom: 18px;
			font-size: 14px;
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.alert-danger {
			background: #ffebee;
			color: #c62828;
			border: 1px solid #ef9a9a;
		}

		.footer-text {
			text-align: center;
			margin-top: 25px;
			color: rgba(255, 255, 255, 0.6);
			font-size: 13px;
		}
	</style>
</head>

<body>
	<div class="container">
		<div class="header">
			<div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
			<h1>ระบบตำแหน่งทางวิชาการ</h1>
			<p>วิทยาลัยการคอมพิวเตอร์ มหาวิทยาลัยขอนแก่น</p>
		</div>
		<div class="card">
			<h2>รีเซ็ตรหัสผ่าน</h2>

			<div th:if="${errorMsg}" class="alert alert-danger">
				<i class="fas fa-exclamation-circle"></i>
				<span th:text="${errorMsg}"></span>
			</div>

			<form th:action="@{/reset-password}" method="post">
				<input type="hidden" name="token" th:value="${token}">
				<div class="form-group">
					<label>รหัสผ่านใหม่</label>
					<div class="input-wrapper">
						<i class="fas fa-lock"></i>
						<input type="password" name="password" id="password" placeholder="กรอกรหัสผ่านใหม่" required
							minlength="6">
					</div>
				</div>
				<div class="form-group">
					<label>ยืนยันรหัสผ่าน</label>
					<div class="input-wrapper">
						<i class="fas fa-lock"></i>
						<input type="password" name="confirmPassword" id="confirmPassword"
							placeholder="กรอกรหัสผ่านอีกครั้ง" required minlength="6">
					</div>
				</div>
				<div class="match-status" id="matchStatus"></div>
				<button type="submit" class="btn-primary">
					<i class="fas fa-check-circle"></i> รีเซ็ตรหัสผ่าน
				</button>
			</form>
		</div>
		<div class="footer-text">© 2025 วิทยาลัยการคอมพิวเตอร์ มหาวิทยาลัยขอนแก่น</div>
	</div>
	<script>
		const pw = document.getElementById('password');
		const cpw = document.getElementById('confirmPassword');
		const ms = document.getElementById('matchStatus');
		function check() {
			if (cpw.value.length > 0) {
				ms.textContent = pw.value === cpw.value ? '✓ รหัสผ่านตรงกัน' : '✗ รหัสผ่านไม่ตรงกัน';
				ms.className = 'match-status ' + (pw.value === cpw.value ? 'match' : 'no-match');
			} else { ms.textContent = ''; ms.className = 'match-status'; }
		}
		pw.addEventListener('input', check);
		cpw.addEventListener('input', check);
	</script>
</body>

</html>
