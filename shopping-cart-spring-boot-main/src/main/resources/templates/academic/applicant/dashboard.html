<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic :: layout(~{::section})}">

<body>
    <section>
        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3><i class="fas fa-tachometer-alt"></i> แดชบอร์ดผู้ยื่นคำร้อง</h3>
                <a href="/user/academic/new-request" class="btn btn-academic">
                    <i class="fas fa-plus-circle"></i> ยื่นคำร้องใหม่
                </a>
            </div>

            <div th:if="${requests == null || requests.isEmpty()}" class="text-center py-5">
                <i class="fas fa-folder-open fa-3x text-muted mb-3"></i>
                <p class="text-muted">ยังไม่มีคำร้อง กดปุ่ม "ยื่นคำร้องใหม่" เพื่อเริ่มต้น</p>
            </div>

            <div th:each="req : ${requests}" class="card card-academic mb-4">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h5 class="mb-1">คำร้องหมายเลข #[[${req.id}]]</h5>
                            <small class="text-muted">วันที่ยื่น: <span
                                    th:text="${#temporals.format(req.submissionDate, 'dd/MM/yyyy HH:mm')}"></span></small>
                        </div>
                        <span class="status-badge" th:classappend="'status-' + ${req.currentStatus.name()}"
                            th:text="${req.currentStatus.thaiLabel}"></span>
                    </div>

                    <!-- Progress Tracker -->
                    <div class="progress-tracker">
                        <div class="progress-step" th:each="status : ${statuses}" th:classappend="${req.currentStatus.name() == status.name()} ? 'active' : 
                                     (${req.currentStatus.ordinal() > status.ordinal()} ? 'completed' : '')">
                            <div class="step-icon">
                                <i th:if="${status.name() == 'COMPLETED_PASS'}" class="fas fa-check"></i>
                                <i th:if="${status.name() == 'COMPLETED_REVISE'}" class="fas fa-exclamation"></i>
                                <i th:if="${status.name() == 'REJECTED'}" class="fas fa-times"></i>
                                <i th:if="${status.name() != 'COMPLETED_PASS' && status.name() != 'COMPLETED_REVISE' && status.name() != 'REJECTED'}"
                                    class="fas fa-circle" style="font-size: 0.5rem;"></i>
                            </div>
                            <div class="step-label" th:text="${status.thaiLabel}"></div>
                        </div>
                    </div>

                    <!-- Meeting Date Display -->
                    <div th:if="${req.meetingDate != null}" class="alert alert-info d-flex align-items-center mb-3">
                        <i class="fas fa-calendar-alt me-2"></i>
                        <div>
                            <strong>วันประชุม:</strong> <span
                                th:text="${#temporals.format(req.meetingDate, 'dd/MM/yyyy HH:mm')}"></span>
                            <span th:if="${req.meetingLocation != null}"> | <strong>สถานที่:</strong>
                                [[${req.meetingLocation}]]</span>
                        </div>
                    </div>

                    <!-- Result Actions -->
                    <div th:if="${req.currentStatus.name() == 'COMPLETED_PASS'}" class="alert alert-success">
                        <i class="fas fa-check-circle me-2"></i> <strong>ผ่านการประเมิน</strong>
                        <a th:if="${req.resultFilePath != null}" th:href="'/user/academic/download-result/' + ${req.id}"
                            class="btn btn-sm btn-outline-success ms-2">
                            <i class="fas fa-download"></i> ดาวน์โหลดผลการประเมิน
                        </a>
                    </div>

                    <div th:if="${req.currentStatus.name() == 'COMPLETED_REVISE'}" class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle me-2"></i> <strong>ต้องแก้ไขเอกสาร</strong>
                        <form th:action="'/user/academic/upload-revision/' + ${req.id}" method="post"
                            enctype="multipart/form-data" class="mt-2">
                            <div class="input-group">
                                <input type="file" name="file" class="form-control" required>
                                <button type="submit" class="btn btn-warning"><i class="fas fa-upload"></i>
                                    อัปโหลดเอกสารที่แก้ไข</button>
                            </div>
                        </form>
                    </div>

                    <div th:if="${req.currentStatus.name() == 'REJECTED'}" class="alert alert-danger">
                        <i class="fas fa-times-circle me-2"></i> <strong>ไม่รับคำร้อง</strong>
                    </div>

                    <a th:href="'/user/academic/request/' + ${req.id}" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-eye"></i> ดูรายละเอียด
                    </a>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
