<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">

<head>
    <meta charset="UTF-8">
    <title>ระบบตำแหน่งทางวิชาการ - วิทยาลัยการคอมพิวเตอร์</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 260px;
            --sidebar-collapsed: 70px;
            --sidebar-bg: linear-gradient(180deg, #0d1b3e 0%, #1a237e 50%, #0d47a1 100%);
            --sidebar-hover: rgba(255, 255, 255, 0.08);
            --sidebar-active: rgba(255, 255, 255, 0.15);
            --accent-color: #42a5f5;
        }

        * {
            font-family: 'Sarabun', sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: #f0f2f5;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            z-index: 1050;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            overflow-y: auto;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
        }

        .sidebar-brand {
            padding: 24px 20px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .sidebar-brand .brand-icon {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 1.4rem;
            color: var(--accent-color);
        }

        .sidebar-brand h6 {
            color: #fff;
            margin: 0;
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .sidebar-brand small {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.7rem;
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px 0;
        }

        .sidebar-section-title {
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 12px 20px 6px;
            font-weight: 600;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 0.88rem;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .sidebar-link:hover {
            background: var(--sidebar-hover);
            color: #fff;
        }

        .sidebar-link.active {
            background: var(--sidebar-active);
            color: #fff;
            border-left-color: var(--accent-color);
        }

        .sidebar-link i {
            width: 20px;
            text-align: center;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.5);
            transition: color 0.2s;
        }

        .sidebar-link:hover i,
        .sidebar-link.active i {
            color: var(--accent-color);
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-user {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.82rem;
        }

        .sidebar-user .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            font-size: 0.95rem;
        }

        .sidebar-user .user-info {
            flex: 1;
            overflow: hidden;
        }

        .sidebar-user .user-name {
            color: #fff;
            font-weight: 600;
            font-size: 0.82rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-user .user-role {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .sidebar-logout {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.78rem;
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .sidebar-logout:hover {
            background: rgba(239, 83, 80, 0.15);
            color: #ef5350;
        }

        /* ===== Main Content ===== */
        .main-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .content-wrapper {
            flex: 1;
        }

        .main-footer {
            background: #fff;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            padding: 14px;
            font-size: 0.78rem;
            color: #888;
        }

        /* ===== Mobile Toggle ===== */
        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 1060;
            border: none;
            background: #1a237e;
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            font-size: 1.2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1040;
        }

        @media (max-width: 991px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.show {
                transform: translateX(0);
            }

            .sidebar-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .sidebar-overlay.show {
                display: block;
            }

            .main-content {
                margin-left: 0;
            }
        }

        /* ===== Reusable Components ===== */
        .card-academic {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .status-badge {
            padding: 5px 13px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .status-RECEIVED {
            background: #e3f2fd;
            color: #1565c0;
        }

        .status-SUB_COMMITTEE_APPOINTED {
            background: #fff3e0;
            color: #e65100;
        }

        .status-MEETING_SCHEDULED {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .status-COMPLETED_PASS {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-COMPLETED_REVISE {
            background: #fff8e1;
            color: #f57f17;
        }

        .status-REJECTED {
            background: #ffebee;
            color: #c62828;
        }

        .progress-tracker {
            display: flex;
            justify-content: space-between;
            margin: 30px 0;
            position: relative;
        }

        .progress-tracker::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 5%;
            right: 5%;
            height: 3px;
            background: #dee2e6;
            z-index: 0;
        }

        .progress-step {
            text-align: center;
            position: relative;
            z-index: 1;
            flex: 1;
        }

        .progress-step .step-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-size: 1.1rem;
            border: 3px solid #dee2e6;
            background: #fff;
            transition: all 0.3s;
        }

        .progress-step.active .step-icon {
            border-color: #1565c0;
            background: #1565c0;
            color: #fff;
        }

        .progress-step.completed .step-icon {
            border-color: #2e7d32;
            background: #2e7d32;
            color: #fff;
        }

        .progress-step.revise .step-icon {
            border-color: #f57f17;
            background: #f57f17;
            color: #fff;
        }

        .progress-step.rejected .step-icon {
            border-color: #c62828;
            background: #c62828;
            color: #fff;
        }

        .progress-step .step-label {
            font-size: 0.72rem;
            color: #666;
        }

        .progress-step.active .step-label,
        .progress-step.completed .step-label {
            color: #333;
            font-weight: 600;
        }

        .doc-card {
            border-left: 4px solid #1565c0;
            transition: transform 0.2s;
        }

        .doc-card:hover {
            transform: translateY(-2px);
        }

        .doc-card.generated {
            border-left-color: #2e7d32;
        }

        .btn-academic {
            background: linear-gradient(135deg, #1a237e, #0d47a1);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 20px;
        }

        .btn-academic:hover {
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: #fff;
        }
    </style>
</head>

<body>

    <!-- Mobile Toggle -->
    <button class="sidebar-toggle" id="sidebarToggle">
        <i class="fas fa-bars"></i>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ===== Left Sidebar ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
            <h6>ระบบตำแหน่งทางวิชาการ</h6>
            <small>วิทยาลัยการคอมพิวเตอร์ มข.</small>
        </div>

        <nav class="sidebar-nav">
            <!-- ADMIN Navigation -->
            <th:block th:if="${user != null && user.role == 'ROLE_ADMIN'}">
                <div class="sidebar-section-title">จัดการระบบ</div>
                <a href="/admin/academic/requests" class="sidebar-link" id="nav-requests">
                    <i class="fas fa-clipboard-list"></i> คำร้องทั้งหมด
                </a>
                <a href="/admin/academic/staff" class="sidebar-link" id="nav-staff">
                    <i class="fas fa-users-cog"></i> จัดการบุคลากร
                </a>
            </th:block>

            <!-- USER Navigation -->
            <th:block th:if="${user != null && user.role == 'ROLE_USER'}">
                <div class="sidebar-section-title">เมนูหลัก</div>
                <a href="/user/academic/dashboard" class="sidebar-link" id="nav-dashboard">
                    <i class="fas fa-tachometer-alt"></i> แดชบอร์ด
                </a>
                <a href="/user/academic/new-request" class="sidebar-link" id="nav-new">
                    <i class="fas fa-plus-circle"></i> ยื่นคำร้องใหม่
                </a>
            </th:block>

            <div class="sidebar-section-title">อื่นๆ</div>
            <a href="/" class="sidebar-link">
                <i class="fas fa-home"></i> กลับหน้าหลัก
            </a>
        </nav>

        <!-- Sidebar Footer: User Info -->
        <div class="sidebar-footer" th:if="${user != null}">
            <div class="sidebar-user">
                <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                <div class="user-info">
                    <div class="user-name" th:text="${user.name}"></div>
                    <div class="user-role" th:text="${user.role == 'ROLE_ADMIN'} ? 'ผู้ดูแลระบบ' : 'ผู้ยื่นคำร้อง'">
                    </div>
                </div>
            </div>
            <a href="/logout" class="sidebar-logout">
                <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
            </a>
        </div>
    </aside>

    <!-- ===== Main Content ===== -->
    <div class="main-content">
        <div class="content-wrapper" th:replace="${content}"></div>
        <footer class="main-footer">
            © 2567 วิทยาลัยการคอมพิวเตอร์ มหาวิทยาลัยขอนแก่น — ระบบติดตามการยื่นขอตำแหน่งทางวิชาการ
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Mobile sidebar toggle
        const toggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        toggle.addEventListener('click', () => {
            sidebar.classList.toggle('show');
            overlay.classList.toggle('show');
        });
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('show');
            overlay.classList.remove('show');
        });

        // Active link highlighting
        const path = window.location.pathname;
        document.querySelectorAll('.sidebar-link').forEach(link => {
            if (link.getAttribute('href') && path.startsWith(link.getAttribute('href')) && link.getAttribute('href') !== '/') {
                link.classList.add('active');
            }
        });
    </script>
</body>

</html>
