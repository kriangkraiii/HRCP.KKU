<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic :: layout(~{::section})}">

<body>
    <section>
        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3><i class="fas fa-list"></i> คำร้องทั้งหมด</h3>
                <a href="/admin/academic/staff" class="btn btn-outline-primary"><i class="fas fa-users"></i>
                    จัดการบุคลากร</a>
            </div>

            <!-- Search Bar -->
            <div class="card card-academic mb-3">
                <div class="card-body py-2">
                    <form action="/admin/academic/requests" method="get" class="d-flex gap-2">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-search"></i></span>
                            <input type="text" name="search" class="form-control" placeholder="ค้นหาชื่อผู้ยื่นคำร้อง..."
                                th:value="${search}">
                        </div>
                        <button type="submit" class="btn btn-academic">ค้นหา</button>
                        <a href="/admin/academic/requests" class="btn btn-outline-secondary" th:if="${search != null && !search.isEmpty()}">
                            <i class="fas fa-times"></i> ล้าง
                        </a>
                    </form>
                </div>
            </div>

            <div th:if="${search != null && !search.isEmpty()}" class="alert alert-info mb-3">
                <i class="fas fa-info-circle me-2"></i> ผลการค้นหา "<strong th:text="${search}"></strong>": พบ <strong th:text="${requests != null ? requests.size() : 0}"></strong> รายการ
            </div>

            <div class="card card-academic">
                <div class="card-body">
                    <div th:if="${requests == null || requests.isEmpty()}" class="text-center py-4 text-muted">
                        ยังไม่มีคำร้อง
                    </div>
                    <div class="table-responsive" th:if="${requests != null && !requests.isEmpty()}">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>ผู้ยื่นคำร้อง</th>
                                    <th>อีเมล</th>
                                    <th>วันที่ยื่น</th>
                                    <th>สถานะ</th>
                                    <th>จัดการ</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="req : ${requests}">
                                    <td th:text="${req.id}"></td>
                                    <td th:text="${req.applicant.name}"></td>
                                    <td th:text="${req.applicant.email}"></td>
                                    <td th:text="${#temporals.format(req.submissionDate, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td>
                                        <span class="status-badge"
                                            th:classappend="'status-' + ${req.currentStatus.name()}"
                                            th:text="${req.currentStatus.thaiLabel}"></span>
                                    </td>
                                    <td>
                                        <a th:href="'/admin/academic/request/' + ${req.id}"
                                            class="btn btn-sm btn-academic">
                                            <i class="fas fa-cog"></i> จัดการ
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
