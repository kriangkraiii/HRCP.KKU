<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic :: layout(~{::section})}">

<body>
    <section>
        <div class="container py-4">
            <div class="card card-academic">
                <div class="card-header bg-white">
                    <h4 class="mb-0"><i class="fas fa-file-alt"></i> เอกสารที่ [[${documentType}]]: [[${documentLabel}]]</h4>
                    <small class="text-muted">คำร้องหมายเลข #[[${request.id}]] — ผู้ยื่น: [[${request.applicant.name}]]</small>
                </div>
                <div class="card-body">
                    <form th:action="'/admin/academic/request/' + ${request.id} + '/document/' + ${documentType}"
                        method="post" id="docForm">

                        <div th:if="${doc6Data != null}" class="alert alert-info mb-3">
                            <i class="fas fa-info-circle"></i> ข้อมูลด้านล่างถูกดึงจากผลการประเมิน (เอกสารที่ 6) โดยอัตโนมัติ สามารถแก้ไขได้
                        </div>
                        <h5 class="border-bottom pb-2 mb-3">ข้อมูลการประชุม</h5>
                        <div class="row mb-3">
                            <div class="col-md-4"><label class="form-label">ครั้งที่/ปี</label><input type="text"
                                    name="meeting_no" class="form-control" placeholder="1/2569"></div>
                            <div class="col-md-4"><label class="form-label">วันที่ประชุม</label>
                                <div class="input-group">
                                    <input type="text" name="meeting_date" class="form-control thai-full-date">
                                    <input type="date" class="thai-date-picker" style="position:absolute;opacity:0;width:0;height:0;pointer-events:none;">
                                    <button type="button" class="btn btn-outline-secondary thai-date-btn" title="เลือกวันที่"><i class="fas fa-calendar-alt"></i></button>
                                </div>
                            </div>
                        </div>
                        <h5 class="border-bottom pb-2 mb-3">ข้อมูลวิชา</h5>
                        <div class="row mb-3">
                            <div class="col-md-4"><label class="form-label">รหัสวิชา</label><input type="text"
                                    name="course_code" class="form-control"></div>
                            <div class="col-md-4"><label class="form-label">ชื่อวิชา</label><input type="text"
                                    name="course_name" class="form-control"></div>
                            <div class="col-md-2">
                                <label class="form-label">คำนำหน้า</label>
                                <input type="text" name="applicant_title" class="form-control" list="titleList7" placeholder="คำนำหน้า"
                                    th:value="${request.applicant.academicPosition != null && !request.applicant.academicPosition.isEmpty()
                                        ? request.applicant.academicPosition
                                        : request.applicant.title}">
                                <datalist id="titleList7">
                                    <option value="นาย">
                                    <option value="นาง">
                                    <option value="นางสาว">
                                    <option value="ผู้ช่วยศาสตราจารย์">
                                    <option value="รองศาสตราจารย์">
                                    <option value="ศาสตราจารย์">
                                </datalist>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">ชื่อผู้ยื่น</label>
                                <input type="text" name="applicant_name" class="form-control"
                                    th:value="${request.applicant.name}">
                            </div>
                        </div>
                        <h5 class="border-bottom pb-2 mb-3">ผลการประเมิน</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">คะแนนรวม (จาก doc6)</label>
                                <input type="text" class="form-control" readonly
                                    th:value="${doc6Data != null ? doc6Data.getOrDefault('scorex', '-') : '-'}">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input final-level-chk" id="fl1" data-hidden="fl1_val"
                                        th:checked="${doc6Data != null && doc6Data.getOrDefault('eval_result_level', '') == 'ชำนาญ'}"
                                        style="pointer-events:none;" onclick="return false;">
                                    <input type="hidden" name="final_level_1" id="fl1_val"
                                        th:value="${doc6Data != null && doc6Data.getOrDefault('eval_result_level', '') == 'ชำนาญ' ? '✓' : ' '}">
                                    <label class="form-check-label" for="fl1">ชำนาญ</label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input final-level-chk" id="fl2" data-hidden="fl2_val"
                                        th:checked="${doc6Data != null && doc6Data.getOrDefault('eval_result_level', '') == 'ชำนาญพิเศษ'}"
                                        style="pointer-events:none;" onclick="return false;">
                                    <input type="hidden" name="final_level_2" id="fl2_val"
                                        th:value="${doc6Data != null && doc6Data.getOrDefault('eval_result_level', '') == 'ชำนาญพิเศษ' ? '✓' : ' '}">
                                    <label class="form-check-label" for="fl2">ชำนาญพิเศษ</label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input final-level-chk" id="fl3" data-hidden="fl3_val"
                                        th:checked="${doc6Data != null && doc6Data.getOrDefault('eval_result_level', '') == 'เชี่ยวชาญ'}"
                                        style="pointer-events:none;" onclick="return false;">
                                    <input type="hidden" name="final_level_3" id="fl3_val"
                                        th:value="${doc6Data != null && doc6Data.getOrDefault('eval_result_level', '') == 'เชี่ยวชาญ' ? '✓' : ' '}">
                                    <label class="form-check-label" for="fl3">เชี่ยวชาญ</label>
                                </div>
                            </div>
                        </div>
                        <h5 class="border-bottom pb-2 mb-3">ประธานคณะกรรมการ</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">ชื่อประธานคณะกรรมการ</label>
                                <div class="combo-input">
                                    <input type="text" name="committee_president_name" class="form-control" list="staffList7b" placeholder="เลือกหรือพิมพ์ชื่อ...">
                                    <datalist id="staffList7b">
                                        <option th:each="s : ${staffMembers}" th:value="${s.displayName}"></option>
                                    </datalist>
                                </div>
                            </div>
                        </div>
                        <h5 class="border-bottom pb-2 mb-3">วันที่ลงนาม</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">วันที่ลงนาม</label>
                                <div class="input-group">
                                    <input type="text" name="sign_date" class="form-control thai-full-date">
                                    <input type="date" class="thai-date-picker" style="position:absolute;opacity:0;width:0;height:0;pointer-events:none;">
                                    <button type="button" class="btn btn-outline-secondary thai-date-btn" title="เลือกวันที่"><i class="fas fa-calendar-alt"></i></button>
                                </div>
                            </div>
                        </div>

                        <div th:if="${param.saved != null}" class="alert alert-success alert-dismissible fade show mt-3">
                            <i class="fas fa-save"></i> บันทึกแบบร่างสำเร็จ
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <th:block th:replace="~{academic/admin/doc_fragments/_common :: buttons}"></th:block>
                    </form>
                </div>
            </div>
        </div>

        <input type="hidden" id="currentDocType" th:value="${documentType}">
        <input type="hidden" id="existingDataHolder" th:if="${existingData != null}" th:value="${existingData}">
        <link rel="stylesheet" href="/css/doc_preview.css">
        <script src="/js/doc_preview.js"></script>
        <th:block th:replace="~{academic/admin/doc_fragments/_common :: scripts}"></th:block>
        <script>
            // แปลงเลขอาราบิกเป็นเลขไทย + จัดรูปแบบวันที่ "เดือน" และ "พ.ศ."
            (function() {
                var thaiMonths = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                    'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
                var thaiDigits = ['๐','๑','๒','๓','๔','๕','๖','๗','๘','๙'];

                function toThai(str) {
                    return String(str).replace(/\d/g, function(d) { return thaiDigits[d]; });
                }

                function formatThaiDate(dateStr) {
                    if (!dateStr) return '';
                    // ถ้ามี "เดือน" อยู่แล้วให้แปลงเลขไทยอย่างเดียว
                    if (dateStr.indexOf('เดือน') !== -1) return toThai(dateStr);
                    // parse "7 มีนาคม 2569" → "๗ เดือน มีนาคม พ.ศ. ๒๕๖๙"
                    var m = dateStr.match(/^(\d{1,2})\s+(\S+)\s+(\d{4})$/);
                    if (m) return toThai(m[1]) + ' เดือน ' + m[2] + ' พ.ศ. ' + toThai(m[3]);
                    return toThai(dateStr);
                }

                function fromPickerDate(d) {
                    return toThai(d.getDate()) + ' เดือน ' + thaiMonths[d.getMonth()] + ' พ.ศ. ' + toThai(d.getFullYear() + 543);
                }

                document.addEventListener('DOMContentLoaded', function() {
                    // meeting_date: แปลงเลขไทยอย่างเดียว (ไม่ใส่ เดือน/พ.ศ.)
                    var meetingInput = document.querySelector('input[name="meeting_date"]');
                    if (meetingInput) {
                        if (meetingInput.value) meetingInput.value = toThai(meetingInput.value);
                        var meetingPicker = meetingInput.closest('.input-group').querySelector('.thai-date-picker');
                        if (meetingPicker) {
                            meetingPicker.addEventListener('change', function() {
                                if (this.value) {
                                    var d = new Date(this.value);
                                    meetingInput.value = toThai(d.getDate()) + ' ' + thaiMonths[d.getMonth()] + ' ' + toThai(d.getFullYear() + 543);
                                }
                            });
                        }
                    }

                    // sign_date: แปลงเลขไทย + ใส่ เดือน/พ.ศ.
                    var signInput = document.querySelector('input[name="sign_date"]');
                    if (signInput) {
                        if (signInput.value) signInput.value = formatThaiDate(signInput.value);
                        var signPicker = signInput.closest('.input-group').querySelector('.thai-date-picker');
                        if (signPicker) {
                            signPicker.addEventListener('change', function() {
                                if (this.value) signInput.value = fromPickerDate(new Date(this.value));
                            });
                        }
                    }

                    // meeting_no: แปลงเลขอาราบิกเป็นเลขไทย
                    var meetingNo = document.querySelector('input[name="meeting_no"]');
                    if (meetingNo) {
                        if (meetingNo.value) meetingNo.value = toThai(meetingNo.value);
                        meetingNo.addEventListener('input', function() {
                            var pos = this.selectionStart;
                            this.value = toThai(this.value);
                            this.setSelectionRange(pos, pos);
                        });
                    }
                });
            })();

        </script>
    </section>
</body>

</html>
