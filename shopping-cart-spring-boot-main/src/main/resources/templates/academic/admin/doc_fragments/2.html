<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <!-- Hidden fields สำหรับเช็คติ๊ก (เริ่มต้นยังไม่ติ๊ก) -->
    <input type="hidden" name="chk_dean_sign1" id="chk_dean_sign1" value="">
    <input type="hidden" name="chk_hr_verify" id="chk_hr_verify" value="">
    <input type="hidden" name="chk_cs_head" id="chk_cs_head" value="">
    <input type="hidden" name="chk_cs_head2" id="chk_cs_head2" value="">
    <input type="hidden" name="chk_dean_sign2" id="chk_dean_sign2" value="">
    <input type="hidden" name="chk_dean_sign3" id="chk_dean_sign3" value="">

    <!-- ส่วนที่ (2) เรียน คณบดี ผ่าน ภารกิจด้านทรัพยากรบุคคล -->
    <h5 class="border-bottom pb-2 mb-3">ส่วนที่ (2) เรียน คณบดี</h5>
    <div class="row mb-3">
        <div class="col-md-12 mb-2">
            <div class="form-check">
                <input type="checkbox" class="form-check-input chk-toggle" id="chk_dean_sign1_cb" data-target="chk_dean_sign1">
                <label class="form-check-label" for="chk_dean_sign1_cb">เพื่อโปรดพิจารณา</label>
            </div>
        </div>
    </div>
    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">ชื่อคณบดี</label>
            <div class="combo-input">
                <input type="text" name="dropdownDeanName" class="form-control" list="deanList" placeholder="เลือกหรือพิมพ์ชื่อ...">
                <datalist id="deanList">
                    <option th:each="d : ${deans}" th:value="${d.displayName}"></option>
                </datalist>
            </div>
        </div>
        <div class="col-md-6">
            <label class="form-label">ตำแหน่งคณบดี</label>
            <input type="text" name="dropdownDean" class="form-control"
                value="คณบดีวิทยาลัยการคอมพิวเตอร์">
        </div>
    </div>

    <!-- ส่วนที่ (3) เรียน หัวหน้าสาขาวิชาฯ -->
    <h5 class="border-bottom pb-2 mb-3">ส่วนที่ (3) หัวหน้าสาขาวิชาฯ</h5>
    <div class="row mb-3">
        <div class="col-md-12 mb-2">
            <div class="form-check">
                <input type="checkbox" class="form-check-input chk-toggle" id="chk_hr_verify_cb" data-target="chk_hr_verify">
                <label class="form-check-label" for="chk_hr_verify_cb">เห็นควรแต่งตั้งคณะอนุกรรมการประเมินผลการสอนและนัดวันประเมินผลการสอนต่อไป</label>
            </div>
        </div>
    </div>
    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">ชื่อเจ้าหน้าที่ (ภารกิจทรัพยากรบุคคล)</label>
            <div class="combo-input">
                <input type="text" name="hrName" class="form-control" list="hrList" placeholder="เลือกหรือพิมพ์ชื่อ...">
                <datalist id="hrList">
                    <option th:each="h : ${hrStaff}" th:value="${h.displayName}"></option>
                </datalist>
            </div>
        </div>
        <div class="col-md-6">
            <label class="form-label">ตำแหน่ง</label>
            <input type="text" name="dropdownHr" class="form-control"
                value="เจ้าหน้าที่บริหารงานทั่วไป">
        </div>
    </div>

    <!-- ส่วนที่ (4) เรียน คณบดี (หัวหน้าสาขา) -->
    <h5 class="border-bottom pb-2 mb-3">ส่วนที่ (4) เรียน คณบดี (จากหัวหน้าสาขา)</h5>
    <div class="row mb-3">
        <div class="col-md-12 mb-2">
            <div class="form-check">
                <input type="checkbox" class="form-check-input chk-toggle" id="chk_cs_head_cb" data-target="chk_cs_head">
                <label class="form-check-label" for="chk_cs_head_cb">เพื่อโปรดพิจารณา</label>
            </div>
            <div class="form-check mt-1">
                <input type="checkbox" class="form-check-input chk-toggle" id="chk_cs_head2_cb" data-target="chk_cs_head2">
                <label class="form-check-label" for="chk_cs_head2_cb">เห็นควรแต่งตั้งคณะอนุกรรมการประเมิน จำนวน 3 รายชื่อ</label>
            </div>
        </div>
    </div>
    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">ชื่อหัวหน้าสาขา</label>
            <div class="combo-input">
                <input type="text" name="dropdownCsHeadName" class="form-control" list="headList" placeholder="เลือกหรือพิมพ์ชื่อ...">
                <datalist id="headList">
                    <option th:each="h : ${heads}" th:value="${h.displayName}"></option>
                </datalist>
            </div>
        </div>
        <div class="col-md-6">
            <label class="form-label">ตำแหน่งหัวหน้าสาขา</label>
            <input type="text" name="dropdownCsHead" class="form-control"
                value="หัวหน้าสาขาวิทยาการคอมพิวเตอร์">
        </div>
    </div>

    <!-- ส่วนที่ (5) ความเห็นคณบดี -->
    <h5 class="border-bottom pb-2 mb-3">ส่วนที่ (5) ความเห็นคณบดี</h5>
    <div class="row mb-3">
        <div class="col-md-12 mb-2">
            <div class="form-check">
                <input type="checkbox" class="form-check-input chk-toggle" id="chk_dean_sign2_cb" data-target="chk_dean_sign2">
                <label class="form-check-label" for="chk_dean_sign2_cb">เห็นชอบ และดำเนินการนัดวันประเมินผลการสอนต่อไป</label>
            </div>
            <div class="form-check mt-1">
                <input type="checkbox" class="form-check-input chk-toggle" id="chk_dean_sign3_cb" data-target="chk_dean_sign3">
                <label class="form-check-label" for="chk_dean_sign3_cb">ลงนามคณบดี (ส่วนที่ 5)</label>
            </div>
        </div>
    </div>

    <!-- รายชื่อกรรมการ -->
    <h5 class="border-bottom pb-2 mb-3">รายชื่อกรรมการ (3 ท่าน)</h5>
    <div class="row mb-3" th:each="i : ${#numbers.sequence(1, 3)}">
        <div class="col-md-6">
            <label class="form-label">กรรมการคนที่ [[${i}]]</label>
            <div class="combo-input">
                <input type="text" th:name="'n_' + ${i}" class="form-control" th:list="'committeeList2_' + ${i}" placeholder="เลือกหรือพิมพ์ชื่อ...">
                <datalist th:id="'committeeList2_' + ${i}">
                    <option th:each="c : ${committee}" th:value="${c.displayName}"></option>
                </datalist>
            </div>
        </div>
        <div class="col-md-6">
            <label class="form-label">ตำแหน่ง</label>
            <input type="text" th:name="'n_position_' + ${i}" class="form-control"
                th:value="${i == 1 ? 'ประธานอนุกรรมการ' : (i == 3 ? 'อนุกรรมการและเลขานุการ' : 'อนุกรรมการ')}">
        </div>
    </div>
</div>
</body>
</html>
