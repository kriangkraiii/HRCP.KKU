<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic :: layout(~{::section})}">

<body>
    <section>
        <div class="container py-4">
            <div class="card card-academic">
                <div class="card-header bg-white">
                    <h4 class="mb-0"><i class="fas fa-file-alt"></i> เอกสารที่ [[${documentType}]]: [[${documentLabel}]]</h4>
                    <small class="text-muted">คำร้องหมายเลข #[[${request.id}]] — ผู้ยื่น: [[${request.applicant.name}]]</small>
                </div>
                <div class="card-body">
                    <form th:action="'/admin/academic/request/' + ${request.id} + '/document/' + ${documentType}"
                        method="post" id="docForm">

                        <div class="alert alert-info"><i class="fas fa-info-circle"></i> เอกสารนี้จะถูกสร้าง 3 ชุด
                            สำหรับกรรมการแต่ละท่าน</div>
                        <h5 class="border-bottom pb-2 mb-3">ข้อมูลเอกสาร</h5>
                        <div class="row mb-3">
                            <div class="col-md-8"><label class="form-label">เรื่อง</label><input type="text"
                                    name="text" class="form-control" value="ขอเชิญประชุมคณะอนุกรรมการ..."></div>
                            <div class="col-md-4"><label class="form-label">วันที่</label>
                                <div class="input-group">
                                    <input type="text" name="currentDate" class="form-control thai-full-date">
                                    <input type="date" class="thai-date-picker" style="position:absolute;opacity:0;width:0;height:0;pointer-events:none;">
                                    <button type="button" class="btn btn-outline-secondary thai-date-btn" title="เลือกวันที่"><i class="fas fa-calendar-alt"></i></button>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4"><label class="form-label">เลขที่อ้างอิง</label><input type="text"
                                    name="no" class="form-control"></div>
                            <div class="col-md-4"><label class="form-label">ปี</label><input type="text" name="year"
                                    class="form-control thai-year"></div>
                            <div class="col-md-4"><label class="form-label">คณะกรรมการ</label><input type="text"
                                    name="committee" class="form-control" value="คณะอนุกรรมการประเมินผลการสอน">
                            </div>
                        </div>
                        <h5 class="border-bottom pb-2 mb-3">ข้อมูลผู้ยื่น</h5>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">ชื่อผู้ยื่น</label>
                                <div class="combo-input">
                                    <input type="text" name="name" class="form-control" list="staffList4" placeholder="เลือกหรือพิมพ์ชื่อ..."
                                        th:value="${request.applicant.title != null ? request.applicant.title + ' ' + request.applicant.name : request.applicant.name}">
                                    <datalist id="staffList4">
                                        <option th:each="s : ${staffMembers}" th:value="${s.displayName}"></option>
                                    </datalist>
                                </div>
                            </div>
                            <div class="col-md-4"><label class="form-label">วันที่แต่งตั้ง</label>
                                <div class="input-group">
                                    <input type="text" name="date_month_year" class="form-control thai-full-date">
                                    <input type="date" class="thai-date-picker" style="position:absolute;opacity:0;width:0;height:0;pointer-events:none;">
                                    <button type="button" class="btn btn-outline-secondary thai-date-btn" title="เลือกวันที่"><i class="fas fa-calendar-alt"></i></button>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">ประเภท</label>
                                <input type="text" name="dropdown1" class="form-control" list="typeList4" placeholder="เลือกหรือพิมพ์...">
                                <datalist id="typeList4">
                                    <option value="พนักงานมหาวิทยาลัย">
                                    <option value="ข้าราชการ">
                                </datalist>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">ตำแหน่งปัจจุบัน</label>
                                <input type="text" name="dropdown2" class="form-control" list="posList4" placeholder="เลือกหรือพิมพ์...">
                                <datalist id="posList4">
                                    <option value="อาจารย์">
                                    <option value="ผู้ช่วยศาสตราจารย์">
                                    <option value="รองศาสตราจารย์">
                                </datalist>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ตำแหน่งที่ขอ</label>
                                <input type="text" name="dropdown3" class="form-control" list="posReqList4" placeholder="เลือกหรือพิมพ์...">
                                <datalist id="posReqList4">
                                    <option value="ผู้ช่วยศาสตราจารย์">
                                    <option value="รองศาสตราจารย์">
                                    <option value="ศาสตราจารย์">
                                </datalist>
                            </div>
                        </div>
                        <h5 class="border-bottom pb-2 mb-3">วันเวลาประชุม</h5>
                        <div class="row mb-3">
                            <div class="col-md-4"><label class="form-label">วันที่ประชุม</label>
                                <div class="input-group">
                                    <input type="text" name="date_month_year2" class="form-control thai-full-date">
                                    <input type="date" class="thai-date-picker" style="position:absolute;opacity:0;width:0;height:0;pointer-events:none;">
                                    <button type="button" class="btn btn-outline-secondary thai-date-btn" title="เลือกวันที่"><i class="fas fa-calendar-alt"></i></button>
                                </div>
                            </div>
                            <div class="col-md-2"><label class="form-label">เวลาเริ่ม</label><input type="text"
                                    name="time1" class="form-control" placeholder="09.30"></div>
                            <div class="col-md-2"><label class="form-label">เวลาสิ้นสุด</label><input type="text"
                                    name="time2" class="form-control" placeholder="11.00"></div>
                            <div class="col-md-4"><label class="form-label">สถานที่</label><input type="text"
                                    name="place" class="form-control"></div>
                        </div>
                        <h5 class="border-bottom pb-2 mb-3">กรรมการ 3 ท่าน (สร้าง 3 ชุด)</h5>
                        <div th:each="i : ${#numbers.sequence(1, 3)}" class="card p-3 mb-2">
                            <div class="row">
                                <div class="col-md-6">
                                    <label class="form-label">กรรมการคนที่ [[${i}]]</label>
                                    <div class="combo-input">
                                        <input type="text" th:name="'committee_name_' + ${i}" class="form-control" th:list="'committeeList4_' + ${i}" placeholder="เลือกหรือพิมพ์ชื่อ..."
                                            th:value="${i == 1 ? defaultCommittee1 : (i == 2 ? defaultCommittee2 : defaultCommittee3)}">
                                        <datalist th:id="'committeeList4_' + ${i}">
                                            <option th:each="c : ${committee}" th:value="${c.displayName}"></option>
                                        </datalist>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">ตำแหน่ง</label>
                                    <input type="text" th:name="'committee_position_' + ${i}" class="form-control"
                                        th:value="${i == 1 ? 'ประธานอนุกรรมการ' : (i == 3 ? 'อนุกรรมการและเลขานุการ' : 'อนุกรรมการ')}">
                                </div>
                            </div>
                        </div>
                        <h5 class="border-bottom pb-2 mb-3">ลงนาม</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">ชื่อคณบดี</label>
                                <div class="combo-input">
                                    <input type="text" name="dropdownDeanName" class="form-control" list="deanList4" placeholder="เลือกหรือพิมพ์ชื่อ...">
                                    <datalist id="deanList4">
                                        <option th:each="d : ${deans}" th:value="${d.displayName}"></option>
                                    </datalist>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ตำแหน่ง</label>
                                <input type="text" name="dropdownDean" class="form-control"
                                    value="คณบดีวิทยาลัยการคอมพิวเตอร์">
                            </div>
                        </div>

                        <div th:if="${param.saved != null}" class="alert alert-success alert-dismissible fade show mt-3">
                            <i class="fas fa-save"></i> บันทึกแบบร่างสำเร็จ
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <th:block th:replace="~{academic/admin/doc_fragments/_common :: buttons}"></th:block>
                    </form>
                </div>
            </div>
        </div>

        <input type="hidden" id="currentDocType" th:value="${documentType}">
        <input type="hidden" id="existingDataHolder" th:if="${existingData != null}" th:value="${existingData}">
        <link rel="stylesheet" href="/css/doc_preview.css">
        <script src="/js/doc_preview.js"></script>
        <th:block th:replace="~{academic/admin/doc_fragments/_common :: scripts}"></th:block>
    </section>
</body>

</html>
