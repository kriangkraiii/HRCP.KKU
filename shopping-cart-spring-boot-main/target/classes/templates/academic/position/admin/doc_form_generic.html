<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic :: layout(~{::section})}">
<body>
    <section>
        <div class="container py-4">
            <h3 class="mb-4">
                <i class="fas fa-file-alt"></i> เอกสารที่ [[${documentType}]]: [[${documentLabel}]]
            </h3>
            <div class="alert alert-info">
                <i class="fas fa-info-circle"></i> เอกสารนี้กรอกโดย <strong>ผู้ยื่นคำร้อง</strong> —
                แอดมินสามารถดูและแก้ไขได้
            </div>

            <form th:action="'/admin/position/request/' + ${request.id} + '/document/' + ${documentType}" method="post">
                <div class="card card-academic mb-4">
                    <div class="card-header bg-white"><h5 class="mb-0">ข้อมูลเอกสาร (JSON)</h5></div>
                    <div class="card-body">
                        <div th:if="${existingData != null}">
                            <div id="formFields"></div>
                        </div>
                        <div th:unless="${existingData != null}" class="text-muted text-center py-4">
                            <i class="fas fa-hourglass-half fa-2x mb-2"></i>
                            <p>ผู้ยื่นคำร้องยังไม่ได้กรอกเอกสารนี้</p>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2" th:if="${existingData != null}">
                    <button type="submit" class="btn btn-academic btn-lg">
                        <i class="fas fa-save"></i> บันทึกและสร้างเอกสาร
                    </button>
                    <a th:href="'/admin/position/request/' + ${request.id}" class="btn btn-outline-secondary btn-lg">
                        <i class="fas fa-arrow-left"></i> กลับ
                    </a>
                </div>
                <div th:unless="${existingData != null}">
                    <a th:href="'/admin/position/request/' + ${request.id}" class="btn btn-outline-secondary btn-lg">
                        <i class="fas fa-arrow-left"></i> กลับ
                    </a>
                </div>
            </form>
        </div>

        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
                const existingData = /*[[${existingData}]]*/ null;
                if (!existingData) return;

                try {
                    const data = JSON.parse(existingData);
                    const container = document.getElementById('formFields');
                    if (!container) return;

                    for (const [key, value] of Object.entries(data)) {
                        if (key.startsWith('_')) continue;
                        const div = document.createElement('div');
                        div.className = 'row g-2 mb-2';
                        div.innerHTML = `
                            <div class="col-md-4">
                                <label class="form-label fw-bold">${key}</label>
                            </div>
                            <div class="col-md-8">
                                <input type="text" name="${key}" value="${value || ''}" class="form-control">
                            </div>
                        `;
                        container.appendChild(div);
                    }
                } catch(e) {
                    console.error('Failed to parse doc data:', e);
                }
            });
        </script>
    </section>
</body>
</html>
