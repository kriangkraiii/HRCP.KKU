<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic :: layout(~{::section})}">

<body>
    <section>
        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3><i class="fas fa-list"></i> คำร้องทั้งหมด</h3>
                <a href="/admin/academic/staff" class="btn btn-outline-primary"><i class="fas fa-users"></i>
                    จัดการบุคลากร</a>
            </div>

            <div class="card card-academic">
                <div class="card-body">
                    <div th:if="${requests == null || requests.isEmpty()}" class="text-center py-4 text-muted">
                        ยังไม่มีคำร้อง
                    </div>
                    <div class="table-responsive" th:if="${requests != null && !requests.isEmpty()}">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>ผู้ยื่นคำร้อง</th>
                                    <th>อีเมล</th>
                                    <th>วันที่ยื่น</th>
                                    <th>สถานะ</th>
                                    <th>จัดการ</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="req : ${requests}">
                                    <td th:text="${req.id}"></td>
                                    <td th:text="${req.applicant.name}"></td>
                                    <td th:text="${req.applicant.email}"></td>
                                    <td th:text="${#temporals.format(req.submissionDate, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td>
                                        <span class="status-badge"
                                            th:classappend="'status-' + ${req.currentStatus.name()}"
                                            th:text="${req.currentStatus.thaiLabel}"></span>
                                    </td>
                                    <td>
                                        <a th:href="'/admin/academic/request/' + ${req.id}"
                                            class="btn btn-sm btn-academic">
                                            <i class="fas fa-cog"></i> จัดการ
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
