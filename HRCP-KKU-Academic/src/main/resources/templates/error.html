<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>เกิดข้อผิดพลาด</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="text-center">
            <div class="mb-4">
                <i class="fas fa-exclamation-triangle text-warning" style="font-size: 4rem;"></i>
            </div>
            <h1 class="display-4 fw-bold text-dark" th:text="${status} ?: '500'">500</h1>
            <p class="lead text-muted mb-4">เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง</p>
            <div class="d-flex gap-3 justify-content-center">
                <a href="/" class="btn btn-primary btn-lg">
                    <i class="fas fa-home me-2"></i>หน้าหลัก
                </a>
                <button onclick="history.back()" class="btn btn-outline-secondary btn-lg">
                    <i class="fas fa-arrow-left me-2"></i>ย้อนกลับ
                </button>
            </div>
        </div>
    </div>
</body>
</html>
