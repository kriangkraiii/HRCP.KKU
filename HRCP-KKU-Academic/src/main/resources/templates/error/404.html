<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ไม่พบหน้าที่ต้องการ - 404</title>
    <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="icon" type="image/png" href="/img/cphr_new.png">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
        }
        .error-card {
            max-width: 600px;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: #dc3545;
            margin-bottom: 1rem;
        }
        .error-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #333;
        }
        .error-message {
            color: #666;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-card">
            <div class="error-code">404</div>
            <h1 class="error-title" th:text="${errorTitle} ?: 'ไม่พบหน้าที่ต้องการ'">ไม่พบหน้าที่ต้องการ</h1>
            <p class="error-message" th:text="${error} ?: 'ลิงก์อาจถูกย้ายหรือลบออกแล้ว ลองย้อนกลับไปหน้าก่อนหน้า หรือเริ่มใหม่จากหน้าหลัก'">
                ลิงก์อาจถูกย้ายหรือลบออกแล้ว ลองย้อนกลับไปหน้าก่อนหน้า หรือเริ่มใหม่จากหน้าหลัก
            </p>
            <div class="error-actions">
                <button type="button" id="backBtn" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left"></i> ย้อนกลับ
                </button>
                <a href="/" class="btn btn-primary">
                    <i class="fas fa-home"></i> กลับสู่หน้าหลัก
                </a>
            </div>
        </div>
    </div>
    <!-- ไฟล์ภายนอก ไม่ใช่ inline: หน้า error ถูก render บน ERROR dispatch ซึ่ง
         SecurityHeadersFilter ไม่ทำงาน จึงไม่มี nonce ให้ inline script ใช้ -->
    <script src="/js/error_actions.js"></script>
</body>
</html>
