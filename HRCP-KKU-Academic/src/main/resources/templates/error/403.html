<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"
      th:attr="data-theme=${user != null and user.themePreference == 'dark' ? 'dark' : null}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ไม่มีสิทธิ์เข้าถึง - 403 | CP HRD</title>
    <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="icon" type="image/png" href="/img/favicon.png?v=2.0">
    <link rel="stylesheet" href="/vendor/fonts/prompt.css">
    <link rel="stylesheet" href="/vendor/fonts/sarabun.css">
    <link rel="stylesheet" href="/css/error_pages.css?v=1.0">
</head>
<body>
    <div class="error-card error-card--403">
        <div class="error-icon-wrapper">
            <i class="fas fa-lock"></i>
        </div>
        <div class="error-code">403</div>
        <h1 class="error-title" th:text="${errorTitle} ?: 'ไม่มีสิทธิ์เข้าถึง'">ไม่มีสิทธิ์เข้าถึง</h1>
        <p class="error-message" th:text="${(error != null and error != 'Forbidden' and error != 'None') ? error : 'บัญชีผู้ใช้ของท่านไม่มีสิทธิ์ในการเข้าถึงหน้านี้ หากท่านคิดว่าเป็นข้อผิดพลาด กรุณาติดต่อผู้ดูแลระบบ'}">
            บัญชีผู้ใช้ของท่านไม่มีสิทธิ์ในการเข้าถึงหน้านี้ หากท่านคิดว่าเป็นข้อผิดพลาด กรุณาติดต่อผู้ดูแลระบบ
        </p>
        <div class="error-actions">
            <button type="button" id="backBtn" class="btn-custom-outline">
                <i class="fas fa-arrow-left"></i> ย้อนกลับ
            </button>
            <a href="/" class="btn-custom-primary">
                <i class="fas fa-house"></i> กลับสู่หน้าหลัก
            </a>
        </div>
        <div class="error-footer">
            วิทยาลัยการคอมพิวเตอร์ มหาวิทยาลัยขอนแก่น (CP KKU)
        </div>
    </div>
    <script src="/js/error_actions.js"></script>
</body>
</html>
