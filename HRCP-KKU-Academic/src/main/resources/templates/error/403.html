<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ไม่มีสิทธิ์เข้าถึง - 403 | HRCP-KKU</title>
    <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap');

        :root {
            --color-primary: #0d47a1;
            --color-primary-hover: #1565c0;
            --color-danger: #c62828;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', 'Sarabun', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #1e293b;
        }

        .error-card {
            background: #ffffff;
            width: 100%;
            max-width: 540px;
            border-radius: 24px;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(13, 71, 161, 0.12), 0 0 1px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .error-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #c62828 0%, #ad1457 100%);
        }

        .error-icon-wrapper {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: rgba(198, 40, 40, 0.08);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
            position: relative;
        }

        .error-icon-wrapper i {
            font-size: 2.5rem;
            color: #c62828;
        }

        .error-code {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #c62828 0%, #ad1457 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.03em;
        }

        .error-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.75rem;
            letter-spacing: -0.01em;
        }

        .error-message {
            font-size: 0.95rem;
            color: #64748b;
            line-height: 1.65;
            margin-bottom: 2rem;
            font-weight: 400;
            padding: 0 0.5rem;
        }

        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-custom-primary {
            background-color: var(--color-primary);
            color: #ffffff !important;
            font-weight: 600;
            font-size: 0.925rem;
            padding: 0.75rem 1.75rem;
            border-radius: 50px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(13, 71, 161, 0.25);
            cursor: pointer;
        }

        .btn-custom-primary:hover {
            background-color: var(--color-primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(13, 71, 161, 0.35);
        }

        .btn-custom-outline {
            background-color: transparent;
            color: #475569;
            font-weight: 600;
            font-size: 0.925rem;
            padding: 0.75rem 1.75rem;
            border-radius: 50px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1.5px solid #cbd5e1;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-custom-outline:hover {
            background-color: #f1f5f9;
            color: #0f172a;
            border-color: #94a3b8;
            transform: translateY(-2px);
        }

        .error-footer {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #f1f5f9;
            font-size: 0.825rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon-wrapper">
            <i class="fas fa-lock"></i>
        </div>
        <div class="error-code">403</div>
        <h1 class="error-title" th:text="${errorTitle} ?: 'ไม่มีสิทธิ์เข้าถึง'">ไม่มีสิทธิ์เข้าถึง</h1>
        <p class="error-message" th:text="${error} ?: 'บัญชีผู้ใช้ของท่านไม่มีสิทธิ์ในการเข้าถึงหน้านี้ หากท่านคิดว่าเป็นข้อผิดพลาด กรุณาติดต่อผู้ดูแลระบบ'">
            บัญชีผู้ใช้ของท่านไม่มีสิทธิ์ในการเข้าถึงหน้านี้ หากท่านคิดว่าเป็นข้อผิดพลาด กรุณาติดต่อผู้ดูแลระบบ
        </p>
        <div class="error-actions">
            <button type="button" id="backBtn" class="btn-custom-outline">
                <i class="fas fa-arrow-left"></i> ย้อนกลับ
            </button>
            <a href="/" class="btn-custom-primary">
                <i class="fas fa-house"></i> กลับสู่หน้าหลัก
            </a>
        </div>
        <div class="error-footer">
            วิทยาลัยการคอมพิวเตอร์ มหาวิทยาลัยขอนแก่น (CP KKU)
        </div>
    </div>
    <script src="/js/error_actions.js"></script>
</body>
</html>
