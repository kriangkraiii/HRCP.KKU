<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกิดข้อผิดพลาด - 500</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="/img/cphr_new.png">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
        }
        .error-card {
            max-width: 600px;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: #ffc107;
            margin-bottom: 1rem;
        }
        .error-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #333;
        }
        .error-message {
            color: #666;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-card">
            <div class="error-code">500</div>
            <h1 class="error-title" th:text="${errorTitle} ?: 'เกิดข้อผิดพลาดในระบบ'">เกิดข้อผิดพลาดในระบบ</h1>
            <p class="error-message" th:text="${error} ?: 'เกิดข้อผิดพลาดขณะประมวลผลคำขอ ลองโหลดหน้าใหม่อีกครั้ง หากปัญหายังคงอยู่ กรุณาติดต่อผู้ดูแลระบบ'">
                เกิดข้อผิดพลาดขณะประมวลผลคำขอ ลองโหลดหน้าใหม่อีกครั้ง หากปัญหายังคงอยู่ กรุณาติดต่อผู้ดูแลระบบ
            </p>
            <div class="error-actions">
                <button onclick="location.reload()" class="btn btn-outline-warning">
                    <i class="fas fa-rotate-right"></i> ลองใหม่อีกครั้ง
                </button>
                <a href="/" class="btn btn-primary">
                    <i class="fas fa-home"></i> กลับสู่หน้าหลัก
                </a>
            </div>
        </div>
    </div>
</body>
</html>
