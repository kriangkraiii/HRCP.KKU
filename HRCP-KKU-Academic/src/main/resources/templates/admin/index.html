<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{academic/base_academic::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>แดชบอร์ดผู้ดูแลระบบ</title>
</head>
<body>
	<section>
		<div class="container p-4">

			<!-- Dashboard Header -->
			<div class="text-center mb-4">
				<h1 class="fw-bold" style="color: var(--accent-color, #0d47a1);">
					<i class="fa-solid fa-gauge-high me-2" aria-hidden="true"></i>แดชบอร์ดผู้ดูแลระบบ
				</h1>
			</div>

			<!-- Image Source Switch Card -->
			<div class="row mb-4">
				<div class="col-lg-6 mx-auto">
					<div class="card border-0 shadow-sm">
						<div class="card-body p-4">
							<div class="d-flex align-items-center justify-content-between">
								<div class="d-flex align-items-center">
									<div class="rounded-circle d-flex align-items-center justify-content-center me-3"
										 id="imageModeIcon"
										 style="width: 50px; height: 50px; font-size: 1.4rem;"
										 th:classappend="${imageMode == 'AWS'} ? 'bg-info text-white' : 'bg-success text-white'">
										<i th:class="${imageMode == 'AWS'} ? 'fa-solid fa-cloud' : 'fa-solid fa-hard-drive'" aria-hidden="true"></i>
									</div>
									<div>
										<h5 class="mb-0 fw-bold">แหล่งจัดเก็บรูปภาพ</h5>
										<small class="text-muted" id="imageModeLabel">
											ใช้งานอยู่: <span id="imageModeText" class="fw-semibold"
												th:text="${imageMode == 'AWS'} ? 'AWS S3 (Cloud)' : 'Local Storage'"
												th:classappend="${imageMode == 'AWS'} ? 'text-info' : 'text-success'">Local</span>
										</small>
									</div>
								</div>
								<div class="d-flex align-items-center gap-3">
									<span class="badge" id="modeBadgeLocal"
										  th:classappend="${imageMode == 'LOCAL'} ? 'bg-success' : 'bg-secondary bg-opacity-25 text-muted'">
										<i class="fa-solid fa-hard-drive me-1" aria-hidden="true"></i>LOCAL
									</span>
									<div class="form-check form-switch mb-0">
										<input class="form-check-input" type="checkbox" role="switch"
											   id="imageModeSwitchToggle"
											   aria-label="สลับระหว่าง Local และ AWS S3"
											   th:checked="${imageMode == 'AWS'}"
											   style="width: 3.5rem; height: 1.75rem; cursor: pointer;">
									</div>
									<span class="badge" id="modeBadgeAws"
										  th:classappend="${imageMode == 'AWS'} ? 'bg-info' : 'bg-secondary bg-opacity-25 text-muted'">
										<i class="fa-solid fa-cloud me-1" aria-hidden="true"></i>AWS
									</span>
								</div>
							</div>
							<!-- Status bar -->
							<div class="mt-3">
								<div class="progress" style="height: 4px;" role="progressbar" aria-label="สถานะการสลับ">
									<div class="progress-bar" id="imageModeProgress"
										 style="width: 0%; transition: width 0.5s;"
										 th:classappend="${imageMode == 'AWS'} ? 'bg-info' : 'bg-success'">
									</div>
								</div>
								<div class="text-center mt-2">
									<small class="text-muted" id="imageModeStatus">
										<i class="fa-solid fa-circle-check text-success me-1" aria-hidden="true"></i>ระบบทำงานปกติ
									</small>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- User Metrics -->
			<div class="row mb-4">
				<div class="col-md-6 mb-3">
					<div class="card border-0 shadow-sm h-100">
						<div class="card-body d-flex align-items-center">
							<div class="rounded-circle bg-primary bg-opacity-10 d-flex align-items-center justify-content-center me-3"
								 style="width: 56px; height: 56px; min-width: 56px;">
								<i class="fa-solid fa-users fa-lg text-primary" aria-hidden="true"></i>
							</div>
							<div>
								<h3 class="mb-0 fw-bold" th:text="${totalUsers ?: 0}">0</h3>
								<p class="mb-0 text-muted">ผู้ใช้ทั้งหมด</p>
							</div>
						</div>
					</div>
				</div>
				<div class="col-md-6 mb-3">
					<div class="card border-0 shadow-sm h-100">
						<div class="card-body d-flex align-items-center">
							<div class="rounded-circle bg-success bg-opacity-10 d-flex align-items-center justify-content-center me-3"
								 style="width: 56px; height: 56px; min-width: 56px;">
								<i class="fa-solid fa-user-plus fa-lg text-success" aria-hidden="true"></i>
							</div>
							<div>
								<h3 class="mb-0 fw-bold" th:text="${newUsersToday ?: 0}">0</h3>
								<p class="mb-0 text-muted">ผู้ใช้ใหม่วันนี้</p>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- Recently Registered Users -->
			<div class="row mb-4">
				<div class="col-12">
					<div class="card border-0 shadow-sm">
						<div class="card-header bg-white border-bottom">
							<h5 class="mb-0 fw-bold">
								<i class="fa-solid fa-clock-rotate-left me-2" aria-hidden="true"></i>ผู้ใช้ที่ลงทะเบียนล่าสุด
							</h5>
						</div>
						<div class="card-body p-0">
							<div class="table-responsive">
								<table class="table table-hover mb-0">
									<thead class="table-light">
										<tr>
											<th scope="col">โปรไฟล์</th>
											<th scope="col">ชื่อ</th>
											<th scope="col">อีเมล</th>
											<th scope="col">วันที่ลงทะเบียน</th>
											<th scope="col">สถานะ</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="user : ${recentUsers}" th:if="${recentUsers}">
											<td>
												<img th:src="${user.profileImage}" 
													 class="rounded-circle" width="40" height="40" 
													 style="object-fit: cover;"
													 alt="รูปโปรไฟล์"
													 data-fallback="/img/profile_img/default.png">
											</td>
											<td th:text="${user.name}">-</td>
											<td th:text="${user.email}">-</td>
											<td th:text="${#dates.format(user.createdDate, 'dd/MM/yyyy')}">-</td>
											<td>
												<span th:if="${user.isEnable}" class="badge bg-success">ใช้งาน</span>
												<span th:unless="${user.isEnable}" class="badge bg-danger">ปิดใช้งาน</span>
											</td>
										</tr>
										<tr th:if="${recentUsers == null or #lists.isEmpty(recentUsers)}">
											<td colspan="5" class="text-center text-muted py-4">
												<i class="fa-solid fa-inbox fa-2x mb-2 d-block opacity-50" aria-hidden="true"></i>
												ยังไม่มีผู้ใช้ลงทะเบียน
											</td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- Quick Links -->
			<div class="row">
				<div class="col-md-3 col-6 mb-3">
					<a href="/admin/users?type=1" class="text-decoration-none">
						<div class="card border-0 shadow-sm h-100">
							<div class="card-body text-center py-4">
								<i class="fa-solid fa-users fa-2x text-primary mb-2" aria-hidden="true"></i>
								<h6 class="mb-0">จัดการผู้ใช้</h6>
							</div>
						</div>
					</a>
				</div>
				<div class="col-md-3 col-6 mb-3">
					<a href="/admin/users?type=2" class="text-decoration-none">
						<div class="card border-0 shadow-sm h-100">
							<div class="card-body text-center py-4">
								<i class="fa-solid fa-user-shield fa-2x text-primary mb-2" aria-hidden="true"></i>
								<h6 class="mb-0">จัดการแอดมิน</h6>
							</div>
						</div>
					</a>
				</div>
				<div class="col-md-3 col-6 mb-3">
					<a href="/admin/add-admin" class="text-decoration-none">
						<div class="card border-0 shadow-sm h-100">
							<div class="card-body text-center py-4">
								<i class="fa-solid fa-user-plus fa-2x text-success mb-2" aria-hidden="true"></i>
								<h6 class="mb-0">เพิ่มผู้ใช้</h6>
							</div>
						</div>
					</a>
				</div>
				<div class="col-md-3 col-6 mb-3">
					<a href="/admin/activity-logs" class="text-decoration-none">
						<div class="card border-0 shadow-sm h-100">
							<div class="card-body text-center py-4">
								<i class="fa-solid fa-list-check fa-2x text-warning mb-2" aria-hidden="true"></i>
								<h6 class="mb-0">ประวัติการใช้งาน</h6>
							</div>
						</div>
					</a>
				</div>
			</div>

		</div>

		<style>
			/* Image mode switch custom styles */
			#imageModeSwitchToggle:checked {
				background-color: #17a2b8;
				border-color: #17a2b8;
			}
			#imageModeSwitchToggle:not(:checked) {
				background-color: #28a745;
				border-color: #28a745;
			}
			#imageModeSwitchToggle:focus {
				box-shadow: none;
			}
		</style>

		<!-- Image Mode Switch Script -->
		<script th:inline="javascript">
		document.addEventListener('DOMContentLoaded', function() {
			var toggle = document.getElementById('imageModeSwitchToggle');
			if (!toggle) return;

			toggle.addEventListener('change', function() {
				var progressBar = document.getElementById('imageModeProgress');
				var statusEl = document.getElementById('imageModeStatus');
				var modeText = document.getElementById('imageModeText');
				var iconEl = document.getElementById('imageModeIcon');
				var badgeLocal = document.getElementById('modeBadgeLocal');
				var badgeAws = document.getElementById('modeBadgeAws');

				// Show loading state
				toggle.disabled = true;
				progressBar.style.width = '50%';
				statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i>กำลังสลับ...';

				fetch('/admin/toggle-image-mode', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json',
					'X-XSRF-TOKEN': /*[[${_csrf.token}]]*/ ''
				}
			})
				.then(function(res) { return res.json(); })
				.then(function(data) {
					progressBar.style.width = '100%';

					if (data.success) {
						var isAws = data.imageMode === 'AWS';

						// Update text
						modeText.textContent = isAws ? 'AWS S3 (Cloud)' : 'Local Storage';
						modeText.className = 'fw-semibold ' + (isAws ? 'text-info' : 'text-success');

						// Update icon
						iconEl.className = 'rounded-circle d-flex align-items-center justify-content-center me-3 ' + (isAws ? 'bg-info text-white' : 'bg-success text-white');
						iconEl.innerHTML = '<i class="' + (isAws ? 'fa-solid fa-cloud' : 'fa-solid fa-hard-drive') + '" aria-hidden="true"></i>';

						// Update badges
						badgeAws.className = 'badge ' + (isAws ? 'bg-info' : 'bg-secondary bg-opacity-25 text-muted');
						badgeLocal.className = 'badge ' + (!isAws ? 'bg-success' : 'bg-secondary bg-opacity-25 text-muted');

						// Update progress bar color
						progressBar.className = 'progress-bar ' + (isAws ? 'bg-info' : 'bg-success');

						// Update toggle state
						toggle.checked = isAws;

						statusEl.innerHTML = '<i class="fa-solid fa-circle-check text-success me-1"></i>สลับเป็น ' + data.imageMode + ' สำเร็จ';

						// Update all images on current page via global function
						if (typeof window.updateImageMode === 'function') {
							window.updateImageMode(data.imageMode);
						}
					} else {
						statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-danger me-1"></i>' + data.message;
						// Revert toggle
						toggle.checked = !toggle.checked;
					}
				})
				.catch(function(err) {
					progressBar.style.width = '0%';
					statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-danger me-1"></i>เกิดข้อผิดพลาดเครือข่าย';
					toggle.checked = !toggle.checked;
				})
				.finally(function() {
					toggle.disabled = false;
					setTimeout(function() {
						progressBar.style.width = '0%';
					}, 2000);
				});
			});
		});
		</script>
	</section>
</body>
</html>
