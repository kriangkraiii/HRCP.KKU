<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic::layout(~{::section})}">

<head>
	<meta charset="UTF-8">
	<title>Profile</title>
</head>

<body>
	<section>
		<div class="container-fluid mt-5 p-5 bg-light">
			<div class="row">
				<div class="col-md-10 offset-md-1">

					<p class="fs-3 text-center">My Profile</p>
					<th:block th:if="${succMsg}">
						<p class="text-success fw-bold text-center">[[${succMsg}]]</p>
					</th:block>

					<th:block th:if="${errorMsg}">
						<p class="text-danger fw-bold text-center">[[${errorMsg}]]</p>
					</th:block>

					<hr>

					<!-- Profile Image -->
					<div class="d-flex justify-content-center mb-4">
						<img th:src="@{'/img/profile_img/' + ${user.profileImage}}" alt="Profile Image" class="border p-2"
							style="width: 180px; height: 180px; border-radius: 50%; object-fit: cover;"
							onerror="this.src='/img/profile_img/default.png'">
					</div>



					<!-- Profile Update Form -->
					<div class="card shadow-sm mb-5">
						<div class="card-header bg-primary text-white">
							<h5 class="mb-0">Update Profile Information</h5>
						</div>
						<div class="card-body">
							<form th:action="@{/admin/update-profile}" method="post" enctype="multipart/form-data">
								<div class="row mb-3">
									<div class="col-md-3">
										<label class="form-label fw-bold">ชื่อ</label>
										<input type="text" name="firstName" class="form-control" th:value="${user.firstName}">
									</div>
									<div class="col-md-3">
										<label class="form-label fw-bold">นามสกุล</label>
										<input type="text" name="lastName" class="form-control" th:value="${user.lastName}">
									</div>
									<div class="col-md-6">
										<label class="form-label fw-bold">Mobile Number</label> <input type="text"
											name="mobileNumber" class="form-control" th:value="${user.mobileNumber}">
									</div>
								</div>

								<div class="row mb-3">
									<div class="col-md-6">
										<label class="form-label fw-bold">Email</label> <input type="email"
											class="form-control" readonly th:value="${user.email}">
									</div>
									<div class="col-md-6">
										<label class="form-label fw-bold">ตำแหน่งทางวิชาการ</label>
										<select name="academicPosition" class="form-select">
											<option value="" th:selected="${user.academicPosition == null || user.academicPosition == ''}">-- เลือกตำแหน่งทางวิชาการ --</option>
											<option value="อาจารย์" th:selected="${user.academicPosition == 'อาจารย์'}">อาจารย์</option>
											<option value="ผู้ช่วยศาสตราจารย์" th:selected="${user.academicPosition == 'ผู้ช่วยศาสตราจารย์'}">ผู้ช่วยศาสตราจารย์</option>
											<option value="รองศาสตราจารย์" th:selected="${user.academicPosition == 'รองศาสตราจารย์'}">รองศาสตราจารย์</option>
											<option value="ศาสตราจารย์" th:selected="${user.academicPosition == 'ศาสตราจารย์'}">ศาสตราจารย์</option>
										</select>
									</div>
								</div>

								<div class="row mb-3">
									<div class="col-md-6">
										<label class="form-label fw-bold">คำนำหน้าชื่อ</label>
										<select name="title" class="form-select">
											<option value="" th:selected="${user.title == null || user.title == ''}">-- เลือกคำนำหน้า --</option>
											<option value="นาย" th:selected="${user.title == 'นาย'}">นาย</option>
											<option value="นาง" th:selected="${user.title == 'นาง'}">นาง</option>
											<option value="นางสาว" th:selected="${user.title == 'นางสาว'}">นางสาว</option>
											<option value="ดร." th:selected="${user.title == 'ดร.'}">ดร.</option>
											<option value="ผศ.ดร." th:selected="${user.title == 'ผศ.ดร.'}">ผศ.ดร.</option>
											<option value="รศ.ดร." th:selected="${user.title == 'รศ.ดร.'}">รศ.ดร.</option>
											<option value="ศ.ดร." th:selected="${user.title == 'ศ.ดร.'}">ศ.ดร.</option>
										</select>
									</div>
								</div>

								<div class="row mb-3">
									<div class="col-md-6">
										<label class="form-label fw-bold">Profile Image</label> <input type="file"
											name="img" class="form-control">
									</div>
									<div class="col-md-3">
										<label class="form-label fw-bold">Role</label> <input type="text"
											class="form-control" readonly th:value="${user.role}">
									</div>
									<div class="col-md-3">
										<label class="form-label fw-bold">Account Status</label> <input type="text"
											class="form-control" readonly th:value="${user.isEnable}">
									</div>
								</div>

								<input type="hidden" th:value="${user.id}" name="id">

								<div class="text-center">
									<button type="submit" class="btn btn-primary px-5">Update
										Profile</button>
								</div>
							</form>
						</div>
					</div>

					<!-- Change Password Button -->
					<div class="text-center mb-5">
						<button type="button" class="btn btn-warning px-5" data-bs-toggle="modal"
							data-bs-target="#adminChangePasswordModal">
							<i class="fas fa-key me-2"></i>เปลี่ยนรหัสผ่าน
						</button>
					</div>

				</div>
			</div>
		</div>

		<!-- Change Password Modal -->
	<div class="modal fade" id="adminChangePasswordModal" tabindex="-1" aria-labelledby="adminChangePasswordModalLabel"
		aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header bg-warning">
					<h5 class="modal-title" id="adminChangePasswordModalLabel">
						<i class="fas fa-key me-2"></i>เปลี่ยนรหัสผ่าน
					</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<form th:action="@{/admin/change-password}" method="post" id="adminChangePasswordForm">
					<div class="modal-body">
						<div class="mb-3">
							<label class="form-label fw-bold">รหัสผ่านปัจจุบัน</label>
							<input type="password" name="currentPassword" class="form-control" required>
						</div>
						<div class="mb-3">
							<label class="form-label fw-bold">รหัสผ่านใหม่</label>
							<input type="password" name="newPassword" class="form-control" required minlength="8" id="adminNewPassword">
						</div>
						<div class="mb-3 p-2" style="background:#f5f5f5;border-radius:8px">
							<small class="text-muted fw-bold"><i class="fas fa-info-circle"></i> เงื่อนไขรหัสผ่าน:</small>
							<ul class="list-unstyled mb-0 mt-1" style="font-size:13px">
								<li id="aRule1" class="text-muted"><i class="fas fa-circle" style="font-size:8px"></i> อย่างน้อย 8 ตัวอักษร</li>
								<li id="aRule2" class="text-muted"><i class="fas fa-circle" style="font-size:8px"></i> ตัวพิมพ์ใหญ่ (A-Z)</li>
								<li id="aRule3" class="text-muted"><i class="fas fa-circle" style="font-size:8px"></i> ตัวพิมพ์เล็ก (a-z)</li>
								<li id="aRule4" class="text-muted"><i class="fas fa-circle" style="font-size:8px"></i> ตัวเลข (0-9)</li>
								<li id="aRule5" class="text-muted"><i class="fas fa-circle" style="font-size:8px"></i> อักขระพิเศษ (!@#$%^&*...)</li>
								<li id="aRule6" class="text-muted"><i class="fas fa-circle" style="font-size:8px"></i> ห้ามมีช่องว่าง</li>
							</ul>
							<div class="d-flex align-items-center gap-2 mt-2">
								<small class="text-muted fw-bold" style="white-space:nowrap">ความแข็งแรง:</small>
								<div style="flex:1;height:5px;background:#e0e0e0;border-radius:3px;overflow:hidden">
									<div id="aStrBar" style="height:100%;width:0;border-radius:3px;transition:all 0.3s"></div>
								</div>
								<small id="aStrLabel" class="fw-bold" style="color:#999;white-space:nowrap">—</small>
							</div>
						</div>
						<div class="mb-3">
							<label class="form-label fw-bold">ยืนยันรหัสผ่านใหม่</label>
							<input type="password" name="confirmPassword" class="form-control" required minlength="8" id="adminConfirmPassword">
							<div class="invalid-feedback">รหัสผ่านไม่ตรงกัน</div>
						</div>
						<div id="aMatchStatus" class="text-center" style="font-size:13px;height:18px"></div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
						<button type="submit" class="btn btn-warning" id="aSubmitBtn" disabled>
							<i class="fas fa-save me-1"></i>เปลี่ยนรหัสผ่าน
						</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<script>
		(function() {
			var np = document.getElementById('adminNewPassword');
			var cp = document.getElementById('adminConfirmPassword');
			var ms = document.getElementById('aMatchStatus');
			var sb = document.getElementById('aSubmitBtn');
			var bar = document.getElementById('aStrBar');
			var lbl = document.getElementById('aStrLabel');
			var rules = [
				{ id: 'aRule1', test: function(p){return p.length>=8;} },
				{ id: 'aRule2', test: function(p){return /[A-Z]/.test(p);} },
				{ id: 'aRule3', test: function(p){return /[a-z]/.test(p);} },
				{ id: 'aRule4', test: function(p){return /[0-9]/.test(p);} },
				{ id: 'aRule5', test: function(p){return /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?`~]/.test(p);} },
				{ id: 'aRule6', test: function(p){return p.length===0||!/\s/.test(p);} }
			];
			var levels = [
				{min:0,l:'—',c:'#999',w:'0'},{min:1,l:'อ่อนมาก',c:'#c62828',w:'16%'},
				{min:2,l:'อ่อน',c:'#e65100',w:'33%'},{min:3,l:'ปานกลาง',c:'#f9a825',w:'50%'},
				{min:4,l:'แข็งแรง',c:'#2e7d32',w:'75%'},{min:6,l:'แข็งแรงมาก',c:'#1b5e20',w:'100%'}
			];
			function validate() {
				var p=np.value, c=cp.value, passed=0;
				rules.forEach(function(r){
					var el=document.getElementById(r.id), ok=r.test(p);
					if(ok) passed++;
					el.className=ok?'text-success':'text-muted';
					el.querySelector('i').className='fas fa-'+(ok?'check-circle':'circle');
					if(ok) el.querySelector('i').style.fontSize=''; else el.querySelector('i').style.fontSize='8px';
				});
				if(p.length===0){bar.style.width='0';lbl.textContent='—';lbl.style.color='#999';}
				else{var lv=levels[0];for(var i=levels.length-1;i>=0;i--){if(passed>=levels[i].min){lv=levels[i];break;}}bar.style.width=lv.w;bar.style.background=lv.c;lbl.textContent=lv.l;lbl.style.color=lv.c;}
				if(c.length>0){ms.textContent=p===c?'✓ รหัสผ่านตรงกัน':'✗ รหัสผ่านไม่ตรงกัน';ms.style.color=p===c?'#2e7d32':'#c62828';cp.classList.toggle('is-invalid',p!==c);}
				else{ms.textContent='';cp.classList.remove('is-invalid');}
				sb.disabled=!(passed===6&&p===c&&c.length>0);
			}
			np.addEventListener('input', validate);
			cp.addEventListener('input', validate);
			document.getElementById('adminChangePasswordForm').addEventListener('submit', function(e){
				if(np.value!==cp.value){e.preventDefault();cp.classList.add('is-invalid');}
			});
		})();
	</script>
	</section>
</body>

</html>
