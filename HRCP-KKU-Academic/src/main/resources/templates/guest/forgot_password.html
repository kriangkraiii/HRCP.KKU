<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ลืมรหัสผ่าน - ระบบเอกสารและการติดตามผลการยื่นขอกำหนดตำแหน่งทางวิชาการ</title>
	<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<link rel="icon" type="image/png" href="/img/cphr_new.png">
	<link rel="stylesheet" href="/css/guest.css">
</head>

<body>
	<div class="container">
		<div class="header">
			<img class="logo-icon" src="/img/cphr_new.png" alt="Logo">
			<h1>ระบบเอกสารและการติดตามผลการยื่นขอกำหนดตำแหน่งทางวิชาการ</h1>
			<p>วิทยาลัยการคอมพิวเตอร์ มหาวิทยาลัยขอนแก่น</p>
		</div>
		<div class="card">
			<h2><i class="fas fa-key"></i> ลืมรหัสผ่าน</h2>
			<p class="subtitle">กรอกอีเมลเพื่อรับลิงก์รีเซ็ตรหัสผ่าน</p>

			<div th:if="${succMsg}" class="alert alert-success">
				<i class="fas fa-check-circle"></i>
				<span th:text="${succMsg}"></span>
			</div>
			<div th:if="${errorMsg}" class="alert alert-danger">
				<i class="fas fa-exclamation-circle"></i>
				<span th:text="${errorMsg}"></span>
			</div>

			<form th:action="@{/forgot-password}" method="post">
				<div class="form-group">
					<label>อีเมล</label>
					<div class="input-wrapper">
						<i class="fas fa-envelope"></i>
						<input type="email" name="email" placeholder="กรอกอีเมลของคุณ" required>
					</div>
				</div>
				<button type="submit" class="btn-primary">
					<i class="fas fa-paper-plane"></i> ส่งลิงก์รีเซ็ตรหัสผ่าน
				</button>
			</form>
			<div class="back-link">
				<a th:href="@{/signin}"><i class="fas fa-arrow-left"></i> กลับไปหน้าเข้าสู่ระบบ</a>
			</div>
		</div>
		<div class="footer-text">© 2569 วิทยาลัยการคอมพิวเตอร์ มหาวิทยาลัยขอนแก่น</div>
	</div></body>

</html>
