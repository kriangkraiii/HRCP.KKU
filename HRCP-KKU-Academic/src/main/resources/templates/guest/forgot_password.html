<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ลืมรหัสผ่าน - ระบบเอกสารและการติดตามผลการยื่นขอกำหนดตำแหน่งทางวิชาการ</title>
	<link href="/vendor/fonts/sarabun.css" rel="stylesheet">
	<link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
	<link rel="icon" type="image/png" href="/img/favicon.png">
	<link rel="stylesheet" href="/css/guest.css">
</head>

<body>
	<div class="guest-split">
		<div class="guest-brand">
			<img class="guest-brand-logo" src="/img/cphr_new.png" alt="Logo">
			<div class="guest-brand-title">ระบบเอกสารและการติดตามผลการยื่นขอกำหนดตำแหน่งทางวิชาการ</div>
			<div class="guest-brand-sub">วิทยาลัยการคอมพิวเตอร์ มหาวิทยาลัยขอนแก่น</div>
			<div class="guest-footer">© <span th:text="${T(java.time.Year).now(T(java.time.ZoneId).of('Asia/Bangkok')).getValue() + 543}">2569</span> วิทยาลัยการคอมพิวเตอร์ มหาวิทยาลัยขอนแก่น</div>
		</div>

		<div class="guest-form">
			<div class="guest-card">
				<h1 class="guest-card-heading"><i class="fas fa-key" style="margin-right:8px;font-size:1.2rem"></i>ลืมรหัสผ่าน</h1>
				<p class="guest-card-sub">กรอกอีเมลเพื่อรับลิงก์รีเซ็ตรหัสผ่าน</p>

				<div th:if="${succMsg}" class="alert alert-success">
					<i class="fas fa-check-circle"></i>
					<span th:text="${succMsg}"></span>
				</div>
				<div th:if="${errorMsg}" class="alert alert-danger">
					<i class="fas fa-exclamation-circle"></i>
					<span th:text="${errorMsg}"></span>
				</div>

				<form th:action="@{/forgot-password}" method="post" id="forgotForm">
					<div class="form-group">
						<label>อีเมล</label>
						<div class="input-wrapper">
							<i class="fas fa-envelope"></i>
							<input type="email" name="email" placeholder="กรอกอีเมลของคุณ" required autocomplete="email">
						</div>
					</div>
					<button type="submit" class="btn-guest-primary" id="submitBtn">
						<i class="fas fa-paper-plane"></i> ส่งลิงก์รีเซ็ตรหัสผ่าน
					</button>
				</form>

				<div class="guest-links" style="margin-top:20px;text-align:center">
					<a href="/signin" class="guest-link"><i class="fas fa-arrow-left"></i> กลับไปหน้าเข้าสู่ระบบ</a>
				</div>
			</div>
		</div>
	</div>

	<script>
		document.getElementById('forgotForm')?.addEventListener('submit', function () {
			var btn = document.getElementById('submitBtn');
			if (btn) {
				btn.classList.add('is-loading');
				btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังส่งลิงก์...';
			}
		});
	</script>
	<script src="/js/guest-alert.js"></script>
</body>

</html>
