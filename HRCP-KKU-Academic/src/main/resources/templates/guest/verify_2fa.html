<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยืนยัน OTP - ระบบเอกสารและการติดตามผลการยื่นขอกำหนดตำแหน่งทางวิชาการ</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="/img/cphr_new.png">
    <link rel="stylesheet" href="/css/guest.css">
</head>

<body>
    <div class="guest-split">
        <div class="guest-brand">
            <img class="guest-brand-logo" src="/img/cphr_new.png" alt="Logo">
            <div class="guest-brand-title">การยืนยันตัวตนสองขั้นตอน</div>
            <div class="guest-brand-sub">Two-Factor Authentication</div>
            <div class="guest-footer">© 2569 วิทยาลัยการคอมพิวเตอร์ มหาวิทยาลัยขอนแก่น</div>
        </div>

        <div class="guest-form">
            <div class="guest-card">
                <h1 class="guest-card-heading"><i class="fas fa-key" style="margin-right:8px;font-size:1.2rem"></i>กรอกรหัส OTP</h1>
                <p class="guest-card-sub">
                    ระบบส่งรหัส OTP 8 หลักไปที่อีเมล<br>
                    <span class="email-badge"><i class="fas fa-envelope"></i> [[${maskedEmail}]]</span>
                </p>

                <!-- Alerts -->
                <div th:if="${success}" class="alert alert-success">
                    <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="alert alert-danger">
                    <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                </div>

                <form th:action="@{/2fa/verify}" method="post" id="otpForm">
                    <input type="hidden" name="otp" id="otpHidden">

                    <div class="otp-grid" id="otpInputs">
                        <input type="text" class="otp-cell" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" data-index="0">
                        <input type="text" class="otp-cell" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" data-index="1">
                        <input type="text" class="otp-cell" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" data-index="2">
                        <input type="text" class="otp-cell" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" data-index="3">
                        <input type="text" class="otp-cell" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" data-index="4">
                        <input type="text" class="otp-cell" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" data-index="5">
                        <input type="text" class="otp-cell" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" data-index="6">
                        <input type="text" class="otp-cell" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" data-index="7">
                    </div>

                    <button type="submit" class="btn-guest-primary" id="verifyBtn" disabled>
                        <i class="fas fa-check-circle"></i> ยืนยัน OTP
                    </button>
                </form>

                <div class="resend-section">
                    <p>ไม่ได้รับรหัส?</p>
                    <form th:action="@{/2fa/resend}" method="post" style="display:inline">
                        <button type="submit" class="btn-resend" id="resendBtn">
                            <i class="fas fa-redo"></i> ส่ง OTP อีกครั้ง
                        </button>
                    </form>
                    <div class="countdown-badge" id="expiryCountdown">
                        <i class="fas fa-clock"></i> OTP หมดอายุใน <span id="expiryTime">5:00</span>
                    </div>
                </div>

                <div class="guest-link">
                    <a href="/signin"><i class="fas fa-arrow-left"></i> กลับหน้าเข้าสู่ระบบ</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var inputs = document.querySelectorAll('#otpInputs .otp-cell');
            var form = document.getElementById('otpForm');
            var hidden = document.getElementById('otpHidden');
            var verifyBtn = document.getElementById('verifyBtn');

            function collectOtp() {
                var otp = '';
                inputs.forEach(function(inp) { otp += inp.value; });
                return otp;
            }

            function updateBtn() {
                var otp = collectOtp();
                verifyBtn.disabled = otp.length !== 8;
                hidden.value = otp;
            }

            inputs.forEach(function(inp, i) {
                inp.addEventListener('input', function() {
                    this.value = this.value.replace(/[^0-9]/g, '');
                    if (this.value) {
                        this.classList.add('filled');
                        if (i < inputs.length - 1) inputs[i + 1].focus();
                    } else {
                        this.classList.remove('filled');
                    }
                    updateBtn();
                });

                inp.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && !this.value && i > 0) {
                        inputs[i - 1].focus();
                        inputs[i - 1].value = '';
                        inputs[i - 1].classList.remove('filled');
                        updateBtn();
                    }
                });

                inp.addEventListener('paste', function(e) {
                    e.preventDefault();
                    var paste = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
                    for (var j = 0; j < Math.min(paste.length, inputs.length); j++) {
                        inputs[j].value = paste[j];
                        inputs[j].classList.add('filled');
                    }
                    if (paste.length >= inputs.length) {
                        inputs[inputs.length - 1].focus();
                    } else if (paste.length > 0) {
                        inputs[paste.length].focus();
                    }
                    updateBtn();
                });
            });

            // Auto-focus first input
            inputs[0].focus();

            // Submit on enter when all filled
            form.addEventListener('submit', function() {
                hidden.value = collectOtp();
            });

            // Expiry countdown (5 minutes)
            var remaining = 5 * 60;
            var expiryEl = document.getElementById('expiryTime');
            var countdownDiv = document.getElementById('expiryCountdown');
            function tickExpiry() {
                if (remaining <= 0) {
                    countdownDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> OTP หมดอายุแล้ว กรุณาส่งรหัสใหม่';
                    countdownDiv.style.background = '#fef2f2';
                    countdownDiv.style.color = '#991b1b';
                    return;
                }
                remaining--;
                var m = Math.floor(remaining / 60);
                var s = remaining % 60;
                expiryEl.textContent = m + ':' + (s < 10 ? '0' : '') + s;
                setTimeout(tickExpiry, 1000);
            }
            tickExpiry();
        })();
    </script>
</body>

</html>
