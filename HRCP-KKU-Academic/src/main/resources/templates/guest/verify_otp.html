<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยืนยัน OTP - ระบบเอกสารและการติดตามผลการยื่นขอกำหนดตำแหน่งทางวิชาการ</title>
    <link href="/vendor/fonts/sarabun.css" rel="stylesheet">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="stylesheet" href="/css/guest.css">
</head>

<body>
    <div class="guest-split">
        <div class="guest-brand">
            <img class="guest-brand-logo" src="/img/cphr_new.png" alt="Logo">
            <div class="guest-brand-title">ระบบเอกสารและการติดตามผลการยื่นขอกำหนดตำแหน่งทางวิชาการ</div>
            <div class="guest-brand-sub">วิทยาลัยการคอมพิวเตอร์ มหาวิทยาลัยขอนแก่น</div>
            <div class="guest-footer">© <span th:text="${T(java.time.Year).now(T(java.time.ZoneId).of('Asia/Bangkok')).getValue() + 543}">2569</span> วิทยาลัยการคอมพิวเตอร์ มหาวิทยาลัยขอนแก่น</div>
        </div>

        <div class="guest-form">
            <div class="guest-card">
                <!-- Step Indicator -->
                <div class="guest-steps">
                    <div class="guest-step gs-done">
                        <span class="guest-step-num"><i class="fas fa-check" style="font-size:0.7rem"></i></span>
                        <span>กรอกอีเมล</span>
                    </div>
                    <div class="guest-step-connector gs-connector-done"></div>
                    <div class="guest-step gs-active">
                        <span class="guest-step-num">2</span>
                        <span>ยืนยัน OTP</span>
                    </div>
                    <div class="guest-step-connector"></div>
                    <div class="guest-step">
                        <span class="guest-step-num">3</span>
                        <span>ตั้งรหัสผ่าน</span>
                    </div>
                </div>

                <h1 class="guest-card-heading">ยืนยันรหัส OTP</h1>
                <p class="guest-card-sub">กรุณากรอกรหัส OTP 8 หลักที่ส่งไปยังอีเมลของคุณ<br>
                    <span th:if="${email}" th:text="'(' + ${email} + ')'"></span>
                </p>

                <div th:if="${succMsg}" class="alert alert-success">
                    <i class="fas fa-check-circle"></i>
                    <span th:text="${succMsg}"></span>
                </div>
                <div th:if="${errorMsg}" class="alert alert-danger">
                    <i class="fas fa-exclamation-circle"></i>
                    <span th:text="${errorMsg}"></span>
                </div>

                <form th:action="@{/first-login/verify-otp}" method="post" id="verifyOtpForm">
                    <div class="form-group">
                        <label>รหัส OTP</label>
                        <input type="text" name="otp" class="otp-input-single" maxlength="8" pattern="[0-9]{8}"
                            placeholder="00000000" required autocomplete="off">
                    </div>
                    <div class="otp-info">
                        <i class="fas fa-clock"></i>
                        <span>รหัส OTP มีอายุ 5 นาที</span>
                    </div>
                    <button type="submit" class="btn-guest-primary" id="submitBtn">
                        <i class="fas fa-check-circle"></i> ยืนยัน OTP
                    </button>
                </form>

                <div class="guest-link">
                    <a th:href="@{/first-login}"><i class="fas fa-arrow-left"></i> ส่ง OTP อีกครั้ง</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('verifyOtpForm')?.addEventListener('submit', function () {
            var btn = document.getElementById('submitBtn');
            if (btn) {
                btn.classList.add('is-loading');
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังตรวจสอบ...';
            }
        });
    </script>
</body>

</html>
