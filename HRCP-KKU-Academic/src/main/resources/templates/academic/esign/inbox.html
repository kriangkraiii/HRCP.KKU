<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{academic/base_academic :: layout(~{::section})}">

<body>
<section>
    <div class="container py-4">

        <h3 class="mb-2"><i class="fas fa-file-signature"></i> รอลงนาม</h3>
        <p class="text-secondary mb-4">
            เอกสารที่รอลายเซ็นของคุณ — จะแสดงเฉพาะเอกสารที่ถึงคิวของคุณแล้วเท่านั้น
            หากยังไม่ถึงคิว ระบบจะแจ้งเตือนเมื่อผู้ลงนามก่อนหน้าลงนามเรียบร้อย
        </p>

        <div th:if="${succMsg}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-circle-check"></i> <span th:text="${succMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-circle-exclamation"></i> <span th:text="${errorMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${#lists.isEmpty(pendingSteps)}" class="card card-academic">
            <div class="card-body text-center py-5">
                <i class="fas fa-mug-hot fa-2x text-secondary mb-3"></i>
                <p class="text-secondary mb-0">ไม่มีเอกสารรอลงนามในขณะนี้</p>
            </div>
        </div>

        <div class="row g-3" th:unless="${#lists.isEmpty(pendingSteps)}">
            <div class="col-lg-6" th:each="step : ${pendingSteps}">
                <div class="card card-academic h-100">
                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                            <h5 class="mb-0" th:text="${step.signatureRequest.documentLabel}
                                                      ?: ('เอกสารที่ ' + ${step.signatureRequest.documentType})">
                                ชื่อเอกสาร
                            </h5>
                            <span class="badge bg-warning text-dark">
                                <i class="fas fa-pen-nib"></i> ถึงคิวลงนาม
                            </span>
                        </div>

                        <dl class="row mb-3 small">
                            <dt class="col-5 text-secondary fw-normal">ประเภทคำร้อง</dt>
                            <dd class="col-7" th:text="${step.signatureRequest.module.thaiLabel}">—</dd>

                            <dt class="col-5 text-secondary fw-normal">ลงนามในตำแหน่ง</dt>
                            <dd class="col-7 fw-semibold" th:text="${step.roleLabel}">—</dd>

                            <dt class="col-5 text-secondary fw-normal">ความคืบหน้า</dt>
                            <dd class="col-7" th:text="${step.signatureRequest.progressLabel} + ' ลายเซ็น'">—</dd>

                            <dt class="col-5 text-secondary fw-normal" th:if="${step.signatureRequest.dueAt != null}">
                                กำหนดลงนามภายใน
                            </dt>
                            <dd class="col-7" th:if="${step.signatureRequest.dueAt != null}">
                                <span th:text="${#temporals.format(step.signatureRequest.dueAt, 'd MMM yyyy HH:mm')}">—</span>
                                <span class="badge bg-danger ms-1"
                                      th:if="${step.signatureRequest.overdue}">เลยกำหนด</span>
                            </dd>
                        </dl>

                        <a th:href="@{'/esign/sign/' + ${step.id}}" class="btn btn-academic">
                            <i class="fas fa-signature"></i> ตรวจสอบและลงนาม
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
