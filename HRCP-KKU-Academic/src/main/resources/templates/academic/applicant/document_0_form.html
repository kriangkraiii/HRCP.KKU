<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic :: layout(~{::section})}">

<body>
    <section>
        <div class="container py-4">
            <div class="card card-academic">
                <div class="card-header bg-white">
                    <h4 class="mb-0"><i class="fas fa-file-alt"></i> เอกสารที่ 0: บันทึกข้อความ ขอรับการประเมินผลการสอน
                    </h4>
                    <small class="text-muted">คำร้อง [[${request.requestCode}]] — [[${request.applicant.name}]]</small>
                </div>
                <div class="card-body">

                    <!-- Draft saved alert -->
                    <div th:if="${param.saved != null}" class="alert alert-success alert-dismissible fade show">
                        <i class="fas fa-save"></i> บันทึกแบบร่างสำเร็จ
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <form th:action="'/user/academic/request/' + ${request.id} + '/document-0'" method="post" th:attr="data-auto-draft='/api/draft/academic/' + ${request.id} + '/0'"
                        id="doc0Form">

                        <!-- ข้อมูลบันทึกข้อความ -->
                        <h5 class="border-bottom pb-2 mb-3"><i class="fas fa-file-signature"></i> ข้อมูลบันทึกข้อความ
                        </h5>
                        <div class="row mb-3">
                            <!-- เลขที่หนังสือ: ซ่อนจากผู้ยื่น ให้แอดมินกรอก -->
                            <input type="hidden" name="memo_no"
                                th:value="${doc0Data != null ? doc0Data.getOrDefault('memo_no', '') : ''}">
                            <div class="col-md-4">
                                <label class="form-label">วันที่เอกสาร <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="text" name="date" class="form-control thai-full-date"
                                        th:value="${doc0Data != null ? doc0Data.getOrDefault('date', '') : ''}"
                                        placeholder="เช่น 17 กุมภาพันธ์ 2569" required>
                                    <input type="date" class="thai-date-picker">
                                    <button type="button" class="btn btn-outline-secondary thai-date-btn" title="เลือกวันที่">
                                        <i class="fas fa-calendar-alt"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- ข้อมูลผู้ขอรับการประเมิน -->
                        <h5 class="border-bottom pb-2 mb-3 mt-4"><i class="fas fa-user"></i> ข้อมูลผู้ขอรับการประเมิน
                        </h5>
                        <div class="row mb-3">
                            <div class="col-md-3">
                                <label class="form-label">คำนำหน้า <span class="text-danger">*</span></label>
                                <select name="title" class="form-select" id="titleSelect" required>
                                    <option value="">-- เลือก --</option>
                                    <option value="นาย" th:selected="${(doc0Data?.title ?: request.applicant.title) == 'นาย'}">นาย</option>
                                    <option value="นาง" th:selected="${(doc0Data?.title ?: request.applicant.title) == 'นาง'}">นาง</option>
                                    <option value="นางสาว" th:selected="${(doc0Data?.title ?: request.applicant.title) == 'นางสาว'}">นางสาว</option>
                                    <option value="ดร." th:selected="${(doc0Data?.title ?: request.applicant.title) == 'ดร.'}">ดร.</option>
                                    <option value="อาจารย์" th:selected="${(doc0Data?.title ?: request.applicant.title) == 'อาจารย์' or (doc0Data?.title ?: request.applicant.title) == 'อ.'}">อาจารย์</option>
                                    <option value="อ.ดร." th:selected="${(doc0Data?.title ?: request.applicant.title) == 'อ.ดร.' or (doc0Data?.title ?: request.applicant.title) == 'อาจารย์ ดร.'}">อาจารย์ ดร. (อ.ดร.)</option>
                                    <option value="ผู้ช่วยศาสตราจารย์" th:selected="${(doc0Data?.title ?: request.applicant.title) == 'ผู้ช่วยศาสตราจารย์' or (doc0Data?.title ?: request.applicant.title) == 'ผศ.'}">ผู้ช่วยศาสตราจารย์ (ผศ.)</option>
                                    <option value="ผศ.ดร." th:selected="${(doc0Data?.title ?: request.applicant.title) == 'ผศ.ดร.' or (doc0Data?.title ?: request.applicant.title) == 'ผู้ช่วยศาสตราจารย์ ดร.' or (doc0Data?.title ?: request.applicant.title) == 'ผู้ช่วยศาสตราจารย์ดร.'}">ผู้ช่วยศาสตราจารย์ ดร. (ผศ.ดร.)</option>
                                    <option value="รองศาสตราจารย์" th:selected="${(doc0Data?.title ?: request.applicant.title) == 'รองศาสตราจารย์' or (doc0Data?.title ?: request.applicant.title) == 'รศ.'}">รองศาสตราจารย์ (รศ.)</option>
                                    <option value="รศ.ดร." th:selected="${(doc0Data?.title ?: request.applicant.title) == 'รศ.ดร.' or (doc0Data?.title ?: request.applicant.title) == 'รองศาสตราจารย์ ดร.' or (doc0Data?.title ?: request.applicant.title) == 'รองศาสตราจารย์ดร.'}">รองศาสตราจารย์ ดร. (รศ.ดร.)</option>
                                    <option value="ศาสตราจารย์" th:selected="${(doc0Data?.title ?: request.applicant.title) == 'ศาสตราจารย์' or (doc0Data?.title ?: request.applicant.title) == 'ศ.'}">ศาสตราจารย์ (ศ.)</option>
                                    <option value="ศ.ดร." th:selected="${(doc0Data?.title ?: request.applicant.title) == 'ศ.ดร.' or (doc0Data?.title ?: request.applicant.title) == 'ศาสตราจารย์ ดร.' or (doc0Data?.title ?: request.applicant.title) == 'ศาสตราจารย์ดร.'}">ศาสตราจารย์ ดร. (ศ.ดร.)</option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">ชื่อ-นามสกุล <span class="text-danger">*</span></label>
                                <input type="text" name="applicant_name" class="form-control"
                                    th:value="${doc0Data != null ? doc0Data.getOrDefault('applicant_name', request.applicant.name) : request.applicant.name}"
                                    required placeholder="เช่น สมชาย ใจดี">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">ประเภทบุคลากร <span class="text-danger">*</span></label>
                                <div class="d-flex gap-4 mt-1">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="employee_type"
                                            id="empType1" value="พนักงานมหาวิทยาลัย"
                                            th:checked="${doc0Data != null && doc0Data.getOrDefault('employee_type', '') == 'พนักงานมหาวิทยาลัย'}"
                                            required>
                                        <label class="form-check-label" for="empType1">พนักงานมหาวิทยาลัย</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="employee_type"
                                            id="empType2" value="ข้าราชการ"
                                            th:checked="${doc0Data != null && doc0Data.getOrDefault('employee_type', '') == 'ข้าราชการ'}">
                                        <label class="form-check-label" for="empType2">ข้าราชการ</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">ตำแหน่งทางวิชาการปัจจุบัน <span class="text-danger">*</span></label>
                                <select name="current_position" class="form-select" required>
                                    <option value="">-- เลือก --</option>
                                    <option value="อาจารย์"
                                        th:selected="${(doc0Data != null ? doc0Data.getOrDefault('current_position', '') : (request.applicant.academicPosition ?: '')) == 'อาจารย์'}">
                                        อาจารย์</option>
                                    <option value="ผู้ช่วยศาสตราจารย์"
                                        th:selected="${(doc0Data != null ? doc0Data.getOrDefault('current_position', '') : (request.applicant.academicPosition ?: '')) == 'ผู้ช่วยศาสตราจารย์'}">
                                        ผู้ช่วยศาสตราจารย์</option>
                                    <option value="รองศาสตราจารย์"
                                        th:selected="${(doc0Data != null ? doc0Data.getOrDefault('current_position', '') : (request.applicant.academicPosition ?: '')) == 'รองศาสตราจารย์'}">
                                        รองศาสตราจารย์</option>
                                </select>
                            </div>
                        </div>

                        <!-- ตำแหน่งที่ขอรับการประเมิน -->
                        <h5 class="border-bottom pb-2 mb-3 mt-4">
                            <i class="fas fa-graduation-cap"></i> ขอรับการประเมินผลการสอนเพื่อขอกำหนดตำแหน่ง <span class="text-danger">*</span>
                        </h5>
                        <div class="row mb-3">
                            <div class="col-md-12">
                                <div class="d-flex gap-4">
                                    <div class="form-check">
                                        <input class="form-check-input target-pos-radio" type="radio" name="target_position_choice" id="targetPos1"
                                            value="chk1"
                                            th:checked="${doc0Data != null && doc0Data.getOrDefault('chk1', '') == '✓'}" required>
                                        <label class="form-check-label fw-semibold" for="targetPos1">ผู้ช่วยศาสตราจารย์ (ผศ.)</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input target-pos-radio" type="radio" name="target_position_choice" id="targetPos2"
                                            value="chk2"
                                            th:checked="${doc0Data != null && doc0Data.getOrDefault('chk2', '') == '✓'}" required>
                                        <label class="form-check-label fw-semibold" for="targetPos2">รองศาสตราจารย์ (รศ.)</label>
                                    </div>
                                </div>
                                <!-- Hidden inputs for backend binding -->
                                <input type="hidden" name="chk1" id="chk1"
                                    th:value="${doc0Data != null ? doc0Data.getOrDefault('chk1', '') : ''}">
                                <input type="hidden" name="chk2" id="chk2"
                                    th:value="${doc0Data != null ? doc0Data.getOrDefault('chk2', '') : ''}">
                            </div>
                        </div>

                        <!-- ข้อมูลรายวิชา -->
                        <h5 class="border-bottom pb-2 mb-3 mt-4"><i class="fas fa-book"></i> ข้อมูลรายวิชา</h5>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">รหัสวิชา <span class="text-danger">*</span></label>
                                <input type="text" name="course_code" class="form-control"
                                    th:value="${doc0Data != null ? doc0Data.getOrDefault('course_code', '') : ''}"
                                    placeholder="เช่น CP 123 456" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">รายวิชา <span class="text-danger">*</span></label>
                                <input type="text" name="course_name" class="form-control"
                                    th:value="${doc0Data != null ? doc0Data.getOrDefault('course_name', '') : ''}"
                                    placeholder="เช่น Introduction to Computer Science" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">ปีการศึกษา <span class="text-danger">*</span></label>
                                <input type="text" name="academic_year" class="form-control"
                                    th:value="${doc0Data != null ? doc0Data.getOrDefault('academic_year', '') : ''}"
                                    placeholder="เช่น 2568" required>
                            </div>
                        </div>

                        <!-- Validation alert -->
                        <div id="doc0ValidationAlert" class="alert alert-warning d-none mt-3" style="border-radius:10px">
                            <i class="fas fa-exclamation-triangle"></i> <span id="doc0ValidationMsg"></span>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="button" class="btn btn-outline-primary" data-action="docPreviewShow">
                                <i class="fas fa-eye"></i> ดูตัวอย่างเอกสาร
                            </button>
                            <button type="submit" name="action" value="submit" class="btn btn-academic" id="doc0SubmitBtn">
                                <i class="fas fa-paper-plane"></i> บันทึกเอกสาร
                            </button>
                            <a th:href="'/user/academic/request/' + ${request.id}"
                                class="btn btn-outline-secondary"><i class="fas fa-arrow-left"></i> กลับ</a>
                        </div>
                    </form>

            <!-- แผงลงนาม: อยู่นอก <form> ของเอกสาร เพราะมี form ของตัวเอง -->
            <div th:replace="~{academic/esign/_signature_panel :: panel}"></div>


                    <!-- เอกสารที่สร้างแล้ว -->
                    <div th:if="${existingDocs != null && !existingDocs.isEmpty()}" class="mt-4">
                        <h6 class="text-success"><i class="fas fa-check-circle"></i> เอกสารที่สร้างแล้ว</h6>
                        <div th:each="doc : ${existingDocs}" class="card doc-card generated mb-2 p-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <small class="text-success"><i class="fas fa-check"></i>
                                    [[${doc.documentLabel}]]</small>
                                <div class="btn-group btn-group-sm">
                                    <a th:href="'/user/academic/download/' + ${request.id} + '/' + ${doc.id} + '?format=docx'"
                                        class="btn btn-outline-primary" title="ดาวน์โหลด DOCX">
                                        <i class="fas fa-file-word"></i> DOCX
                                    </a>
                                    <a th:href="'/user/academic/download/' + ${request.id} + '/' + ${doc.id} + '?format=pdf'"
                                        class="btn btn-outline-danger" title="ดาวน์โหลด PDF">
                                        <i class="fas fa-file-pdf"></i> PDF
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Preview CSS & JS -->
                    <link rel="stylesheet" href="/css/doc_preview.css">
                    <script src="/js/doc_preview.js"></script>

                    <input type="hidden" id="currentDocType" value="0">
                    <input type="hidden" id="existingDataHolder" th:if="${existingData != null}" th:value="${existingData}">

                    <script>
                        // ซิงค์ค่า radio ตำแหน่งที่ขอรับการประเมิน ไปยัง hidden chk1 / chk2
                        function syncTargetPos() {
                            var r1 = document.getElementById('targetPos1');
                            var r2 = document.getElementById('targetPos2');
                            var chk1 = document.getElementById('chk1');
                            var chk2 = document.getElementById('chk2');
                            if (!r1 || !r2 || !chk1 || !chk2) return;

                            if (r1.checked) {
                                chk1.value = '✓';
                                chk2.value = '';
                            } else if (r2.checked) {
                                chk1.value = '';
                                chk2.value = '✓';
                            } else {
                                chk1.value = '';
                                chk2.value = '';
                            }
                        }

                        document.querySelectorAll('.target-pos-radio').forEach(function(radio) {
                            radio.addEventListener('change', syncTargetPos);
                        });

                        // Thai Date Defaults & Picker
                        (function () {
                            const thaiMonths = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                                'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
                            const now = new Date();
                            const thaiFullDate = now.getDate() + ' ' + thaiMonths[now.getMonth()] + ' ' + (now.getFullYear() + 543);
                            document.querySelectorAll('.thai-full-date').forEach(el => {
                                if (!el.value) el.value = thaiFullDate;
                            });

                            function toThaiDate(dateStr) {
                                const d = new Date(dateStr);
                                if (isNaN(d)) return '';
                                return d.getDate() + ' ' + thaiMonths[d.getMonth()] + ' ' + (d.getFullYear() + 543);
                            }
                            document.querySelectorAll('.thai-date-btn').forEach(btn => {
                                const group = btn.closest('.input-group');
                                const picker = group.querySelector('.thai-date-picker');
                                btn.addEventListener('click', () => picker.showPicker());
                            });
                            document.querySelectorAll('.thai-date-picker').forEach(picker => {
                                picker.addEventListener('change', function () {
                                    const group = this.closest('.input-group');
                                    const textInput = group.querySelector('.thai-full-date');
                                    if (this.value) textInput.value = toThaiDate(this.value);
                                });
                            });
                        })();

                        // โหลดข้อมูลเดิม (ถ้ามี)
                        var existingJson = document.getElementById('existingDataHolder') ? document.getElementById('existingDataHolder').value : null;
                        if (existingJson) {
                            try {
                                var data = JSON.parse(existingJson);
                                var form = document.getElementById('doc0Form');
                                if (form && data) {
                                    Object.keys(data).forEach(function(key) {
                                        var el = form.querySelector('[name="' + key + '"]');
                                        if (el && !el.value) el.value = data[key];
                                    });
                                    if (data['chk1'] === '✓') {
                                        var r1 = document.getElementById('targetPos1');
                                        if (r1) r1.checked = true;
                                    } else if (data['chk2'] === '✓') {
                                        var r2 = document.getElementById('targetPos2');
                                        if (r2) r2.checked = true;
                                    }
                                    syncTargetPos();
                                }
                            } catch (e) { console.warn('Failed to load existing data:', e); }
                        }

                        // Initialize real-time preview for Doc 0
                        initDocPreview('doc0Form', 0);

                        // === Auto-update title & Suggest Target Position based on current position ===
                        (function() {
                            var posSelect = document.querySelector('[name="current_position"]');
                            var titleSelect = document.getElementById('titleSelect');
                            var r1 = document.getElementById('targetPos1');
                            var r2 = document.getElementById('targetPos2');
                            if (!posSelect || !titleSelect) return;

                            var normalTitles = ['นาย', 'นาง', 'นางสาว'];
                            var academicTitles = ['ผู้ช่วยศาสตราจารย์', 'รองศาสตราจารย์'];

                            function updateTitleOptions() {
                                var pos = posSelect.value;
                                if (pos === 'ผู้ช่วยศาสตราจารย์' || pos === 'รองศาสตราจารย์') {
                                    // ซ่อน option ปกติ แสดง option ตำแหน่ง
                                    Array.from(titleSelect.options).forEach(function(opt) {
                                        if (normalTitles.indexOf(opt.value) !== -1) opt.hidden = true;
                                        if (academicTitles.indexOf(opt.value) !== -1) opt.hidden = false;
                                    });
                                    titleSelect.value = pos;
                                } else {
                                    // แสดง option ปกติ ซ่อน option ตำแหน่ง
                                    Array.from(titleSelect.options).forEach(function(opt) {
                                        if (normalTitles.indexOf(opt.value) !== -1) opt.hidden = false;
                                        if (academicTitles.indexOf(opt.value) !== -1) opt.hidden = true;
                                    });
                                    // ถ้า title ปัจจุบันเป็นตำแหน่งวิชาการ ให้รีเซ็ต
                                    if (academicTitles.indexOf(titleSelect.value) !== -1) {
                                        titleSelect.value = '';
                                    }
                                }

                                // Suggest target position if not selected yet
                                if (r1 && r2 && !r1.checked && !r2.checked) {
                                    if (pos === 'อาจารย์') {
                                        r1.checked = true;
                                        syncTargetPos();
                                    } else if (pos === 'ผู้ช่วยศาสตราจารย์') {
                                        r2.checked = true;
                                        syncTargetPos();
                                    }
                                }
                            }

                            posSelect.addEventListener('change', updateTitleOptions);
                            updateTitleOptions(); // run on page load
                        })();

                        // === Form Validation ===
                        (function() {
                            var form = document.getElementById('doc0Form');
                            var alert = document.getElementById('doc0ValidationAlert');
                            var alertMsg = document.getElementById('doc0ValidationMsg');

                            // Ensure target pos is synced before submit
                            syncTargetPos();

                            form.addEventListener('submit', function(e) {
                                syncTargetPos();
                                // Only validate on submit (action=submit), not draft
                                var submitter = e.submitter;
                                if (submitter && submitter.value !== 'submit') return;

                                var errors = [];

                                // Check required fields
                                var dateField = form.querySelector('[name="date"]');
                                var titleField = form.querySelector('[name="title"]');
                                var nameField = form.querySelector('[name="applicant_name"]');
                                var posField = form.querySelector('[name="current_position"]');

                                if (!dateField || !dateField.value.trim()) errors.push('วันที่เอกสาร');
                                if (!titleField || !titleField.value) errors.push('คำนำหน้า');
                                if (!nameField || !nameField.value.trim()) errors.push('ชื่อ-นามสกุล');

                                // Check radio employee_type
                                var empChecked = form.querySelector('[name="employee_type"]:checked');
                                if (!empChecked) errors.push('ประเภทบุคลากร');

                                if (!posField || !posField.value) errors.push('ตำแหน่งทางวิชาการปัจจุบัน');

                                // Check target position radio
                                var targetPosChecked = form.querySelector('[name="target_position_choice"]:checked');
                                if (!targetPosChecked) {
                                    errors.push('ตำแหน่งที่ขอรับการประเมิน (ต้องเลือก 1 ตำแหน่ง)');
                                }

                                // Check course info
                                var courseCode = form.querySelector('[name="course_code"]');
                                var courseName = form.querySelector('[name="course_name"]');
                                var academicYear = form.querySelector('[name="academic_year"]');
                                if (!courseCode || !courseCode.value.trim()) errors.push('รหัสวิชา');
                                if (!courseName || !courseName.value.trim()) errors.push('รายวิชา');
                                if (!academicYear || !academicYear.value.trim()) errors.push('ปีการศึกษา');

                                if (errors.length > 0) {
                                    e.preventDefault();
                                    alertMsg.textContent = 'กรุณากรอกข้อมูลให้ครบ: ' + errors.join(', ');
                                    alert.classList.remove('d-none');
                                    alert.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                } else {
                                    alert.classList.add('d-none');
                                }
                            });
                        })();
                    </script>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
