                    html += '<a class="doc-item-v2 doc-searchable" data-name="'+d[0]+'" href="javascript:void(0)" onclick="openPdfOverlay(\''+url+'\',\''+d[0].replace(/'/g,"\\'")+'\')">'

                      + '<span class="di-name">'+d[0]+'</span>'
                      + '<span class="di-ext">PDF</span></a>';
                });
                html += '</div></div>';
                container.insertAdjacentHTML('beforeend', html);
            });

            // Auto-collapse non-open categories
            container.querySelectorAll('.doc-category').forEach(function(cat){
                var body = cat.querySelector('.doc-category-body');
                if(!cat.classList.contains('is-open')) body.style.display='none';
            });

            // MutationObserver for toggle
            var obs = new MutationObserver(function(muts){
                muts.forEach(function(m){
                    if(m.type==='attributes'&&m.attributeName==='class'){
                        var b=m.target.querySelector('.doc-category-body');
                        if(b) b.style.display=m.target.classList.contains('is-open')?'':'none';
                    }
                });
            });
            container.querySelectorAll('.doc-category').forEach(function(c){obs.observe(c,{attributes:true});});
        })();

        // Toggle categories
        function toggleCat(header){header.closest('.doc-category').classList.toggle('is-open');}

        // Search
        function filterDocs(query){
            query=query.toLowerCase().trim();
            document.querySelectorAll('.doc-searchable').forEach(function(item){
                var name=(item.getAttribute('data-name')||'').toLowerCase();
                item.style.display=(!query||name.includes(query))?'':'none';
            });
            document.querySelectorAll('.doc-category').forEach(function(cat){
                var vis=cat.querySelectorAll('.doc-searchable:not([style*="display: none"])');
                if(query){
                    cat.style.display=vis.length>0?'':'none';
                    if(vis.length>0&&!cat.classList.contains('is-open'))cat.classList.add('is-open');
                }else{cat.style.display='';}
            });
        }

        // PDF Overlay
        var _pdfTimeout;
        function openPdfOverlay(url,title){
            document.getElementById('pdfTitle').textContent=title;
            var spinner=document.getElementById('pdfSpinner');
            var frame=document.getElementById('pdfFrame');
            spinner.style.display='block';
            frame.style.opacity='0';
            frame.src=url;
            frame.onload=function(){
                spinner.style.display='none';
                frame.style.opacity='1';
            };
            clearTimeout(_pdfTimeout);
            _pdfTimeout=setTimeout(function(){spinner.style.display='none';frame.style.opacity='1';},15000);
            document.getElementById('pdfDownloadLink').href=url;
            document.getElementById('pdfOverlay').style.display='flex';
            document.body.style.overflow='hidden';
        }
        function closePdfOverlay(){
            document.getElementById('pdfOverlay').style.display='none';
            var frame=document.getElementById('pdfFrame');
            frame.src='';frame.onload=null;
            clearTimeout(_pdfTimeout);
            document.body.style.overflow='';
        }
        document.addEventListener('keydown',function(e){
            if(e.key==='Escape'&&document.getElementById('pdfOverlay').style.display==='flex')closePdfOverlay();
        });
