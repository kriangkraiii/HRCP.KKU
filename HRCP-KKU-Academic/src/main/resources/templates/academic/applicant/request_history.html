<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic :: layout(~{::section})}">

<body>
    <section>
        <div class="container py-4">
            <div class="mb-3">
                <a href="/user/academic/dashboard" class="btn-back-pill" onclick="if(window.history.length > 1 && document.referrer) { history.back(); return false; }">
                    <i class="fas fa-arrow-left"></i> กลับ
                </a>
            </div>

            <h3 class="mb-4"><i class="fas fa-history"></i> ประวัติการยื่นคำร้อง</h3>

            <div th:if="${requests == null || requests.isEmpty()}" class="text-center py-5">
                <i class="fas fa-folder-open fa-3x text-muted mb-3"></i>
                <p class="text-muted">ยังไม่มีประวัติคำร้อง</p>
            </div>

            <div th:each="req : ${requests}" class="card card-academic mb-4">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h5 class="mb-2">คำร้อง [[${req.requestCode}]] — [[${req.applicant.name}]]</h5>
                            <div class="d-flex flex-wrap gap-2 align-items-center">
                                <span class="badge bg-secondary">
                                    <i class="fas fa-file-alt me-1"></i> ประเมินผลการสอน
                                </span>
                                <span class="badge bg-light text-dark border">
                                    <i class="fas fa-calendar me-1"></i> วันที่ยื่น:
                                    <span th:text="${req.submissionDate != null ? @thaiDateUtil.format(req.submissionDate) : 'ยังไม่ได้ยื่น'}"></span>
                                </span>
                                <span class="status-badge" th:classappend="'status-' + ${req.currentStatus.name()}"
                                    th:text="${req.currentStatus.thaiLabel}"></span>
                            </div>
                        </div>
                    </div>

                    <!-- สถานะ (แสดงแบบ pill) -->


                    <!-- Meeting Date -->
                    <div th:if="${req.meetingDate != null}" class="alert alert-info d-flex align-items-center mb-3 py-2">
                        <i class="fas fa-calendar-alt me-2"></i>
                        <div>
                            <strong>วันประชุม:</strong> <span
                                th:text="${@thaiDateUtil.format(req.meetingDate)}"></span>
                            <span th:if="${req.meetingLocation != null}"> | <strong>สถานที่:</strong>
                                [[${req.meetingLocation}]]</span>
                        </div>
                    </div>

                    <!-- ข้อความเพิ่มเติมตามสถานะ -->
                    <div th:if="${req.currentStatus.name() == 'COMPLETED_REVISE'}" class="alert alert-warning mb-3 py-2">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        กรุณานำส่งเอกสารที่แก้ไขแล้ว <strong>(ฉบับจริง)</strong> ให้แก่นักทรัพยากรบุคคล วิทยาลัยการคอมพิวเตอร์
                    </div>

                    <a th:href="'/user/academic/request/' + ${req.id}" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-eye"></i> ดูรายละเอียด
                    </a>
                </div>
            </div>
        </div>
        <script>
        document.querySelectorAll('.card-academic').forEach(function(c,i){c.style.setProperty('--card-delay',i*80+'ms');});
        </script>
    </section>
</body>

</html>
