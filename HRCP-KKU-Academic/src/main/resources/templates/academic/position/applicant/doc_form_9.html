<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic :: layout(~{::section})}">
<body>
    <section>
        <div class="container py-4">
            <div class="mb-3">
                <a th:href="'/user/position/request/' + ${request.id}" class="btn-back-pill">
                    <i class="fas fa-arrow-left"></i> กลับ
                </a>
            </div>

            <h3 class="mb-2"><i class="fas fa-file-alt"></i> เอกสารที่ 6: แบบแสดงหลักฐานการมีส่วนร่วมในผลงานทางวิชาการ</h3>
            <!--/* แยกฉบับตามงานวิจัยในเอกสารที่ 1 — เอกสารแนบท้ายข้อบังคับ มข. พ.ศ. 2569 ข้อ 3.3 */-->
            <p class="text-muted mb-4" th:if="${workNo != null and workNo > 0}">
                งานวิจัยที่ <span th:text="${workNo}">1</span><span th:replace="~{academic/_info_tip :: tip('กรอกและลงนามแยกฉบับสำหรับงานวิจัยแต่ละเรื่อง ผู้ประพันธ์อันดับแรกและผู้ประพันธ์บรรณกิจของเรื่องนี้ลงนามรับรองในฉบับนี้')}"></span>
            </p>

            <div th:replace="~{academic/_applicant_doc_gate :: banner}"></div>
            <!--/* ขั้นตอน: กรอก → ตรวจสอบและลงนาม */-->
            <div th:replace="~{academic/_doc_step_progress :: steps}"></div>
            <div th:replace="~{academic/_doc_step_progress :: savedCallout}"></div>

            <form th:action="'/user/position/request/' + ${request.id} + '/document/' + ${documentType}" method="post" id="doc9Form" th:attr="data-auto-draft='/api/draft/position/' + ${request.id} + '/' + ${documentType}"
>

                <!--/* ข้อมูลผลงาน */-->
                <div class="card card-academic mb-4">
                    <div class="card-header bg-white"><h5 class="mb-0">ก. ข้อมูลผลงาน <small class="text-muted fw-normal">(กลุ่มที่ 1 งานวิจัย)</small></h5></div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">ชื่อผลงาน <span class="text-danger">*</span><th:block th:if="${lockedFields != null and lockedFields.containsKey('title_name')}"><span
                                        th:replace="~{academic/_info_tip :: tip('ดึงจากงานวิจัยในเอกสารที่ 1 — ถ้าต้องแก้ชื่อผลงาน ให้แก้ที่เอกสารที่ 1')}"></span></th:block></label>
                                <input type="text" name="title_name" class="form-control" required
                                       th:readonly="${lockedFields != null and lockedFields.containsKey('title_name')}"
                                       th:value="${lockedFields != null ? lockedFields['title_name'] : null}"
                                       title="ตามงานวิจัยในเอกสารที่ 1 แก้ไขที่เอกสารที่ 1">
                            </div>
                        </div>
                    </div>
                </div>

                <!--/* สถานะผู้ขอ */-->
                <!--/* data-missing-key: เซิร์ฟเวอร์ตอบ applicant_role เมื่อไม่ติ๊กสักข้อ (DocumentCompleteness.APPLICANT_ROLE) */-->
                <div class="card card-academic mb-4" id="applicantRoleCard"
                     data-missing-key="applicant_role" data-missing-label="ข. สถานะผู้ขอในผลงาน (ติ๊กอย่างน้อยหนึ่งข้อ)">
                    <div class="card-header bg-white"><h5 class="mb-0">ข. สถานะผู้ขอในผลงาน <span class="text-danger">*</span><span th:replace="~{academic/_info_tip :: tip('ติ๊กอย่างน้อยหนึ่งข้อ — เป็นทั้งผู้ประพันธ์อันดับแรกและผู้ประพันธ์บรรณกิจได้ ส่วนผู้นิพนธ์ร่วมเลือกคู่กับสองข้อแรกไม่ได้')}"></span></h5></div>
                    <div class="card-body">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="chk_ firstauthor" value="☑" id="chkFA">
                            <label class="form-check-label" for="chkFA">ผู้ประพันธ์อันดับแรก (first author)</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="chk_corresp" value="☑" id="chkCorr">
                            <label class="form-check-label" for="chkCorr">ผู้ประพันธ์บรรณกิจ (corresponding author)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="chk_coauthor" value="☑" id="chkCoauthor">
                            <label class="form-check-label" for="chkCoauthor">ผู้นิพนธ์ร่วม (co-author)</label>
                        </div>
                        <!--/* คำเตือนเมื่อยังไม่ติ๊ก หรือติ๊กขัดกัน — ข้อความเติมจากสคริปต์ (validate) */-->
                        <div class="small text-danger mt-2" id="applicantRoleError" hidden></div>
                    </div>
                </div>

                <!--/* รายละเอียดการมีส่วนร่วม */-->
                <div class="card card-academic mb-4">
                    <div class="card-header bg-white"><h5 class="mb-0">รายละเอียดการมีส่วนร่วม</h5></div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold">ก. ความคิดริเริ่ม (idea) และสมมุติฐาน</label>
                            <textarea name="role_des1" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">ข. การออกแบบ การทดลอง การทดสอบ เครื่องมือวัด วิธีการเก็บข้อมูล</label>
                            <textarea name="role_des2" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">ค. การจัดเก็บข้อมูล การวิเคราะห์ข้อมูล การแปรผล</label>
                            <textarea name="role_des3" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">ง. การวิพากษ์วิจารณ์ผล การเปรียบเทียบกับองค์ความรู้เดิม</label>
                            <textarea name="role_des4" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">จ. การมีส่วนร่วมในการเขียน manuscript</label>
                            <textarea name="role_des5" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">ฉ. การให้การสนับสนุน (specimens, ทุนวิจัย, เครื่องมือ ฯลฯ)</label>
                            <textarea name="role_des6" class="form-control" rows="2"></textarea>
                        </div>
                        <div>
                            <label class="form-label fw-bold">ช. อื่นๆ</label>
                            <textarea name="role_des7" class="form-control" rows="2"></textarea>
                        </div>
                    </div>
                </div>

                <!--/* ผู้ลงนาม: ผู้ขอ ผู้ประพันธ์อันดับแรก และผู้ประพันธ์บรรณกิจ (บทความมีบรรณกิจได้หลายคน — เพิ่มเป็นแถว)
                     ทุกคนลงนามในระบบ (SignatureAnchorRegistry.workParticipationSlots) */-->
                <div class="card card-academic mb-4">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">ผู้ลงนาม</h5>
                        <div class="d-flex align-items-center">
                            <!--/* ครบ 10 แถวแล้วปุ่มถูกปิด — บอกเหตุผลเป็นปุ่ม (i) */-->
                            <span id="coauthorLimitTip" hidden><span th:replace="~{academic/_info_tip :: tip('เพิ่มผู้ประพันธ์บรรณกิจได้สูงสุด 10 คน (รวมเป็น 11 คนกับช่องบรรณกิจด้านบน)')}"></span></span>
                            <button type="button" class="btn btn-success btn-sm ms-2" id="btnAddCoauthor">
                                <i class="fas fa-plus-circle"></i> เพิ่มผู้ประพันธ์บรรณกิจ
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <!--/* Fixed signers */-->
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label">ผู้ขอกำหนดตำแหน่ง <span class="text-danger">*</span></label>
                                <input type="text" name="applicant_name" class="form-control" required
                                       th:readonly="${lockedFields != null and lockedFields.containsKey('applicant_name')}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">ผู้ประพันธ์อันดับแรก (First author)</label>
                                <input type="text" name="firstauthor_name" class="form-control" data-person-picker data-allow-external>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">ผู้ประพันธ์บรรณกิจ (Corresponding)</label>
                                <input type="text" name="corres_name" class="form-control" data-person-picker data-allow-external
                                       data-distinct-group="corresponding">
                            </div>
                        </div>
                        <!--/* ผู้ประพันธ์บรรณกิจเพิ่มเติม — ชื่อช่อง coauthor_name_N ตามร่างเดิม */-->
                        <div id="coauthorBlocks"></div>
                        <input type="hidden" name="coauthor_count" id="coauthorCountField" value="0">
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-primary" data-action="docPreviewShow">
                        <i class="fas fa-eye"></i> ดูตัวอย่างเอกสาร
                    </button>
                </div>
            </form>

            <!--/* แผงลงนาม: อยู่นอก <form> ของเอกสาร เพราะมี form ของตัวเอง */-->
            <div th:replace="~{academic/esign/_signature_panel :: panel}"></div>

        </div>

        <script th:inline="javascript">
            let coauthorCount = 0;
            // เท่ากับ SignatureAnchorRegistry.MAX_EXTRA_CORRESPONDING — แถวละหนึ่งช่องลงนาม
            const MAX_EXTRA_CORRESPONDING = 10;

            // ผู้ประพันธ์บรรณกิจเพิ่มเติม: เลือกจากรายชื่อในระบบ หรือเพิ่มผู้ลงนามภายนอกด้วยอีเมล (person_picker.js)
            // แถวที่ N คือบรรณกิจคนที่ N+1 ลงนามในระบบต่อจากผู้ขอทันที ห้ามเลือกคนเดียวกับบรรณกิจช่องอื่น
            function addCoauthorRow(nameVal, signerId, fromUser) {
                if (coauthorCount >= MAX_EXTRA_CORRESPONDING) return;
                coauthorCount++;
                const n = coauthorCount;
                const div = document.createElement('div');
                div.className = 'row g-2 mb-2 align-items-start coauthor-row';
                div.setAttribute('data-idx', n);
                div.innerHTML = `
                    <div class="col-md-3 pt-2"><label class="small fw-semibold mb-0">ผู้ประพันธ์บรรณกิจ คนที่ <span class="coauthor-no">${n + 1}</span></label></div>
                    <div class="col-md-7">
                        <input type="text" name="coauthor_name_${n}" class="form-control" value="${escHtml(nameVal || '')}"
                               data-person-picker data-allow-external data-distinct-group="corresponding">
                    </div>
                    <div class="col-md-2">
                        <button type="button" class="btn btn-outline-danger btn-sm mt-1" data-call="removeCoauthor" data-call-arg="self">
                            <i class="fas fa-trash-alt"></i> ลบ
                        </button>
                    </div>`;
                document.getElementById('coauthorBlocks').appendChild(div);
                const picker = window.PersonPicker && window.PersonPicker.attach(div.querySelector('input[data-person-picker]'));
                if (picker && signerId) picker.hidden.value = signerId;
                updateCoauthorCount(fromUser);
            }

            function removeCoauthor(btn) {
                btn.closest('.coauthor-row').remove();
                renumberCoauthors();
                updateCoauthorCount(true);
            }

            function renumberCoauthors() {
                const rows = document.querySelectorAll('#coauthorBlocks .coauthor-row');
                coauthorCount = rows.length;
                rows.forEach((row, i) => {
                    const num = i + 1;
                    row.setAttribute('data-idx', num);
                    row.querySelector('.coauthor-no').textContent = num + 1;
                    // รวมช่องซ่อนรหัสบัญชี coauthor_name_N__signer ของตัวค้นหาชื่อด้วย
                    row.querySelectorAll('input').forEach(input => {
                        input.name = input.name.replace(/_\d+(__signer)?$/, '_' + num + '$1');
                    });
                });
            }

            // จำนวนแถวคือแหล่งความจริง — ร่างรวมค่าใหม่ทับค่าเดิม ชื่อของแถวที่ลบยังค้างอยู่ใน JSON
            // notify: ผู้ใช้เพิ่ม/ลบแถว — บอกบันทึกร่างอัตโนมัติและแผงลงนาม (ตอนเติมร่างที่บันทึกไว้ไม่ต้อง)
            function updateCoauthorCount(notify) {
                const field = document.getElementById('coauthorCountField');
                field.value = coauthorCount;
                if (notify) field.dispatchEvent(new Event('change', { bubbles: true }));
                const full = coauthorCount >= MAX_EXTRA_CORRESPONDING;
                document.getElementById('btnAddCoauthor').disabled = full;
                document.getElementById('coauthorLimitTip').hidden = !full;
            }

            function escHtml(s) { return s ? s.replace(/"/g, '&quot;').replace(/</g, '&lt;') : ''; }

            document.addEventListener('DOMContentLoaded', function() {
                document.getElementById('btnAddCoauthor').addEventListener('click', () => addCoauthorRow('', '', true));

                const existingData = /*[[${existingData}]]*/ null;
                if (existingData) {
                    try {
                        const data = JSON.parse(existingData);

                        // ผู้ประพันธ์บรรณกิจเพิ่มเติม — ตามจำนวนแถวที่บันทึกไว้ ไม่ใช่คีย์ที่ค้างจากแถวที่ลบไปแล้ว
                        // ร่างเก่าที่ไม่มี coauthor_count ใช้เลขแถวสูงสุดที่พบแทน
                        let maxCo = parseInt(data.coauthor_count, 10);
                        if (isNaN(maxCo)) {
                            maxCo = 0;
                            for (const key of Object.keys(data)) {
                                const m = key.match(/^coauthor_name_(\d+)$/);
                                if (m) maxCo = Math.max(maxCo, parseInt(m[1]));
                            }
                        }
                        for (let i = 1; i <= maxCo; i++) {
                            addCoauthorRow(data[`coauthor_name_${i}`], data[`coauthor_name_${i}__signer`]);
                        }

                        // Restore other fields
                        for (const [key, value] of Object.entries(data)) {
                            if (key.startsWith('coauthor_')) continue; // already handled
                            const el = document.querySelector(`[name="${key}"]`);
                            if (el) {
                                if (el.type === 'checkbox') { el.checked = (value === '☑'); }
                                else { el.value = value; }
                            }
                        }
                    } catch(e) {}
                }
            });
        </script>

        <style>
            .form-check-input.role-locked { opacity: .35; pointer-events: none; }
            .form-check-input.role-locked + .form-check-label { opacity: .5; }
            /* เซิร์ฟเวอร์ตอบว่ายังไม่ติ๊กสถานะ — doc_required_validate.js ใส่ .is-invalid ให้ทั้งการ์ด */
            #applicantRoleCard.is-invalid { border: 1px solid var(--bs-danger); }
        </style>
        <script>
            // ผู้ประพันธ์อันดับแรก + บรรณกิจ เลือกพร้อมกันได้ ผู้นิพนธ์ร่วมเลือกคู่กับสองข้อนั้นไม่ได้ — ข้อที่ขัดกันถูกล็อก
            // ล็อกด้วยหน้าตาและกันการคลิก ไม่ใช้ disabled เพราะ auto_draft.js ข้ามช่อง disabled ค่า ☐ จะไม่ถูกบันทึก
            (function () {
                function lock(el, locked) {
                    el.classList.toggle('role-locked', locked);
                    el.setAttribute('aria-disabled', locked ? 'true' : 'false');
                    el.title = locked ? 'เลือกคู่กับข้อที่ติ๊กไว้ไม่ได้ — เอาติ๊กข้อนั้นออกก่อน' : '';
                }
                function sync() {
                    const fa = document.getElementById('chkFA');
                    const corr = document.getElementById('chkCorr');
                    const co = document.getElementById('chkCoauthor');
                    if (!fa || !corr || !co) return;
                    const lockAuthors = co.checked;
                    const lockCo = fa.checked || corr.checked;
                    // ล็อกเฉพาะข้อที่ยังไม่ติ๊ก — ข้อที่ติ๊กอยู่ต้องเอาออกได้เสมอ ไม่อย่างนั้นร่างที่ติ๊กขัดกันไว้แล้ว
                    // (เช่น ติ๊กครบสามข้อ) จะถูกล็อกทุกข้อจนแก้ไม่ได้
                    lock(fa, lockAuthors && !fa.checked);
                    lock(corr, lockAuthors && !corr.checked);
                    lock(co, lockCo && !co.checked);
                    validate(fa.checked || corr.checked || co.checked, co.checked && lockCo);
                }
                // ต้องติ๊กอย่างน้อยหนึ่งข้อ และผู้นิพนธ์ร่วมคู่กับสองข้อแรกไม่ได้ (DocumentCompleteness) — ปุ่มส่งลงนาม
                // อยู่คนละฟอร์ม บอก sign_presave.js ผ่าน data-sign-blocked เหมือนเอกสารที่ 2
                function validate(any, conflict) {
                    const problem = conflict
                        ? 'ยังส่งไปลงนามไม่ได้ — ผู้นิพนธ์ร่วมเลือกคู่กับผู้ประพันธ์อันดับแรกหรือผู้ประพันธ์บรรณกิจไม่ได้ กรุณาเอาติ๊กข้อที่ไม่ใช่ออก'
                        : !any ? 'ยังส่งไปลงนามไม่ได้ — กรุณาติ๊ก ข. สถานะผู้ขอในผลงาน อย่างน้อยหนึ่งข้อ' : null;
                    const form = document.getElementById('doc9Form');
                    if (form) {
                        if (problem) form.setAttribute('data-sign-blocked', problem);
                        else form.removeAttribute('data-sign-blocked');
                    }
                    // บนการ์ดแสดงเฉพาะติ๊กขัดกัน (ร่างเก่าอาจติ๊กไว้แล้ว) — "ติ๊กอย่างน้อยหนึ่งข้อ" อยู่ในปุ่ม (i)
                    // ที่หัวข้อ และแผงลงนามบอกเหตุผลเองตอนกดส่ง
                    const show = conflict;
                    const error = document.getElementById('applicantRoleError');
                    if (error) {
                        error.hidden = !show;
                        if (problem) error.textContent = problem.replace('ยังส่งไปลงนามไม่ได้ — ', '');
                    }
                    const card = document.getElementById('applicantRoleCard');
                    if (card) card.classList.toggle('border-danger', show);
                }
                document.addEventListener('click', e => {
                    if (e.target.classList && e.target.classList.contains('role-locked')) e.preventDefault();
                }, true);
                document.addEventListener('change', e => {
                    if (['chkFA', 'chkCorr', 'chkCoauthor'].includes(e.target.id)) sync();
                });
                // กดส่งลงนามทั้งที่ยังไม่ติ๊ก — ชี้ให้เห็นที่ข้อ ข. ด้วย ไม่ใช่แค่ข้อความในแผงลงนาม
                document.addEventListener('submit', e => {
                    const form = document.getElementById('doc9Form');
                    if (!form || !form.hasAttribute('data-sign-blocked') || !e.target.hasAttribute('data-presave-doc')) return;
                    sync();
                    document.getElementById('applicantRoleCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, true);
                // หลังเติมค่าที่บันทึกไว้ (DOMContentLoaded ของฟอร์ม)
                document.addEventListener('DOMContentLoaded', () => setTimeout(sync, 0));
            })();
        </script>
        <script th:inline="javascript">
            // ติ๊กว่าผู้ขอเป็นผู้ประพันธ์อันดับแรก/บรรณกิจ → ช่องผู้ลงนามตำแหน่งนั้นคือผู้ขอ ล็อกไว้จนกว่าจะเอาติ๊กออก
            // เลือกผ่านตัวค้นหาชื่อ (person_picker.js) เพื่อให้รหัสบัญชีซ่อนตรงกับชื่อ เซิร์ฟเวอร์จับคู่ผู้ลงนามจากสองค่านี้
            (function () {
                const me = {
                    userId: /*[[${user.id}]]*/ null,
                    name: /*[[${userPrintedName}]]*/ ''
                };
                // ช่องติ๊ก → ช่องชื่อผู้ลงนาม (ห้ามเขียนอาร์เรย์ซ้อนติดกัน: Thymeleaf อ่านวงเล็บเหลี่ยมคู่เป็น expression)
                const BINDINGS = Object.entries({ chkFA: 'firstauthor_name', chkCorr: 'corres_name' });
                const NOTE = 'ท่านติ๊กว่าเป็นตำแหน่งนี้ในข้อ ข. — ท่านลงนามช่องนี้เอง ถ้าเป็นคนอื่น ให้เอาติ๊กออกก่อน';

                function apply(chk, field, userAction) {
                    const input = document.querySelector(`[name="${field}"]`);
                    const picker = input && input.__personPicker;
                    if (!picker || !me.userId || !me.name) return;
                    const hint = input.parentNode.querySelector('.person-picker-hint');
                    const isMe = picker.hidden.value === String(me.userId);
                    // คำอธิบายตอนล็อกเป็นปุ่ม (i) ข้างป้ายกำกับ แทนปุ่ม (i) ปกติของตัวค้นหาชื่อ
                    let note = picker.tip && picker.tip.parentNode
                        ? picker.tip.parentNode.querySelector('.self-signer-tip') : null;
                    if (!note && picker.tip && picker.tip.parentNode && window.InfoTip) {
                        note = window.InfoTip.create(NOTE);
                        note.classList.add('self-signer-tip');
                        picker.tip.insertAdjacentElement('afterend', note);
                    }

                    if (chk.checked) {
                        if (!isMe && !input.disabled) picker.choose({ userId: me.userId, name: me.name });
                    } else if (isMe && userAction) {
                        picker.choose(null); // ผู้ขอไม่ใช่ตำแหน่งนี้แล้ว — ให้เลือกผู้ประพันธ์ตัวจริง
                    }
                    const locked = chk.checked;
                    if (!input.disabled) input.readOnly = locked;
                    if (hint) hint.hidden = locked;
                    if (note) note.hidden = !locked;
                    if (picker.tip) picker.tip.hidden = locked;
                    showInPanel(field);
                }

                // แผงลงนาม: ช่องผู้ประพันธ์แสดงชื่อที่เลือกในเอกสาร — ผู้ขอเองลงนามพร้อมกับช่องผู้ขอ
                // คนอื่นได้รับแจ้งให้ลงนามทันทีหลังผู้ขอลงนาม ไม่รอเจ้าหน้าที่ (SignatureAnchorRegistry.isApplicantSide)
                function showInPanel(field) {
                    const box = document.querySelector(`[data-slot-field="${field}"]`);
                    const input = document.querySelector(`[name="${field}"]`);
                    if (!box || !input) return;
                    const signerId = (document.querySelector(`[name="${field}__signer"]`) || {}).value || '';
                    const name = input.value.trim();
                    let note, state;
                    if (!name) {
                        note = '— ยังไม่ได้เลือกชื่อในเอกสาร';
                        state = 'empty';
                    } else if (!signerId) {
                        note = '— “' + name + '” ยังไม่ได้เลือกจากรายชื่อในระบบ';
                        state = 'problem';
                    } else if (signerId === String(me.userId)) {
                        note = '— ท่านลงนามช่องนี้พร้อมกันในครั้งเดียว';
                        state = 'mine';
                    } else {
                        note = '— ' + name + ' · ระบบส่งให้ลงนามต่อทันทีหลังท่านลงนาม';
                        state = 'other';
                    }
                    box.querySelector('[data-slot-note]').textContent = note;
                    box.classList.toggle('border-danger', state === 'problem');
                    box.querySelector('[data-slot-icon]').className = 'fas me-1 ' + ({
                        empty: 'fa-user-clock text-muted',
                        problem: 'fa-triangle-exclamation text-danger',
                        mine: 'fa-user-check text-success',
                        other: 'fa-user-pen text-primary'
                    })[state];
                }

                function applyAll(userAction) {
                    BINDINGS.forEach(([id, field]) => {
                        const chk = document.getElementById(id);
                        if (chk) apply(chk, field, userAction);
                    });
                }

                document.addEventListener('change', e => {
                    if (BINDINGS.some(([id]) => id === e.target.id)) applyAll(true);
                    // เลือก/ล้างชื่อในตัวค้นหาชื่อ — แผงลงนามแสดงตามทันที (รวมบรรณกิจเพิ่มเติม coauthor_name_N)
                    if (BINDINGS.some(([, field]) => field === e.target.name) || ROW_FIELD.test(e.target.name)) {
                        showInPanel(e.target.name);
                    }
                    // เพิ่ม/ลบแถว — เลขแถวเลื่อน ชื่อในแผงต้องตามแถวใหม่ทุกช่อง
                    if (e.target.name === 'coauthor_count') showRowsInPanel();
                });
                const ROW_FIELD = /^coauthor_name_\d+$/;
                function showRowsInPanel() {
                    document.querySelectorAll('#coauthorBlocks input[name]').forEach(input => {
                        if (ROW_FIELD.test(input.name)) showInPanel(input.name);
                    });
                }
                // ตัวค้นหาชื่อจำค่าที่บันทึกไว้ตอน load — ผูกหลังจากนั้น
                window.addEventListener('load', () => setTimeout(() => { applyAll(false); showRowsInPanel(); }, 0));
            })();
        </script>

        <script th:inline="javascript">
            window.AUTOFILL_USER = {
                title: /*[[${user.title}]]*/ '',
                name: /*[[${user.name}]]*/ '',
                academicPosition: /*[[${user.academicPosition}]]*/ '',
                email: /*[[${user.email}]]*/ '',
                mobileNumber: /*[[${user.mobileNumber}]]*/ ''
            };
            window.AUTOFILL_DOC1 = /*[[${doc1Data}]]*/ null;
        </script>
        <script src="/js/position_autofill.js"></script>
        <script src="/js/position_form_validate.js"></script>

        <link rel="stylesheet" href="/css/doc_preview.css">
        <script>initDocPreview('doc9Form', 9, '/api/position/preview');</script>
    <th:block th:replace="~{academic/_applicant_doc_gate :: script('doc9Form')}"></th:block>
    </section>
</body>
