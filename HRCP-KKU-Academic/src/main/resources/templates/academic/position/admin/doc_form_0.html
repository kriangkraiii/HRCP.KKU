<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic :: layout(~{::section})}">
<body>
    <section>
        <div class="container py-4">
            <div class="mb-3">
                <a th:href="'/admin/position/request/' + ${request.id}" class="btn-back-pill">
                    <i class="fas fa-arrow-left"></i> กลับ
                </a>
            </div>
            <h3 class="mb-4"><i class="fas fa-file-alt"></i> เอกสารที่ 0: บันทึกข้อความ ขอรับการประเมินผลการสอน</h3>
            <div class="alert alert-info"><i class="fas fa-info-circle"></i> เอกสารนี้กรอกโดย <strong>ผู้ยื่นคำร้อง</strong> — แอดมินสามารถดูและแก้ไขได้</div>

            <form th:action="'/admin/position/request/' + ${request.id} + '/document/0'" method="post" id="doc0Form" th:attr="data-auto-draft='/api/draft/position/' + ${request.id} + '/0'">

                <!-- หัวบันทึกข้อความ -->
                <div class="card card-academic mb-4">
                    <div class="card-header bg-white"><h5 class="mb-0">หัวบันทึกข้อความ</h5></div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">เลขที่หนังสือ</label>
                                <input type="text" name="memo_no" class="form-control" placeholder="เช่น ๑๒๓/๒๕๖๙">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">วันที่</label>
                                <input type="text" name="date" class="form-control" placeholder="เช่น ๑๐ มีนาคม พ.ศ. ๒๕๖๙">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ข้อมูลผู้ขอรับการประเมิน -->
                <div class="card card-academic mb-4">
                    <div class="card-header bg-white"><h5 class="mb-0">ข้อมูลผู้ขอรับการประเมิน</h5></div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">คำนำหน้า <span class="text-danger">*</span></label>
                                <select name="title" class="form-select" required>
                                    <option value="">-- เลือก --</option>
                                    <option value="นาย">นาย</option>
                                    <option value="นาง">นาง</option>
                                    <option value="นางสาว">นางสาว</option>
                                    <option value="ผศ.ดร.">ผศ.ดร.</option>
                                    <option value="รศ.ดร.">รศ.ดร.</option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">ชื่อ-นามสกุล <span class="text-danger">*</span></label>
                                <input type="text" name="applicant_name" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">ชื่อ-นามสกุลเต็ม (สำหรับลงนาม)</label>
                                <input type="text" name="full_name" class="form-control" placeholder="เช่น นายสมชาย ใจดี">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">ตำแหน่งปัจจุบัน</label>
                                <input type="text" name="current_position" class="form-control" placeholder="เช่น อาจารย์">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">ประเภทพนักงาน</label>
                                <select name="employee_type" class="form-select">
                                    <option value="">-- เลือก --</option>
                                    <option value="พนักงานมหาวิทยาลัย">พนักงานมหาวิทยาลัย</option>
                                    <option value="ข้าราชการ">ข้าราชการ</option>
                                    <option value="พนักงานราชการ">พนักงานราชการ</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- รายวิชาที่ขอรับการประเมิน -->
                <div class="card card-academic mb-4">
                    <div class="card-header bg-white"><h5 class="mb-0">รายวิชาที่ขอรับการประเมินผลการสอน</h5></div>
                    <div class="card-body">
                        <p class="text-muted mb-3">เลือกรายวิชาที่ต้องการขอรับการประเมิน (สูงสุด 3 รายวิชา)</p>

                        <!-- รายวิชาที่ 1 -->
                        <div class="border rounded p-3 mb-3">
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="chkCourse1" data-call-change="toggleCourse" data-call-args="[1]" data-call-arg="checked">
                                <input type="hidden" name="chk1" value="☐">
                                <label class="form-check-label fw-bold" for="chkCourse1">รายวิชาที่ 1</label>
                            </div>
                            <div class="row g-2 ms-4" id="course1Fields">
                                <div class="col-md-3">
                                    <label class="form-label">รหัสรายวิชา</label>
                                    <input type="text" name="course_code" class="form-control form-control-sm" placeholder="เช่น CP001101">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">ชื่อรายวิชา</label>
                                    <input type="text" name="course_name" class="form-control form-control-sm" placeholder="เช่น Introduction to CS">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">ปีการศึกษา</label>
                                    <input type="text" name="academic_year" class="form-control form-control-sm" placeholder="เช่น ๒๕๖๘">
                                </div>
                            </div>
                        </div>

                        <!-- รายวิชาที่ 2 -->
                        <div class="border rounded p-3 mb-3">
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="chkCourse2" data-call-change="toggleCourse" data-call-args="[2]" data-call-arg="checked">
                                <input type="hidden" name="chk2" value="☐">
                                <label class="form-check-label fw-bold" for="chkCourse2">รายวิชาที่ 2</label>
                            </div>
                            <div class="row g-2 ms-4" id="course2Fields">
                                <div class="col-md-3">
                                    <label class="form-label">รหัสรายวิชา</label>
                                    <input type="text" name="course_code_2" class="form-control form-control-sm" placeholder="เช่น CP001101">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">ชื่อรายวิชา</label>
                                    <input type="text" name="course_name_2" class="form-control form-control-sm" placeholder="เช่น Introduction to CS">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">ปีการศึกษา</label>
                                    <input type="text" name="academic_year_2" class="form-control form-control-sm" placeholder="เช่น ๒๕๖๘">
                                </div>
                            </div>
                        </div>

                        <!-- รายวิชาที่ 3 -->
                        <div class="border rounded p-3 mb-3">
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="chkCourse3" data-call-change="toggleCourse" data-call-args="[3]" data-call-arg="checked">
                                <input type="hidden" name="chk3" value="☐">
                                <label class="form-check-label fw-bold" for="chkCourse3">รายวิชาที่ 3</label>
                            </div>
                            <div class="row g-2 ms-4" id="course3Fields">
                                <div class="col-md-3">
                                    <label class="form-label">รหัสรายวิชา</label>
                                    <input type="text" name="course_code_3" class="form-control form-control-sm" placeholder="เช่น CP001101">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">ชื่อรายวิชา</label>
                                    <input type="text" name="course_name_3" class="form-control form-control-sm" placeholder="เช่น Introduction to CS">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">ปีการศึกษา</label>
                                    <input type="text" name="academic_year_3" class="form-control form-control-sm" placeholder="เช่น ๒๕๖๘">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-academic btn-lg">
                        <i class="fas fa-save"></i> บันทึกและสร้างเอกสาร
                    </button>
                    <button type="button" class="btn btn-outline-primary" data-action="docPreviewShow">
                        <i class="fas fa-eye"></i> ดูตัวอย่างเอกสาร
                    </button>
                    <a th:href="'/admin/position/request/' + ${request.id}" class="btn-back-pill">
                        <i class="fas fa-arrow-left"></i> กลับ
                    </a>
                </div>
            </form>
        </div>

        <script>
            function toggleCourse(num, checked) {
                document.querySelector('[name="chk' + num + '"]').value = checked ? '☑' : '☐';
            }
        </script>

        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
                const existingData = /*[[${existingData}]]*/ null;
                if (existingData) {
                    try {
                        const data = JSON.parse(existingData);
                        for (const [key, value] of Object.entries(data)) {
                            const el = document.querySelector('[name="' + key + '"]');
                            if (el) {
                                if (el.type === 'checkbox') { el.checked = (value === '☑'); }
                                else { el.value = value; }
                            }
                        }
                        // Restore checkbox states
                        for (let i = 1; i <= 3; i++) {
                            if (data['chk' + i] === '☑') {
                                const cb = document.getElementById('chkCourse' + i);
                                if (cb) cb.checked = true;
                            }
                        }
                    } catch(e) {}
                }
            });
        </script>

        <link rel="stylesheet" href="/css/doc_preview.css">
        <script src="/js/position_notify_confirm.js"></script>
        <script>
            initDocPreview('doc0Form', 0, '/api/position/preview');
            initPositionNotifyConfirm('doc0Form', 0);
        </script>
    </section>
</body>
</html>
