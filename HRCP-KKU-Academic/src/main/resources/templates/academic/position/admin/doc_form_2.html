<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic :: layout(~{::section})}">
<body>
    <section>
        <div class="container py-4">
            <h3 class="mb-4"><i class="fas fa-file-alt"></i> เอกสารที่ 2: หนังสือแจ้งความประสงค์เรื่องการรับรู้ข้อมูลเกี่ยวกับการขอกำหนดตำแหน่งทางวิชาการ</h3>
            <div class="alert alert-info"><i class="fas fa-info-circle"></i> เอกสารนี้กรอกโดย <strong>ผู้ยื่นคำร้อง</strong> — แอดมินสามารถดูและแก้ไขได้</div>

            <form th:action="'/admin/position/request/' + ${request.id} + '/document/2'" method="post" id="doc2Form" th:attr="data-auto-draft='/api/draft/position/' + ${request.id} + '/2'">
                <div class="card card-academic mb-4">
                    <div class="card-header bg-white"><h5 class="mb-0">ข้อมูลผู้เสนอขอ</h5></div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">คำนำหน้า <span class="text-danger">*</span></label>
                                <select name="title" class="form-select" required>
                                    <option value="">-- เลือก --</option>
                                    <option value="นาย">นาย</option>
                                    <option value="นาง">นาง</option>
                                    <option value="นางสาว">นางสาว</option>
                                    <option value="ผศ.ดร.">ผศ.ดร.</option>
                                    <option value="รศ.ดร.">รศ.ดร.</option>
                                    <option value="ศ.ดร.">ศ.ดร.</option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">ชื่อ-นามสกุล <span class="text-danger">*</span></label>
                                <input type="text" name="applicant_name" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">สถานะ</label>
                                <select name="status" class="form-select">
                                    <option value="ข้าราชการ">ข้าราชการ</option>
                                    <option value="พนักงานมหาวิทยาลัย" selected>พนักงานมหาวิทยาลัย</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ตำแหน่งปัจจุบัน</label>
                                <input type="text" name="current_position" class="form-control" placeholder="เช่น อาจารย์">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ตำแหน่งที่เสนอขอ <span class="text-danger">*</span></label>
                                <select name="request_position" class="form-select" required>
                                    <option value="">-- เลือก --</option>
                                    <option value="ผู้ช่วยศาสตราจารย์">ผู้ช่วยศาสตราจารย์</option>
                                    <option value="รองศาสตราจารย์">รองศาสตราจารย์</option>
                                    <option value="ศาสตราจารย์">ศาสตราจารย์</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">สาขาวิชา</label>
                                <input type="text" name="major" class="form-control" placeholder="เช่น วิทยาการคอมพิวเตอร์">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card card-academic mb-4">
                    <div class="card-header bg-white"><h5 class="mb-0">ความประสงค์เรื่องการรับรู้ข้อมูล</h5></div>
                    <div class="card-body">
                        <input type="hidden" name="not_wish_to_know_committee_names" id="notWish" value="☐">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="wish_to_know_committee_names"
                                value="☑" id="intent1" data-set-value-target="#notWish" data-set-value="☐">
                            <label class="form-check-label" for="intent1">
                                ประสงค์จะทราบรายชื่อกรรมการประเมินผลงานทางวิชาการ
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="wish_to_know_committee_names"
                                value="☐" id="intent2" data-set-value-target="#notWish" data-set-value="☑">
                            <label class="form-check-label" for="intent2">
                                ไม่ประสงค์จะทราบรายชื่อกรรมการประเมินผลงานทางวิชาการ ไม่ว่ากรณีใด ๆ
                            </label>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-academic btn-lg">
                        <i class="fas fa-save"></i> บันทึกและสร้างเอกสาร
                    </button>
                    <button type="button" class="btn btn-outline-primary" data-action="docPreviewShow">
                        <i class="fas fa-eye"></i> ดูตัวอย่างเอกสาร
                    </button>
                    <a th:href="'/admin/position/request/' + ${request.id}" class="btn btn-outline-secondary btn-lg">
                        <i class="fas fa-arrow-left"></i> กลับ
                    </a>
                </div>
            </form>
        </div>

        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
                const existingData = /*[[${existingData}]]*/ null;
                if (existingData) {
                    try {
                        const data = JSON.parse(existingData);
                        for (const [key, value] of Object.entries(data)) {
                            const el = document.querySelector(`[name="${key}"]`);
                            if (el) {
                                if (el.type === 'radio') {
                                    const radio = document.querySelector(`[name="${key}"][value="${value}"]`);
                                    if (radio) radio.checked = true;
                                } else {
                                    el.value = value;
                                }
                            }
                        }
                    } catch(e) {}
                }
            });
        </script>

        <link rel="stylesheet" href="/css/doc_preview.css">
        <script src="/js/doc_preview.js"></script>
        <script>initDocPreview('doc2Form', 2, '/api/position/preview');</script>
    </section>
</body>
</html>
