<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic :: layout(~{::section})}">
<body>
    <section>
        <div class="container py-4">
            <div th:if="${param.saved != null}" class="alert alert-success alert-dismissible fade show">
                <i class="fas fa-save"></i> บันทึกแบบร่างสำเร็จ
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <h3 class="mb-4"><i class="fas fa-file-alt"></i> เอกสารที่ 6: บันทึกข้อความจริยธรรมการวิจัยในมนุษย์ (Exemption)</h3>
            <div class="alert alert-info"><i class="fas fa-info-circle"></i> เอกสารนี้กรอกโดย <strong>ผู้ยื่นคำร้อง</strong> — แอดมินสามารถดูและแก้ไขได้</div>

            <form th:action="'/admin/position/request/' + ${request.id} + '/document/6'" method="post" id="doc6Form" th:attr="data-auto-draft='/api/draft/position/' + ${request.id} + '/6'"
                  onsubmit="document.querySelectorAll('#doc6Form input[type=checkbox]').forEach(c=>{if(!c.checked){let h=document.createElement('input');h.type='hidden';h.name=c.name;h.value='☐';c.parentNode.appendChild(h);}})">

                <!-- หัวบันทึก -->
                <div class="card card-academic mb-4">
                    <div class="card-header bg-white"><h5 class="mb-0">หัวบันทึกข้อความ</h5></div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">วันที่</label>
                                <input type="text" name="date" class="form-control" placeholder="เช่น ๑๐ มีนาคม พ.ศ. ๒๕๖๙">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ข้อมูลผู้ขอ -->
                <div class="card card-academic mb-4">
                    <div class="card-header bg-white"><h5 class="mb-0">ข้อมูลผู้ขอกำหนดตำแหน่ง</h5></div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">คำนำหน้า</label>
                                <select name="applicant_title" class="form-select">
                                    <option value="">-- เลือก --</option>
                                    <option value="นาย">นาย</option>
                                    <option value="นาง">นาง</option>
                                    <option value="นางสาว">นางสาว</option>
                                    <option value="ผศ.ดร.">ผศ.ดร.</option>
                                    <option value="รศ.ดร.">รศ.ดร.</option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">ชื่อ-นามสกุล <span class="text-danger">*</span></label>
                                <input type="text" name="applicant_name" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">ตำแหน่งปัจจุบัน</label>
                                <input type="text" name="current_position" class="form-control" placeholder="เช่น อาจารย์">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ตำแหน่งที่ขอ</label>
                                <select name="target_position" class="form-select">
                                    <option value="">-- เลือก --</option>
                                    <option value="ผู้ช่วยศาสตราจารย์">ผู้ช่วยศาสตราจารย์</option>
                                    <option value="รองศาสตราจารย์">รองศาสตราจารย์</option>
                                    <option value="ศาสตราจารย์">ศาสตราจารย์</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">จำนวนงานวิจัย</label>
                                <input type="number" name="research_count" class="form-control" min="1" max="5" value="1">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ตารางผลงานวิจัย (เพิ่มได้ไม่จำกัด) -->
                <div class="card card-academic mb-4">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">รายการผลงานวิจัย</h5>
                        <button type="button" class="btn btn-success btn-sm" id="btnAddResearch">
                            <i class="fas fa-plus-circle"></i> เพิ่มรายการ
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered align-middle" id="researchTable">
                                <thead class="table-light">
                                    <tr>
                                        <th style="width:5%">#</th>
                                        <th style="width:28%">ผลงาน</th>
                                        <th style="width:27%">สถานะผู้ขอในผลงาน</th>
                                        <th style="width:13%">Impact Factor</th>
                                        <th style="width:15%">ฐานข้อมูล</th>
                                        <th style="width:5%"></th>
                                    </tr>
                                </thead>
                                <tbody id="researchBody">
                                    <!-- rows จะถูกสร้างจาก JS -->
                                </tbody>
                            </table>
                        </div>
                        <input type="hidden" name="research_count" id="researchCountField" value="1">
                    </div>
                </div>

                <!-- ลงชื่อ -->
                <div class="card card-academic mb-4">
                    <div class="card-header bg-white"><h5 class="mb-0">ผู้ลงนาม</h5></div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">ชื่อผู้ขอกำหนดตำแหน่ง (ลงนาม)</label>
                                <input type="text" name="applicant_signature_name" class="form-control"
                                       placeholder="เช่น ผศ.ดร.สมชาย ใจดี">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ชื่อหัวหน้าส่วนงาน</label>
                                <select name="dean_signature_name" class="form-select">
                                    <option value="">-- เลือก --</option>
                                    <option th:each="dean : ${deans}" th:value="${dean.fullName}" th:text="${dean.fullName}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ตำแหน่ง</label>
                                <input type="text" name="position_title" class="form-control" placeholder="เช่น คณบดีวิทยาลัยการคอมพิวเตอร์">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" name="action" value="submit" class="btn btn-academic btn-lg">
                        <i class="fas fa-save"></i> บันทึก
                    </button>
                    <button type="button" class="btn btn-outline-primary" onclick="docPreview.show()">
                        <i class="fas fa-eye"></i> ดูตัวอย่างเอกสาร
                    </button>
                    <a th:href="'/admin/position/request/' + ${request.id}" class="btn btn-outline-secondary btn-lg">
                        <i class="fas fa-arrow-left"></i> กลับ
                    </a>
                </div>
            </form>
        </div>

        <script th:inline="javascript">
            // ==================== Dynamic Research Rows ====================
            let researchRowCount = 0;

            function createResearchRow(idx) {
                const tr = document.createElement('tr');
                tr.setAttribute('data-row-idx', idx);
                tr.innerHTML = `
                    <td class="text-center fw-bold row-number">${idx}</td>
                    <td>
                        <input type="text" name="des_research${idx}" class="form-control form-control-sm" placeholder="ชื่อผลงานวิจัย">
                    </td>
                    <td>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="chk_firstauthor${idx}" value="☑">
                            <label class="form-check-label" style="font-size:0.85em">ผู้ประพันธ์อันดับแรก (First author)</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="chk_Corres${idx}" value="☑">
                            <label class="form-check-label" style="font-size:0.85em">ผู้ประพันธ์บรรณกิจ (Corresponding author)</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="essen${idx}" value="☑">
                            <label class="form-check-label" style="font-size:0.85em">ผู้มีส่วนสำคัญทางปัญญา (Essentially intellectual contributor)</label>
                        </div>
                    </td>
                    <td>
                        <input type="text" name="impactfacttor${idx}" class="form-control form-control-sm">
                    </td>
                    <td>
                        <input type="text" name="data${idx}" class="form-control form-control-sm" placeholder="เช่น Scopus">
                    </td>
                    <td class="text-center">
                        <button type="button" class="btn btn-outline-danger btn-sm btn-remove-row" title="ลบรายการ">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                `;
                tr.querySelector('.btn-remove-row').addEventListener('click', function() {
                    tr.remove();
                    renumberRows();
                });
                return tr;
            }

            function addResearchRow() {
                researchRowCount++;
                const tbody = document.getElementById('researchBody');
                tbody.appendChild(createResearchRow(researchRowCount));
                document.getElementById('researchCountField').value = researchRowCount;
            }

            function renumberRows() {
                const rows = document.querySelectorAll('#researchBody tr');
                researchRowCount = rows.length;
                rows.forEach((tr, i) => {
                    const num = i + 1;
                    tr.setAttribute('data-row-idx', num);
                    tr.querySelector('.row-number').textContent = num;
                    tr.querySelectorAll('input').forEach(input => {
                        input.name = input.name.replace(/\d+$/, num);
                    });
                });
                document.getElementById('researchCountField').value = researchRowCount;
            }

            document.addEventListener('DOMContentLoaded', function() {
                document.getElementById('btnAddResearch').addEventListener('click', addResearchRow);

                const existingData = /*[[${existingData}]]*/ null;
                if (existingData) {
                    try {
                        const data = JSON.parse(existingData);
                        let maxRow = 0;
                        for (const key of Object.keys(data)) {
                            const match = key.match(/^des_research(\d+)$/);
                            if (match) maxRow = Math.max(maxRow, parseInt(match[1]));
                        }
                        const rowsNeeded = Math.max(maxRow, parseInt(data.research_count || '1'));
                        for (let i = 0; i < rowsNeeded; i++) addResearchRow();

                        for (const [key, value] of Object.entries(data)) {
                            const el = document.querySelector(`[name="${key}"]`);
                            if (el) {
                                if (el.type === 'checkbox') { el.checked = (value === '☑'); }
                                else { el.value = value; }
                            }
                        }
                    } catch(e) { addResearchRow(); }
                } else {
                    addResearchRow();
                }
            });
        </script>

        <link rel="stylesheet" href="/css/doc_preview.css">
        <script src="/js/doc_preview.js"></script>
        <script>initDocPreview('doc6Form', 6, '/api/position/preview');</script>
    </section>
</body>
</html>
