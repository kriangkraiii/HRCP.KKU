<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* ช่องแจ้งเตือนผู้ยื่น — วางไว้เหนือปุ่มบันทึก เพราะมันคือสิ่งที่ต้องตัดสินใจก่อนกด */-->
<th:block th:fragment="notifyCheckbox"
          th:replace="~{academic/_notify_applicant :: checkbox}"></th:block>

<!-- ==================== Shared Buttons ==================== -->
<!--/* ล็อกปุ่มบันทึกเฉพาะตอนที่ยังเวียนลงนามอยู่ — เซิร์ฟเวอร์ปฏิเสธอยู่แล้ว
     แต่ปุ่มที่กดไม่ได้อธิบายเหตุผลได้ดีกว่าปุ่มที่กดแล้วเด้งกลับ

     เมื่อลงนามครบแล้วปุ่มต้องกลับมากดได้ เพราะยังเหลือให้สารบรรณลงเลขที่หนังสือ
     กับวันที่เอกสาร (DocumentFieldOwnership.officeFields) */-->
<div th:fragment="buttons" class="d-flex flex-wrap gap-2 mt-4"
     th:with="signingLocked=${lockedForSigning != null && lockedForSigning && !(signingComplete != null && signingComplete)}">
    <button type="button" class="btn btn-outline-primary" data-action="docPreviewShow">
        <i class="fas fa-eye"></i> ดูตัวอย่างเอกสาร
    </button>
    <!--/* ปุ่มรอง: ปุ่มหลักของหน้าคือปุ่มส่งเวียนลงนามในแผงด้านล่าง ซึ่งบันทึกให้ก่อนส่งอยู่แล้ว
         สองปุ่มสีเดียวกันทำให้ผู้ใช้เดาไม่ออกว่าต้องกดอันไหนก่อน */-->
    <button type="button" id="btnSubmitDoc" class="btn btn-outline-secondary"
            th:disabled="${signingLocked}"
            th:title="${signingLocked} ? 'เอกสารถูกล็อกระหว่างการเวียนลงนาม' : 'เก็บไว้แก้ต่อทีหลัง ยังไม่ส่งเวียน'">
        <i class="fas fa-save"></i> บันทึกไว้ก่อน (ยังไม่ส่งเวียน)
    </button>
    <a th:href="'/admin/academic/request/' + ${request.id}" class="btn-back-pill">
        <i class="fas fa-arrow-left"></i> กลับ
    </a>
</div>

<!-- ==================== แผงลงนามอิเล็กทรอนิกส์ ==================== -->
<div th:fragment="signaturePanel">
    <!-- ข้อความ "บันทึกไม่สำเร็จเพราะเอกสารถูกล็อก" ย้ายไปอยู่ใน _admin_field_lock :: banner
         ที่เดียว เพื่อให้เฟส 2 ซึ่งไม่มี fragment ร่วมชุดนี้ได้ข้อความเดียวกันไปด้วย -->
    <div th:replace="~{academic/esign/_signature_panel :: panel}"></div>
</div>

<!-- ==================== Shared Scripts ==================== -->
<th:block th:fragment="scripts">
    <script>
        // ==================== ส่งฟอร์มบันทึกเอกสาร ====================
        // กล่องยืนยันถูกแทนด้วย checkbox ข้างปุ่มบันทึก — ดู _notify_applicant.html
        (function() {
            const submitBtn = document.getElementById('btnSubmitDoc');

            if (submitBtn) {
                submitBtn.addEventListener('click', function() {
                    const form = document.getElementById('docForm');
                    if (form && !form.reportValidity()) return;
                    submitFormAsSubmit();
                });
            }

            function submitFormAsSubmit() {
                const form = document.getElementById('docForm');
                if (!form) return;
                if (window.setButtonLoading && submitBtn) {
                    window.setButtonLoading(submitBtn, 'กำลังบันทึกเอกสาร...');
                }
                let actionInput = form.querySelector('input[name="action"][type="hidden"]');
                if (!actionInput) {
                    actionInput = document.createElement('input');
                    actionInput.type = 'hidden';
                    actionInput.name = 'action';
                    form.appendChild(actionInput);
                }
                actionInput.value = 'submit';
                form.submit();
            }

            // ==================== Disable submit button เมื่อ required fields ยังไม่ครบ ====================
            function updateSubmitBtnState() {
                if (!submitBtn) return;
                const form = document.getElementById('docForm');
                if (!form) return;

                // ข้ามช่องที่ถูกปิด — เอกสารของผู้ยื่นจะมีช่อง required ที่แอดมินแก้ไม่ได้
                // ถ้านับรวมด้วย ปุ่มบันทึกจะค้างอยู่ตลอดและกรอกเลขที่หนังสือไม่ได้เลย
                const requiredFields = form.querySelectorAll('[required]:not(:disabled)');
                let allFilled = true;
                requiredFields.forEach(function(el) {
                    if (el.type === 'radio') {
                        // Radio: ต้องมีอย่างน้อย 1 ใน group ที่ checked
                        const radios = form.querySelectorAll('input[type="radio"][name="' + el.name + '"]');
                        const anyChecked = Array.from(radios).some(r => r.checked);
                        if (!anyChecked) allFilled = false;
                    } else if (el.tagName === 'SELECT') {
                        if (!el.value) allFilled = false;
                    } else {
                        if (!el.value || !el.value.trim()) allFilled = false;
                    }
                });

                if (allFilled) {
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                    submitBtn.title = '';
                } else {
                    submitBtn.disabled = true;
                    submitBtn.style.opacity = '0.5';
                    submitBtn.title = 'กรุณากรอกข้อมูลที่จำเป็นให้ครบก่อนบันทึก';
                }
            }

            // ตรวจสอบทุกครั้งที่ input เปลี่ยนค่า — เรียกทันที (script อยู่ท้ายหน้า DOM พร้อมแล้ว)
            (function initSubmitBtnWatch() {
                const form = document.getElementById('docForm');
                if (form) {
                    form.addEventListener('input', updateSubmitBtnState);
                    form.addEventListener('change', updateSubmitBtnState);
                    // ตรวจครั้งแรก
                    updateSubmitBtnState();
                }
            })();
        })();

        // ==================== ติ๊กได้แค่อันเดียว (chk1, chk2, chk3) ====================
        document.querySelectorAll('.chk-position').forEach(cb => {
            cb.addEventListener('change', function () {
                if (this.checked) {
                    document.querySelectorAll('.chk-position').forEach(other => {
                        if (other !== this) other.checked = false;
                    });
                }
            });
        });

        // ==================== Thai Date Defaults ====================
        (function () {
            const thaiMonths = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
            const now = new Date();
            const thaiDay = now.getDate().toString();
            const thaiMonth = thaiMonths[now.getMonth()];
            const thaiYear = (now.getFullYear() + 543).toString();
            const thaiFullDate = thaiDay + ' ' + thaiMonth + ' ' + thaiYear;

            document.querySelectorAll('.thai-day').forEach(el => {
                if (!el.value) el.value = thaiDay;
            });
            document.querySelectorAll('.thai-month').forEach(el => {
                if (!el.value) el.value = thaiMonth;
            });
            document.querySelectorAll('.thai-year').forEach(el => {
                if (!el.value) el.value = thaiYear;
                el.setAttribute('inputmode', 'numeric');
                el.setAttribute('pattern', '[0-9]*');
                el.addEventListener('input', function () {
                    this.value = this.value.replace(/[^0-9]/g, '');
                });
            });
            document.querySelectorAll('.thai-full-date').forEach(el => {
                if (!el.value) el.value = thaiFullDate;
            });

            document.querySelectorAll('.thai-day').forEach(el => {
                el.setAttribute('inputmode', 'numeric');
                el.setAttribute('pattern', '[0-9]*');
                el.addEventListener('input', function () {
                    this.value = this.value.replace(/[^0-9]/g, '');
                });
            });

            // ==================== Thai Date Picker ====================
            function toThaiDate(dateStr) {
                const d = new Date(dateStr);
                if (isNaN(d)) return '';
                const day = d.getDate();
                const month = thaiMonths[d.getMonth()];
                const year = d.getFullYear() + 543;
                return day + ' ' + month + ' ' + year;
            }

            document.querySelectorAll('.thai-date-btn').forEach(btn => {
                const group = btn.closest('.input-group');
                const picker = group.querySelector('.thai-date-picker');
                btn.addEventListener('click', () => picker.showPicker());
            });

            document.querySelectorAll('.thai-date-picker').forEach(picker => {
                picker.addEventListener('change', function () {
                    const group = this.closest('.input-group');
                    const textInput = group ? group.querySelector('.thai-full-date') : null;
                    if (this.value && textInput) {
                        textInput.value = toThaiDate(this.value);
                    }
                    if (typeof window.dismissDatePicker === 'function') {
                        window.dismissDatePicker(this);
                    } else {
                        this.blur();
                        if (textInput) textInput.focus();
                    }
                });
            });
        })();

        // ==================== Auto-calculate weighted scores for Document 6 ====================
        const sectionWeights = { 1: 20, 2: 30, 3: 30, 4: 20 };
        const rangeLabels = ['', 'ช่วง ๑ (0-1)', 'ช่วง ๒ (1.01-2)', 'ช่วง ๓ (2.01-3)', 'ช่วง ๔ (3.01-4)', 'ช่วง ๕ (4.01-5)'];

        function getScoreRange(score) {
            if (score <= 0) return 0;
            if (score <= 1) return 1;
            if (score <= 2) return 2;
            if (score <= 3) return 3;
            if (score <= 4) return 4;
            return 5;
        }

        function calculateDoc6Scores() {
            let grandTotal = 0;
            let hasSomeScore = false;

            for (let sec = 1; sec <= 4; sec++) {
                const input = document.querySelector('.sec-score-single[data-section="' + sec + '"]');
                if (!input) continue;

                const score = parseFloat(input.value) || 0;
                if (score > 0) hasSomeScore = true;

                const rangeEl = document.getElementById('rangeDisplay' + sec);
                const rangeIdx = getScoreRange(score);
                if (rangeEl) rangeEl.value = rangeIdx > 0 ? rangeLabels[rangeIdx] : '-';

                const weight = sectionWeights[sec];
                const weighted = (score / 5) * weight;
                const totalEl = document.getElementById('totalScore' + sec);
                if (totalEl) totalEl.value = weighted.toFixed(2);

                grandTotal += weighted;
            }

            const grandEl = document.getElementById('grandTotal');
            if (grandEl) grandEl.value = grandTotal.toFixed(2);

            updateEvalCheckboxes(grandTotal, hasSomeScore);
        }

        function updateEvalCheckboxes(total, hasSomeScore) {
            const chk1 = document.getElementById('chk1');
            const chk2 = document.getElementById('chk2');
            const chk3 = document.getElementById('chk3');
            const chk4 = document.getElementById('chk4');
            const ch1Val = document.getElementById('ch1_val');
            const ch2Val = document.getElementById('ch2_val');
            const ch3Val = document.getElementById('ch3_val');
            const ch4Val = document.getElementById('ch4_val');

            if (!chk1) return;

            [chk1, chk2, chk3, chk4].forEach(c => c.checked = false);
            [ch1Val, ch2Val, ch3Val, ch4Val].forEach(v => v.value = '');

            if (!hasSomeScore) return;

            const roundedTotal = Math.round(total * 100) / 100;

            if (roundedTotal <= 56) {
                chk1.checked = true;
                ch1Val.value = '☑';
            } else if (roundedTotal >= 57 && roundedTotal <= 70) {
                chk2.checked = true;
                ch2Val.value = '☑';
            } else if (roundedTotal >= 71 && roundedTotal <= 85) {
                chk3.checked = true;
                ch3Val.value = '☑';
            } else if (roundedTotal >= 86 && roundedTotal <= 100) {
                chk4.checked = true;
                ch4Val.value = '☑';
            }
        }

        document.querySelectorAll('.sec-score-single').forEach(input => {
            input.addEventListener('input', calculateDoc6Scores);
        });

        // ==================== Checkbox toggle สำหรับ ✔️ ====================
        document.querySelectorAll('.chk-toggle').forEach(cb => {
            cb.addEventListener('change', function () {
                const targetId = this.getAttribute('data-target');
                const hiddenInput = document.getElementById(targetId);
                if (hiddenInput) {
                    hiddenInput.value = this.checked ? '✓' : '';
                }
            });
        });

        // โหลดข้อมูลเดิม (ถ้ามี) สำหรับ checkbox และ doc6 scores
        document.addEventListener('DOMContentLoaded', function () {
            var existingJson = document.getElementById('existingDataHolder') ? document.getElementById('existingDataHolder').value : null;
            var currentDocType = parseInt(document.getElementById('currentDocType').value) || 0;
            if (existingJson) {
                try {
                    var data = JSON.parse(existingJson);
                    var form = document.getElementById('docForm');
                    if (form && data) {
                        Object.keys(data).forEach(function(key) {
                            var el = form.querySelector('[name="' + key + '"]');
                            if (el && !el.value) {
                                el.value = data[key];
                            }
                        });
                        if (currentDocType === 6) {
                            calculateDoc6Scores();
                        }
                    }
                } catch (e) {
                    console.warn('Failed to load existing data:', e);
                }
            }

            // Sync checkboxes AFTER loading existing data into hidden inputs
            document.querySelectorAll('.chk-toggle').forEach(cb => {
                const targetId = cb.getAttribute('data-target');
                const hiddenInput = document.getElementById(targetId);
                if (hiddenInput && hiddenInput.value === '✓') {
                    cb.checked = true;
                }
            });

            // Special case: chk_dean_sign3 has no chk-toggle class, handle manually
            var sign3hidden = document.getElementById('chk_dean_sign3');
            var sign3cb = document.getElementById('chk_dean_sign3_cb');
            if (sign3hidden && sign3cb && sign3hidden.value === '✓') {
                sign3cb.checked = true;
                var wrapper = document.getElementById('dean_comment_wrapper');
                if (wrapper) wrapper.style.display = 'block';
            }

            initDocPreview('docForm', currentDocType);
        });
    </script>
    <th:block th:replace="~{academic/_admin_field_lock :: script('docForm')}"></th:block>
</th:block>

</body>
</html>
