<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic :: layout(~{::section})}">

<body>
    <section>
        <div class="container py-4">
            <div class="mb-3">
                <a th:href="'/admin/academic/request/' + ${request.id}" class="btn-back-pill">
                    <i class="fas fa-arrow-left"></i> กลับ
                </a>
            </div>
            <div class="card card-academic">
                <div class="card-header bg-white">
                    <h4 class="mb-0"><i class="fas fa-file-alt"></i> เอกสารที่ [[${documentType}]]: [[${documentLabel}]]</h4>
                    <small class="text-muted">คำร้อง [[${request.requestCode}]] — ผู้ยื่น: [[${request.applicant.name}]]</small>
                </div>
                <div class="card-body">
                    <form th:action="'/admin/academic/request/' + ${request.id} + '/document/' + ${documentType}"
                        method="post" id="docForm"
                        th:attr="data-auto-draft='/api/draft/academic/' + ${request.id} + '/' + ${documentType}">

                        <h5 class="border-bottom pb-2 mb-3">ข้อมูลคำสั่ง</h5>
                        <div class="row mb-3">
                            <div class="col-md-4"><label class="form-label">เลขที่คำสั่ง</label><input type="text"
                                    name="order_no" class="form-control" placeholder="เช่น. 27"></div>
                            <div class="col-md-4"><label class="form-label">ปีของเลขที่หนังสือ (พ.ศ.)</label><input type="text"
                                    name="year" class="form-control thai-year" placeholder="เช่น. 2567"></div>
                        </div>
                        <h5 class="border-bottom pb-2 mb-3">ข้อมูลผู้ยื่น</h5>
                        <div class="row mb-3">
                            <div class="col-md-3">
                                <label class="form-label">คำนำหน้า</label>
                                <input type="text" name="applicant_title" class="form-control" list="titleList3" placeholder="เลือกหรือพิมพ์..."
                                    th:value="${doc0Data != null ? doc0Data.getOrDefault('title', request.applicant.title) : request.applicant.title}" >
                                <datalist id="titleList3">
                                    <option value="นาย">
                                    <option value="นาง">
                                    <option value="นางสาว">
                                </datalist>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">ชื่อผู้ยื่น</label>
                                <div class="combo-input">
                                    <input type="text" name="applicant_name" class="form-control" list="staffList3" placeholder="เลือกหรือพิมพ์ชื่อ..."
                                        th:value="${doc0Data != null ? doc0Data.getOrDefault('applicant_name', request.applicant.name) : request.applicant.name}" >
                                    <datalist id="staffList3">
                                        <option th:each="s : ${staffMembers}" th:value="${s.displayName}"></option>
                                    </datalist>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ประเภทตำแหน่ง</label>
                                <input type="text" name="employee_type" class="form-control" list="staffTypeList3" placeholder="เลือกหรือพิมพ์..."
                                    th:value="${doc0Data != null ? doc0Data.getOrDefault('employee_type', '') : ''}">
                                <datalist id="staffTypeList3">
                                    <option value="พนักงานมหาวิทยาลัย">
                                    <option value="ข้าราชการ">
                                </datalist>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">ตำแหน่งปัจจุบัน</label>
                                <input type="text" name="current_position" class="form-control" list="posList3" placeholder="เลือกหรือพิมพ์..."
                                    th:value="${doc0Data != null ? doc0Data.getOrDefault('current_position', request.applicant.academicPosition) : request.applicant.academicPosition}">
                                <datalist id="posList3">
                                    <option value="อาจารย์">
                                    <option value="ผู้ช่วยศาสตราจารย์">
                                    <option value="รองศาสตราจารย์">
                                </datalist>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ตำแหน่งที่ขอ</label>
                                <input type="text" name="requested_position" class="form-control" list="posReqList3" placeholder="เลือกหรือพิมพ์..."
                                    th:value="${doc0Data != null ? (doc0Data.getOrDefault('chk1','') == '✓' ? 'ผู้ช่วยศาสตราจารย์' : (doc0Data.getOrDefault('chk2','') == '✓' ? 'รองศาสตราจารย์' : '')) : ''}">
                                <datalist id="posReqList3">
                                    <option value="ผู้ช่วยศาสตราจารย์">
                                    <option value="รองศาสตราจารย์">
                                </datalist>
                            </div>
                        </div>
                        <h5 class="border-bottom pb-2 mb-3">คณะกรรมการ (3 ท่าน)</h5>
                        <div class="row mb-3" th:each="i : ${#numbers.sequence(1, 3)}">
                            <div class="col-md-5">
                                <label class="form-label">กรรมการคนที่ [[${i}]]</label>
                                <div class="combo-input">
                                    <input type="text" th:name="'committee_' + ${i} + '_name'" class="form-control" th:list="'committeeList3_' + ${i}" placeholder="เลือกหรือพิมพ์ชื่อ..."
                                        th:value="${i == 1 ? defaultCommittee1 : (i == 2 ? defaultCommittee2 : defaultCommittee3)}">
                                    <datalist th:id="'committeeList3_' + ${i}">
                                        <option th:each="c : ${committee}" th:value="${c.displayName}"></option>
                                    </datalist>
                                </div>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">ตำแหน่ง</label>
                                <input type="text" th:name="'committee_' + ${i} + '_role'" class="form-control" readonly
                                    th:value="${i == 1 ? 'ประธานอนุกรรมการ' : (i == 3 ? 'อนุกรรมการและเลขานุการ' : 'อนุกรรมการ')} " >
                            </div>
                        </div>
                        <h5 class="border-bottom pb-2 mb-3">วันที่มีผลบังคับใช้</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">วันที่</label>
                                <div class="input-group">
                                    <input type="text" name="effective_date" class="form-control thai-full-date">
                                    <input type="date" class="thai-date-picker">
                                    <button type="button" class="btn btn-outline-secondary thai-date-btn" title="เลือกวันที่"><i class="fas fa-calendar-alt"></i></button>
                                </div>
                            </div>
                        </div>
                        <h5 class="border-bottom pb-2 mb-3">ลงนาม</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">วันที่สั่ง (ลงนาม)</label>
                                <div class="input-group">
                                    <input type="text" name="order_date" class="form-control thai-full-date">
                                    <input type="date" class="thai-date-picker">
                                    <button type="button" class="btn btn-outline-secondary thai-date-btn" title="เลือกวันที่"><i class="fas fa-calendar-alt"></i></button>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">ชื่อคณบดี (ลงนาม)</label>
                                <div class="combo-input">
                                    <input type="text" name="dean_name" class="form-control" list="deanList3" placeholder="เลือกหรือพิมพ์ชื่อ...">
                                    <datalist id="deanList3">
                                        <option th:each="d : ${deans}" th:value="${d.displayName}"></option>
                                    </datalist>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ตำแหน่งคณบดี</label>
                                <input type="text" name="deandropdown_position" class="form-control"
                                    value="คณบดีวิทยาลัยการคอมพิวเตอร์">
                            </div>
                        </div>

                        <div th:if="${param.saved != null}" class="alert alert-success alert-dismissible fade show mt-3">
                            <i class="fas fa-save"></i> บันทึกแบบร่างสำเร็จ
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <th:block th:replace="~{academic/admin/doc_fragments/_common :: buttons}"></th:block>
                    </form>

                        <!-- แผงลงนาม: อยู่นอก <form> ของเอกสาร เพราะมี form ของตัวเอง -->
        <div th:replace="~{academic/admin/doc_fragments/_common :: signaturePanel}"></div>

                </div>
            </div>
        </div>

        <input type="hidden" id="currentDocType" th:value="${documentType}">
        <input type="hidden" id="existingDataHolder" th:if="${existingData != null}" th:value="${existingData}">
        <link rel="stylesheet" href="/css/doc_preview.css">
        <th:block th:replace="~{academic/admin/doc_fragments/_common :: scripts}"></th:block>
        <script>
            // Override order_date picker to use "พ.ศ." format (picker + existing data)
            document.addEventListener('DOMContentLoaded', function () {
                var thaiMonths = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                    'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

                function addPorSor(val) {
                    if (!val || val.indexOf('พ.ศ.') !== -1) return val;
                    // match "6  มีนาคม  2569" or "6 มีนาคม 2569"
                    var m = val.match(/^(\d{1,2})\s+(\S+)\s+(\d{4})$/);
                    if (m) return m[1] + '  ' + m[2] + '  พ.ศ. ' + m[3];
                    return val;
                }

                var orderDateInput = document.querySelector('input[name="order_date"]');
                if (orderDateInput) {
                    // Reformat existing/restored value
                    if (orderDateInput.value) {
                        orderDateInput.value = addPorSor(orderDateInput.value);
                    }
                    // Override picker
                    var picker = orderDateInput.closest('.input-group').querySelector('.thai-date-picker');
                    if (picker) {
                        picker.addEventListener('change', function () {
                            if (this.value) {
                                var d = new Date(this.value);
                                orderDateInput.value = d.getDate() + '  ' + thaiMonths[d.getMonth()] + '  พ.ศ. ' + (d.getFullYear() + 543);
                            }
                        });
                    }
                }
            });
        </script>
    </section>
</body>

</html>
