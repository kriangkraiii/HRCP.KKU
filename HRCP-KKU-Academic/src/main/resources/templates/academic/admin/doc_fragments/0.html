<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic :: layout(~{::section})}">

<body>
    <section>
        <div class="container py-4">
            <div class="card card-academic">
                <div class="card-header bg-white">
                    <h4 class="mb-0"><i class="fas fa-file-alt"></i> เอกสารที่ [[${documentType}]]: [[${documentLabel}]]</h4>
                    <small class="text-muted">คำร้อง [[${request.requestCode}]] — ผู้ยื่น: [[${request.applicant.name}]]</small>
                </div>
                <div class="card-body">
                    <form th:action="'/admin/academic/request/' + ${request.id} + '/document/' + ${documentType}"
                        method="post" id="docForm"
                        th:attr="data-auto-draft='/api/draft/academic/' + ${request.id} + '/' + ${documentType}">

                        <h5 class="border-bottom pb-2 mb-3"><i class="fas fa-file-signature"></i> ข้อมูลบันทึกข้อความ</h5>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">เลขที่หนังสือ <small class="text-muted">(ถ้ามี)</small></label>
                                <input type="text" name="memo_no" class="form-control"
                                    placeholder="เช่น อว 660301.26.8/"
                                    th:value="${doc0Data != null ? doc0Data.getOrDefault('memo_no', '') : ''}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">วันที่เอกสาร</label>
                                <div class="input-group">
                                    <input type="text" name="date" class="form-control thai-full-date"
                                        th:value="${doc0Data != null ? doc0Data.getOrDefault('date', '') : ''}"
                                        placeholder="เช่น 17 กุมภาพันธ์ 2569" required>
                                    <input type="date" class="thai-date-picker">
                                    <button type="button" class="btn btn-outline-secondary thai-date-btn" title="เลือกวันที่">
                                        <i class="fas fa-calendar-alt"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <h5 class="border-bottom pb-2 mb-3 mt-4"><i class="fas fa-user"></i> ข้อมูลผู้ขอรับการประเมิน</h5>
                        <div class="row mb-3">
                            <div class="col-md-3">
                                <label class="form-label">คำนำหน้า</label>
                                <select name="title" class="form-select" id="titleSelect" required>
                                    <option value="">-- เลือก --</option>
                                    <option value="นาย"     th:selected="${(doc0Data != null ? doc0Data.getOrDefault('title', '') : request.applicant.title) == 'นาย'}">นาย</option>
                                    <option value="นาง"     th:selected="${(doc0Data != null ? doc0Data.getOrDefault('title', '') : request.applicant.title) == 'นาง'}">นาง</option>
                                    <option value="นางสาว" th:selected="${(doc0Data != null ? doc0Data.getOrDefault('title', '') : request.applicant.title) == 'นางสาว'}">นางสาว</option>
                                    <option value="ผู้ช่วยศาสตราจารย์" th:selected="${doc0Data != null && doc0Data.getOrDefault('title', '') == 'ผู้ช่วยศาสตราจารย์'}">ผู้ช่วยศาสตราจารย์</option>
                                    <option value="รองศาสตราจารย์" th:selected="${doc0Data != null && doc0Data.getOrDefault('title', '') == 'รองศาสตราจารย์'}">รองศาสตราจารย์</option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">ชื่อ-นามสกุล</label>
                                <input type="text" name="applicant_name" class="form-control"
                                    th:value="${doc0Data != null ? doc0Data.getOrDefault('applicant_name', request.applicant.name) : request.applicant.name}"
                                    required placeholder="เช่น สมชาย ใจดี">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">ประเภทบุคลากร</label>
                                <div class="d-flex gap-4 mt-1">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="employee_type"
                                            id="empType1" value="พนักงานมหาวิทยาลัย" required
                                            th:checked="${doc0Data != null && doc0Data.getOrDefault('employee_type', '') == 'พนักงานมหาวิทยาลัย'}">
                                        <label class="form-check-label" for="empType1">พนักงานมหาวิทยาลัย</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="employee_type"
                                            id="empType2" value="ข้าราชการ"
                                            th:checked="${doc0Data != null && doc0Data.getOrDefault('employee_type', '') == 'ข้าราชการ'}">
                                        <label class="form-check-label" for="empType2">ข้าราชการ</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">ตำแหน่งทางวิชาการปัจจุบัน</label>
                                <select name="current_position" class="form-select" required>
                                    <option value="">-- เลือก --</option>
                                    <option value="อาจารย์" th:selected="${doc0Data != null && doc0Data.getOrDefault('current_position', '') == 'อาจารย์'}">อาจารย์</option>
                                    <option value="ผู้ช่วยศาสตราจารย์" th:selected="${doc0Data != null && doc0Data.getOrDefault('current_position', '') == 'ผู้ช่วยศาสตราจารย์'}">ผู้ช่วยศาสตราจารย์</option>
                                    <option value="รองศาสตราจารย์" th:selected="${doc0Data != null && doc0Data.getOrDefault('current_position', '') == 'รองศาสตราจารย์'}">รองศาสตราจารย์</option>
                                </select>
                            </div>
                        </div>

                        <h5 class="border-bottom pb-2 mb-3 mt-4"><i class="fas fa-graduation-cap"></i> ขอรับการประเมินผลการสอนเพื่อขอกำหนดตำแหน่ง</h5>
                        <div class="row mb-3">
                            <div class="col-md-12">
                                <div class="d-flex gap-4">
                                    <div class="form-check">
                                        <input class="form-check-input chk-position" type="checkbox" name="chk1" id="chk1" value="✓"
                                            th:checked="${doc0Data != null && doc0Data.getOrDefault('chk1', '') == '✓'}">
                                        <label class="form-check-label" for="chk1">ผู้ช่วยศาสตราจารย์ (ผศ.)</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input chk-position" type="checkbox" name="chk2" id="chk2" value="✓"
                                            th:checked="${doc0Data != null && doc0Data.getOrDefault('chk2', '') == '✓'}">
                                        <label class="form-check-label" for="chk2">รองศาสตราจารย์ (รศ.)</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <h5 class="border-bottom pb-2 mb-3 mt-4"><i class="fas fa-book"></i> ข้อมูลรายวิชา</h5>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">รหัสวิชา</label>
                                <input type="text" name="course_code" class="form-control"
                                    th:value="${doc0Data != null ? doc0Data.getOrDefault('course_code', '') : ''}"
                                    placeholder="เช่น CP 123 456">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">รายวิชา</label>
                                <input type="text" name="course_name" class="form-control"
                                    th:value="${doc0Data != null ? doc0Data.getOrDefault('course_name', '') : ''}"
                                    placeholder="เช่น Introduction to Computer Science">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">ปีการศึกษา</label>
                                <input type="text" name="academic_year" class="form-control"
                                    th:value="${doc0Data != null ? doc0Data.getOrDefault('academic_year', '') : ''}"
                                    placeholder="เช่น 2568">
                            </div>
                        </div>
                        <div th:if="${param.saved != null}" class="alert alert-success alert-dismissible fade show mt-3">
                            <i class="fas fa-save"></i> บันทึกแบบร่างสำเร็จ
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <th:block th:replace="~{academic/admin/doc_fragments/_common :: buttons}"></th:block>
                    </form>
                </div>
            </div>
        </div>

        <input type="hidden" id="currentDocType" th:value="${documentType}">
        <input type="hidden" id="existingDataHolder" th:if="${existingData != null}" th:value="${existingData}">
        <link rel="stylesheet" href="/css/doc_preview.css">
        <script src="/js/doc_preview.js"></script>
        <th:block th:replace="~{academic/admin/doc_fragments/_common :: scripts}"></th:block>
    </section>
</body>

</html>
