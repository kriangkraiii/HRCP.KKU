<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic :: layout(~{::section})}">

<body>
    <section>
        <div class="container py-4">
            <div class="mb-3">
                <a th:href="'/admin/academic/request/' + ${request.id}" class="btn-back-pill">
                    <i class="fas fa-arrow-left"></i> กลับ
                </a>
            </div>
            <div class="card card-academic">
                <div class="card-header bg-white">
                    <h4 class="mb-0"><i class="fas fa-file-alt"></i> เอกสารที่ [[${documentType}]]: [[${documentLabel}]]</h4>
                    <small class="text-muted">คำร้อง [[${request.requestCode}]] — ผู้ยื่น: [[${request.applicant.name}]]</small>
                </div>
                <div class="card-body">
                    <form th:action="'/admin/academic/request/' + ${request.id} + '/document/' + ${documentType}"
                        method="post" id="docForm"
                        th:attr="data-auto-draft='/api/draft/academic/' + ${request.id} + '/' + ${documentType}">

                        <h5 class="border-bottom pb-2 mb-3"><i class="fas fa-file-signature"></i> ข้อมูลบันทึกข้อความ</h5>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">เลขที่หนังสือ <small class="text-muted">(ถ้ามี)</small></label>
                                <input type="text" name="memo_no" class="form-control"
                                    placeholder="กรอกเลขที่หนังสือ (ถ้ามี)"
                                    th:value="${doc1Data != null and !#strings.isEmpty(doc1Data['memo_no']) ? doc1Data['memo_no'] : 'อว 660301.26.8/'}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">วันที่เอกสาร</label>
                                <div class="input-group">
                                    <input type="text" name="date" class="form-control thai-full-date"
                                        th:value="${doc1Data != null ? doc1Data.getOrDefault('date', '') : ''}"
                                        placeholder="เช่น 17 กุมภาพันธ์ 2569" required>
                                    <input type="date" class="thai-date-picker">
                                    <button type="button" class="btn btn-outline-secondary thai-date-btn" title="เลือกวันที่">
                                        <i class="fas fa-calendar-alt"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <h5 class="border-bottom pb-2 mb-3 mt-4"><i class="fas fa-user"></i> ข้อมูลผู้ขอรับการประเมิน</h5>
                        <div class="row mb-3">
                            <div class="col-md-3">
                                <label class="form-label">คำนำหน้า</label>
                                <select name="title" class="form-select" id="titleSelect" required>
                                    <option value="">-- เลือก --</option>
                                    <option value="นาย" th:selected="${(doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'นาย'}">นาย</option>
                                    <option value="นาง" th:selected="${(doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'นาง'}">นาง</option>
                                    <option value="นางสาว" th:selected="${(doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'นางสาว'}">นางสาว</option>
                                    <option value="ดร." th:selected="${(doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'ดร.'}">ดร.</option>
                                    <option value="อาจารย์" th:selected="${(doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'อาจารย์' or (doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'อ.'}">อาจารย์</option>
                                    <option value="อ.ดร." th:selected="${(doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'อ.ดร.' or (doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'อาจารย์ ดร.'}">อาจารย์ ดร.</option>
                                    <option value="ผู้ช่วยศาสตราจารย์" th:selected="${(doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'ผู้ช่วยศาสตราจารย์' or (doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'ผศ.'}">ผู้ช่วยศาสตราจารย์</option>
                                    <option value="ผศ.ดร." th:selected="${(doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'ผศ.ดร.' or (doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'ผู้ช่วยศาสตราจารย์ ดร.' or (doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'ผู้ช่วยศาสตราจารย์ดร.'}">ผู้ช่วยศาสตราจารย์ ดร.</option>
                                    <option value="รองศาสตราจารย์" th:selected="${(doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'รองศาสตราจารย์' or (doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'รศ.'}">รองศาสตราจารย์</option>
                                    <option value="รศ.ดร." th:selected="${(doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'รศ.ดร.' or (doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'รองศาสตราจารย์ ดร.' or (doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'รองศาสตราจารย์ดร.'}">รองศาสตราจารย์ ดร.</option>
                                    <option value="ศาสตราจารย์" th:selected="${(doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'ศาสตราจารย์' or (doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'ศ.'}">ศาสตราจารย์</option>
                                    <option value="ศ.ดร." th:selected="${(doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'ศ.ดร.' or (doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'ศาสตราจารย์ ดร.' or (doc1Data != null ? doc1Data.getOrDefault('title', request.applicant.title) : request.applicant.title) == 'ศาสตราจารย์ดร.'}">ศาสตราจารย์ ดร.</option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">ชื่อ-นามสกุล</label>
                                <input type="text" name="applicant_name" class="form-control"
                                    th:value="${doc1Data != null ? doc1Data.getOrDefault('applicant_name', request.applicant.name) : request.applicant.name}"
                                    required placeholder="เช่น สมชาย ใจดี">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">ประเภทบุคลากร</label>
                                <div class="d-flex gap-4 mt-1">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="employee_type"
                                            id="empType1" value="พนักงานมหาวิทยาลัย" required
                                            th:checked="${doc1Data != null && doc1Data.getOrDefault('employee_type', '') == 'พนักงานมหาวิทยาลัย'}">
                                        <label class="form-check-label" for="empType1">พนักงานมหาวิทยาลัย</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="employee_type"
                                            id="empType2" value="ข้าราชการ"
                                            th:checked="${doc1Data != null && doc1Data.getOrDefault('employee_type', '') == 'ข้าราชการ'}">
                                        <label class="form-check-label" for="empType2">ข้าราชการ</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">ตำแหน่งทางวิชาการปัจจุบัน</label>
                                <select name="current_position" class="form-select" required>
                                    <option value="">-- เลือก --</option>
                                    <option value="อาจารย์" th:selected="${doc1Data != null && doc1Data.getOrDefault('current_position', '') == 'อาจารย์'}">อาจารย์</option>
                                    <option value="ผู้ช่วยศาสตราจารย์" th:selected="${doc1Data != null && doc1Data.getOrDefault('current_position', '') == 'ผู้ช่วยศาสตราจารย์'}">ผู้ช่วยศาสตราจารย์</option>
                                    <option value="รองศาสตราจารย์" th:selected="${doc1Data != null && doc1Data.getOrDefault('current_position', '') == 'รองศาสตราจารย์'}">รองศาสตราจารย์</option>
                                </select>
                            </div>
                        </div>

                        <h5 class="border-bottom pb-2 mb-3 mt-4">
                            <i class="fas fa-graduation-cap"></i> ขอรับการประเมินผลการสอนเพื่อขอกำหนดตำแหน่ง <span class="text-danger">*</span>
                        </h5>
                        <div class="row mb-3">
                            <div class="col-md-12">
                                <div class="d-flex gap-4">
                                    <div class="form-check">
                                        <input class="form-check-input target-pos-radio" type="radio" name="target_position_choice" id="targetPos1"
                                            value="chk1"
                                            th:checked="${doc1Data != null && doc1Data.getOrDefault('chk1', '') == '✓'}" required>
                                        <label class="form-check-label fw-semibold" for="targetPos1">ผู้ช่วยศาสตราจารย์</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input target-pos-radio" type="radio" name="target_position_choice" id="targetPos2"
                                            value="chk2"
                                            th:checked="${doc1Data != null && doc1Data.getOrDefault('chk2', '') == '✓'}" required>
                                        <label class="form-check-label fw-semibold" for="targetPos2">รองศาสตราจารย์</label>
                                    </div>
                                </div>
                                <!-- Hidden inputs for backend binding -->
                                <input type="hidden" name="chk1" id="chk1"
                                    th:value="${doc1Data != null ? doc1Data.getOrDefault('chk1', '') : ''}">
                                <input type="hidden" name="chk2" id="chk2"
                                    th:value="${doc1Data != null ? doc1Data.getOrDefault('chk2', '') : ''}">
                            </div>
                        </div>

                        <h5 class="border-bottom pb-2 mb-3 mt-4"><i class="fas fa-book"></i> ข้อมูลรายวิชา</h5>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">รหัสวิชา</label>
                                <input type="text" name="course_code" class="form-control"
                                    th:value="${doc1Data != null ? doc1Data.getOrDefault('course_code', '') : ''}"
                                    placeholder="เช่น CP 123 456">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">รายวิชา</label>
                                <input type="text" name="course_name" class="form-control"
                                    th:value="${doc1Data != null ? doc1Data.getOrDefault('course_name', '') : ''}"
                                    placeholder="เช่น Introduction to Computer Science">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">ปีการศึกษา</label>
                                <input type="text" name="academic_year" class="form-control"
                                    th:value="${doc1Data != null ? doc1Data.getOrDefault('academic_year', '') : ''}"
                                    placeholder="เช่น 2568">
                            </div>
                        </div>
                        <div th:if="${param.saved != null}" class="alert alert-success alert-dismissible fade show mt-3">
                            <i class="fas fa-save"></i> บันทึกแบบร่างสำเร็จ
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <th:block th:replace="~{academic/admin/doc_fragments/_common :: buttons}"></th:block>
                    </form>

                        <!-- แผงลงนาม: อยู่นอก <form> ของเอกสาร เพราะมี form ของตัวเอง -->
        <div th:replace="~{academic/admin/doc_fragments/_common :: signaturePanel}"></div>

                </div>
            </div>
        </div>

        <input type="hidden" id="currentDocType" th:value="${documentType}">
        <input type="hidden" id="existingDataHolder" th:if="${existingData != null}" th:value="${existingData}">
        <link rel="stylesheet" href="/css/doc_preview.css">
        <script>
            function syncAdminTargetPos() {
                var r1 = document.getElementById('targetPos1');
                var r2 = document.getElementById('targetPos2');
                var chk1 = document.getElementById('chk1');
                var chk2 = document.getElementById('chk2');
                if (!r1 || !r2 || !chk1 || !chk2) return;
                if (r1.checked) { chk1.value = '✓'; chk2.value = ''; }
                else if (r2.checked) { chk1.value = ''; chk2.value = '✓'; }
                else { chk1.value = ''; chk2.value = ''; }
            }
            document.querySelectorAll('.target-pos-radio').forEach(function(radio) {
                radio.addEventListener('change', syncAdminTargetPos);
            });
            syncAdminTargetPos();
        </script>
        <th:block th:replace="~{academic/admin/doc_fragments/_common :: scripts}"></th:block>
    </section>
</body>

</html>
