<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic :: layout(~{::section})}">

<body>
    <section>
        <div class="container py-4">
            <div th:if="${param.success != null}" class="alert alert-success alert-dismissible fade show">
                <i class="fas fa-check-circle"></i>
                <span th:if="${param.success[0] == 'added'}">เพิ่มบุคลากรสำเร็จ</span>
                <span th:if="${param.success[0] == 'updated'}">แก้ไขข้อมูลสำเร็จ</span>
                <span th:if="${param.success[0] == 'deleted'}">ลบข้อมูลสำเร็จ</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3><i class="fas fa-users"></i> จัดการรายชื่อบุคลากร</h3>
                <a href="/admin/academic/staff/add" class="btn btn-academic"><i class="fas fa-plus"></i>
                    เพิ่มบุคลากร</a>
            </div>

            <div class="card card-academic">
                <div class="card-body">
                    <div th:if="${staffMembers == null || staffMembers.isEmpty()}" class="text-center py-4 text-muted">
                        <i class="fas fa-user-plus fa-3x mb-3"></i>
                        <p>ยังไม่มีข้อมูลบุคลากร กรุณาเพิ่มข้อมูลเพื่อใช้ในการกรอกเอกสาร</p>
                    </div>
                    <div class="table-responsive" th:if="${staffMembers != null && !staffMembers.isEmpty()}">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>ชื่อ-ตำแหน่งวิชาการ</th>
                                    <th>ชื่อ-นามสกุล</th>
                                    <th>ประเภท</th>
                                    <th>หน่วยงาน</th>
                                    <th>บทบาท</th>
                                    <th>จัดการ</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="s : ${staffMembers}">
                                    <td th:text="${s.id}"></td>
                                    <td th:text="${s.academicTitle}"></td>
                                    <td th:text="${s.fullName}"></td>
                                    <td th:text="${s.staffType}"></td>
                                    <td th:text="${s.department}"></td>
                                    <td>
                                        <span class="badge" th:classappend="${s.staffRole == 'DEAN'} ? 'bg-danger' : 
                                                   (${s.staffRole == 'HEAD'} ? 'bg-primary' : 
                                                   (${s.staffRole == 'COMMITTEE'} ? 'bg-success' : 
                                                   (${s.staffRole == 'HR'} ? 'bg-warning' : 'bg-secondary')))"
                                            th:text="${s.staffRole}"></span>
                                    </td>
                                    <td>
                                        <div class="d-flex gap-1">
                                            <a th:href="'/admin/academic/staff/edit/' + ${s.id}"
                                                class="btn btn-sm btn-outline-primary"><i class="fas fa-edit"></i></a>
                                            <form th:action="'/admin/academic/staff/delete/' + ${s.id}" method="post"
                                                onsubmit="return confirm('ยืนยันการลบ?')">
                                                <button type="submit" class="btn btn-sm btn-outline-danger"><i
                                                        class="fas fa-trash"></i></button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <a href="/admin/academic/requests" class="btn btn-outline-secondary mt-3"><i class="fas fa-arrow-left"></i>
                กลับ</a>
        </div>
    </section>
</body>

</html>
