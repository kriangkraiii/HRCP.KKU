<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{academic/base_academic :: layout(~{::section})}">

<body>
    <section>
        <div class="container py-4">
            <div class="card card-academic" style="max-width: 700px; margin: 0 auto;">
                <div class="card-header bg-white">
                    <h4 class="mb-0">
                        <i class="fas fa-user-plus" th:if="${staff.id == null}"></i>
                        <i class="fas fa-user-edit" th:if="${staff.id != null}"></i>
                        <span th:if="${staff.id == null}"> เพิ่มบุคลากร</span>
                        <span th:if="${staff.id != null}"> แก้ไขข้อมูลบุคลากร</span>
                    </h4>
                </div>
                <div class="card-body">
                    <form
                        th:action="${staff.id != null} ? '/admin/academic/staff/edit/' + ${staff.id} : '/admin/academic/staff/add'"
                        method="post">
                        <div class="mb-3">
                            <label class="form-label">ตำแหน่งทางวิชาการ</label>
                            <select name="academicTitle" class="form-select" required>
                                <option value="">-- เลือก --</option>
                                <option value="อาจารย์ " th:selected="${staff.academicTitle == 'อาจารย์ '}">อาจารย์
                                </option>
                                <option value="อาจารย์ ดร." th:selected="${staff.academicTitle == 'อาจารย์ ดร.'}">
                                    อาจารย์ ดร.</option>
                                <option value="ผู้ช่วยศาสตราจารย์"
                                    th:selected="${staff.academicTitle == 'ผู้ช่วยศาสตราจารย์'}">ผู้ช่วยศาสตราจารย์
                                </option>
                                <option value="ผู้ช่วยศาสตราจารย์ ดร."
                                    th:selected="${staff.academicTitle == 'ผู้ช่วยศาสตราจารย์ ดร.'}">ผู้ช่วยศาสตราจารย์
                                    ดร.</option>
                                <option value="รองศาสตราจารย์" th:selected="${staff.academicTitle == 'รองศาสตราจารย์'}">
                                    รองศาสตราจารย์</option>
                                <option value="รองศาสตราจารย์ ดร."
                                    th:selected="${staff.academicTitle == 'รองศาสตราจารย์ ดร.'}">รองศาสตราจารย์ ดร.
                                </option>
                                <option value="ศาสตราจารย์" th:selected="${staff.academicTitle == 'ศาสตราจารย์'}">
                                    ศาสตราจารย์</option>
                                <option value="ศาสตราจารย์ ดร."
                                    th:selected="${staff.academicTitle == 'ศาสตราจารย์ ดร.'}">ศาสตราจารย์ ดร.</option>
                                <option value=""
                                    th:selected="${staff.academicTitle == null || staff.academicTitle == ''}">ไม่มี
                                    (เจ้าหน้าที่)</option>
                            </select>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label">ชื่อ</label>
                                <input type="text" name="firstName" class="form-control" th:value="${staff.firstName}"
                                    required placeholder="เช่น สมชาย">
                            </div>
                            <div class="col-6">
                                <label class="form-label">นามสกุล</label>
                                <input type="text" name="lastName" class="form-control" th:value="${staff.lastName}"
                                    required placeholder="เช่น ใจดี">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ประเภทบุคลากร</label>
                            <select name="staffType" class="form-select" required>
                                <option value="">-- เลือก --</option>
                                <option value="พนักงานมหาวิทยาลัย"
                                    th:selected="${staff.staffType == 'พนักงานมหาวิทยาลัย'}">พนักงานมหาวิทยาลัย</option>
                                <option value="ข้าราชการ" th:selected="${staff.staffType == 'ข้าราชการ'}">ข้าราชการ
                                </option>
                                <option value="พนักงานราชการ" th:selected="${staff.staffType == 'พนักงานราชการ'}">
                                    พนักงานราชการ</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">หน่วยงาน/สาขา</label>
                            <input type="text" name="department" class="form-control" th:value="${staff.department}"
                                placeholder="เช่น สาขาวิทยาการคอมพิวเตอร์">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">บทบาทในระบบ</label>
                            <select name="staffRole" class="form-select" required>
                                <option value="">-- เลือก --</option>
                                <option value="DEAN" th:selected="${staff.staffRole == 'DEAN'}">DEAN — คณบดี/รองคณบดี
                                </option>
                                <option value="HEAD" th:selected="${staff.staffRole == 'HEAD'}">HEAD — หัวหน้าสาขา
                                </option>
                                <option value="COMMITTEE" th:selected="${staff.staffRole == 'COMMITTEE'}">COMMITTEE —
                                    กรรมการผู้ทรงคุณวุฒิ</option>
                                <option value="HR" th:selected="${staff.staffRole == 'HR'}">HR — เจ้าหน้าที่บริหารงาน
                                </option>
                                <option value="GENERAL" th:selected="${staff.staffRole == 'GENERAL'}">GENERAL —
                                    อาจารย์ทั่วไป</option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-academic"><i class="fas fa-save"></i> บันทึก</button>
                            <a href="/admin/academic/staff" class="btn btn-outline-secondary"><i
                                    class="fas fa-arrow-left"></i> กลับ</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
