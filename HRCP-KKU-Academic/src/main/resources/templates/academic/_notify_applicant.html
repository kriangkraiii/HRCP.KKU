<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/*
  บอกล่วงหน้าว่าเอกสารฉบับนี้จะทำให้คำร้องเดินไปขั้นไหน และจะเดินตอนไหน

  เดิมตรงนี้เป็นช่องติ๊กว่าจะส่งอีเมลแจ้งผู้ยื่นหรือไม่ ซึ่งใช้ไม่ได้อีกแล้วเมื่อสถานะย้าย
  ไปเลื่อนตอนซองลายเซ็นปิด — ผู้ที่กดบันทึกวันนี้ไม่มีทางรู้ว่าอีกกี่วันกว่าจะลงนามครบ
  การให้ตัดสินใจเรื่องอีเมลไว้ล่วงหน้าข้ามจังหวะแบบนั้นจึงไม่มีความหมาย

  สถานะเปลี่ยนเพราะหนังสือลงนามครบแล้วจริง ไม่ใช่เพราะใครกดปุ่ม ผู้ยื่นจึงได้รับแจ้งเสมอ

  แสดงเฉพาะเอกสารที่ทำให้คำร้องเดินไปขั้นถัดไป (advancesStatus) เอกสารอื่นไม่มีอะไรจะบอก
*/-->
<div th:fragment="note" th:if="${advancesStatus}"
     class="border rounded-3 p-3 mt-3" style="background: var(--bg-subtle, #f8fafc);">
    <div class="fw-semibold">
        <i class="fas fa-pen-nib"></i> เอกสารฉบับนี้ทำให้คำร้องเดินไปขั้นถัดไป
    </div>
    <div class="form-text mb-0">
        <span th:if="${statusAdvanceNote}" th:text="${statusAdvanceNote}"></span>
        <span class="d-block">
            สถานะจะเปลี่ยนเมื่อลงนามครบทุกขั้น
            <span th:replace="~{academic/_info_tip :: tip('การบันทึกเอกสารยังไม่เลื่อนสถานะคำร้อง เมื่อลงนามครบ ระบบจะเลื่อนสถานะและแจ้งผู้ยื่นให้')}"></span>
        </span>
    </div>
</div>

</body>
</html>
