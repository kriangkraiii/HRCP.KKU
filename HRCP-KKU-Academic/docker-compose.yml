services:
  db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrcp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      TZ: Asia/Bangkok
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ไม่ publish port ออก host — มีแค่ app กับ backup ใน network เดียวกันที่ต่อได้
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hrcp}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: hrcp-academic:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-hrcp}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      TZ: Asia/Bangkok
    ports:
      - "8081:8081"
    volumes:
      - uploads:/app/uploads

  # pg_dump ตามเวลาที่ตั้งไว้ ใช้ image เดียวกับ db เพื่อให้เวอร์ชัน pg_dump
  # ตรงกับ server เสมอ — pg_dump เก่ากว่า server จะ refuse to run
  backup:
    image: postgres:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-hrcp}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      BACKUP_AT: ${BACKUP_AT:-02:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Bangkok
    volumes:
      - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
    entrypoint: ["/bin/bash", "/usr/local/bin/backup.sh"]

volumes:
  pgdata:
  uploads:
  backups:
