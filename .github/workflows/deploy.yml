name: Deploy to Windows Server

# ทำงานเฉพาะเมื่อมีการ push หรือ merge (PR ที่ถูก merge ก็คือ push) เข้า branch "deploy" เท่านั้น
on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    # รันบน self-hosted runner ที่ติดตั้งไว้บน Windows Server ของเราเอง (ไม่ใช้ GitHub-hosted runner)
    runs-on: self-hosted

    # กำหนด path ของโปรเจกต์ (pom.xml) และไฟล์ปลายทางไว้เป็นตัวแปรกลาง แก้ที่เดียวพอ
    env:
      PROJECT_DIR: HRCP-KKU-Academic
      SERVICE_NAME: MyWebApp
      DEPLOY_PATH: C:\apps\myspringboot\app.jar
      # โฟลเดอร์ uploads ที่แอปใช้จริง (อยู่ใต้ working directory ของ service) — ถ้า service
      # ตั้ง working directory ไว้ที่อื่น ให้แก้ค่านี้ให้ตรง ไม่งั้นขั้นสำรองจะข้ามไปพร้อมคำเตือน
      UPLOADS_PATH: C:\apps\myspringboot\uploads
      BACKUP_ROOT: C:\apps\backups

    steps:
      # 1) ดึงโค้ดล่าสุดจาก branch ที่ถูก push (deploy) ลงมาบน runner
      - name: Checkout source code
        uses: actions/checkout@v5

      # 2) Build และรัน Automated Tests ด้วย Maven ให้ผ่านก่อน deploy (ISO 27001 A.14)
      - name: Build and Test with Maven
        working-directory: ${{ env.PROJECT_DIR }}
        run: mvn clean package -DskipTests=false

      # 2.1) ตรวจสอบช่องโหว่ Dependencies (ISO 27001 A.12)
      - name: OWASP Dependency Check
        working-directory: ${{ env.PROJECT_DIR }}
        run: mvn dependency-check:check -DfailBuildOnCVSS=7 -DfailOnError=false
        continue-on-error: true

      # 2.2) สำรองก่อนแตะ production: ไฟล์ผู้ใช้ (ลายเซ็น เอกสาร ไฟล์แนบ) และ jar ตัวเดิมไว้ย้อนกลับ
      #      robocopy แบบสะสม (/E ไม่ใช่ /MIR) — ไฟล์ที่เคยสำรองไว้จะไม่ถูกลบตามแม้ต้นทางหายไป
      #      และคัดลอกเฉพาะไฟล์ใหม่/เปลี่ยน รอบหลัง ๆ จึงเร็ว
      - name: Back up uploads and current jar
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:BACKUP_ROOT | Out-Null
          if (Test-Path $env:DEPLOY_PATH) {
              Copy-Item -Path $env:DEPLOY_PATH -Destination "$env:BACKUP_ROOT\app.jar.previous" -Force
              Write-Host "Saved current jar -> $env:BACKUP_ROOT\app.jar.previous"
          }
          if (Test-Path $env:UPLOADS_PATH) {
              robocopy $env:UPLOADS_PATH "$env:BACKUP_ROOT\uploads" /E /R:2 /W:2 /NP /NFL /NDL /XD chunks
              # robocopy: 0-7 = success (files copied or no change), 8+ = failure
              if ($LASTEXITCODE -ge 8) { throw "Backup of $env:UPLOADS_PATH failed (robocopy exit $LASTEXITCODE)" }
              $global:LASTEXITCODE = 0
              Write-Host "Backed up $env:UPLOADS_PATH -> $env:BACKUP_ROOT\uploads"
          } else {
              Write-Host "::warning::$env:UPLOADS_PATH not found - uploads were NOT backed up. Set UPLOADS_PATH to the service real uploads folder."
          }

      # 2.3) สำรองฐานข้อมูลก่อน jar ใหม่รัน Flyway migration — คำร้อง ลายเซ็น และประวัติการลงนามอยู่ในฐานข้อมูล
      #      ไม่ใช่ใน uploads ตั้งค่าที่ Settings > Secrets and variables > Actions:
      #        secret   DB_BACKUP_PASSWORD
      #        variable DB_BACKUP_HOST (เช่น 10.198.200.84), DB_BACKUP_NAME (เช่น hr_db), DB_BACKUP_USER
      #      และต้องมี pg_dump บนเครื่อง runner (มากับ PostgreSQL client) ถ้ายังไม่ได้ตั้ง จะข้ามพร้อมคำเตือน
      #      ถ้าตั้งแล้วแต่สำรองไม่สำเร็จ จะหยุด deploy ก่อนแตะ production
      - name: Back up database
        shell: powershell
        env:
          PGPASSWORD: ${{ secrets.DB_BACKUP_PASSWORD }}
          DB_HOST: ${{ vars.DB_BACKUP_HOST }}
          DB_NAME: ${{ vars.DB_BACKUP_NAME }}
          DB_USER: ${{ vars.DB_BACKUP_USER }}
        run: |
          $pgDump = Get-Command pg_dump -ErrorAction SilentlyContinue
          if (-not $pgDump -or -not $env:PGPASSWORD -or -not $env:DB_HOST -or -not $env:DB_NAME -or -not $env:DB_USER) {
              Write-Host "::warning::Database was NOT backed up (pg_dump or DB_BACKUP_* settings missing)."
              exit 0
          }
          $dir = "$env:BACKUP_ROOT\db"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $file = "$dir\$env:DB_NAME-$(Get-Date -Format 'yyyyMMdd-HHmmss').dump"
          & $pgDump.Source --host=$env:DB_HOST --username=$env:DB_USER --dbname=$env:DB_NAME --format=custom --file=$file
          if ($LASTEXITCODE -ne 0) { throw "pg_dump failed (exit $LASTEXITCODE)" }
          Write-Host "Backed up database -> $file"
          # เก็บ 10 ไฟล์ล่าสุด
          Get-ChildItem $dir -Filter "$env:DB_NAME-*.dump" | Sort-Object LastWriteTime -Descending |
              Select-Object -Skip 10 | Remove-Item -Force

      # 2.4) ใบรับรองของระบบ (system seal) — ประทับรับรองลายเซ็นของผู้ลงนามภายนอกที่ไม่มี Digital ID
      #      (ยืนยันตัวตนด้วย OTP ทางอีเมลแล้วระบบลงนามให้ ดู SystemSealService)
      #      สร้างครั้งเดียวตอน deploy ครั้งแรก รอบต่อไปเห็นว่ามีแล้วก็ข้าม — ห้ามสร้างใหม่ทับ
      #      ไม่งั้นเครื่องที่ติดตั้ง .cer ไว้เชื่อถือต้องติดตั้งใหม่
      #      ใบรับรอง self-signed หมดอายุ 31 ธ.ค. 9999 (ค่า "ไม่มีวันหมดอายุ" ตาม RFC 5280)
      #      แอปหาไฟล์เองที่ secrets\ ข้าง app.jar ไม่ต้องตั้ง env/properties และไม่ต้อง restart
      #      ไม่สำเร็จก็ไม่หยุด deploy — แค่ทางสำรองนี้ยังปิดอยู่ ผู้ลงนามภายนอกต้องใช้ .p12 ของตัวเอง
      - name: Ensure system seal certificate
        shell: powershell
        continue-on-error: true
        run: |
          $dir = Join-Path (Split-Path $env:DEPLOY_PATH -Parent) 'secrets'
          $p12 = Join-Path $dir 'system-seal.p12'
          if (Test-Path $p12) {
              Write-Host "System seal certificate already exists: $p12 (kept as is)"
              exit 0
          }
          $keytool = if ($env:JAVA_HOME -and (Test-Path "$env:JAVA_HOMEin\keytool.exe")) { "$env:JAVA_HOMEin\keytool.exe" }
                     else { (Get-Command keytool -ErrorAction SilentlyContinue).Source }
          if (-not $keytool) { throw "keytool not found (set JAVA_HOME on the runner)" }

          # รหัสสุ่ม เก็บในไฟล์ข้าง .p12 ที่แอปอ่าน — ไม่ต้องจำ ไม่ต้องตั้ง secret
          $bytes = New-Object byte[] 24
          [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
          $env:SEAL_PASS = [Convert]::ToBase64String($bytes) -replace '[+/=]', 'x'
          # หักไว้ 1 วัน กันเวลา UTC เลยไปปี 10000 ซึ่ง X.509 เขียนไม่ได้
          $days = ([datetime]'9999-12-31' - (Get-Date).Date).Days - 1

          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          & $keytool -genkeypair -alias system-seal -keyalg RSA -keysize 3072 -sigalg SHA256withRSA `
              -validity $days -storetype PKCS12 -keystore $p12 -storepass:env SEAL_PASS `
              -dname "CN=HRCP e-Signature Seal, OU=College of Computing, O=Khon Kaen University, C=TH" `
              -ext 'KU=digitalSignature,nonRepudiation'
          if ($LASTEXITCODE -ne 0) { throw "keytool -genkeypair failed (exit $LASTEXITCODE)" }
          [IO.File]::WriteAllText("$p12.password", $env:SEAL_PASS)
          # ใบรับรอง (ไม่มีกุญแจลับ) ไว้ติดตั้งเป็น "เชื่อถือ" ใน Adobe/Foxit ของเครื่องที่ตรวจเอกสาร
          & $keytool -exportcert -rfc -alias system-seal -keystore $p12 -storepass:env SEAL_PASS -file (Join-Path $dir 'system-seal.cer')
          Remove-Item Env:SEAL_PASS

          # กุญแจลับ: ให้อ่านได้เฉพาะ SYSTEM, Administrators, บัญชีที่รัน service และบัญชีของ runner นี้
          $svcAccount = (Get-CimInstance Win32_Service -Filter "Name='$env:SERVICE_NAME'").StartName
          if (-not $svcAccount -or $svcAccount -eq 'LocalSystem') { $svcAccount = 'SYSTEM' }
          $runner = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          icacls $dir /inheritance:r /grant:r "SYSTEM:(OI)(CI)F" "Administrators:(OI)(CI)F" "${svcAccount}:(OI)(CI)R" "${runner}:(OI)(CI)F" | Out-Null

          # สำรองไว้ ถ้าเครื่องพังจะได้ใช้ใบเดิม ไม่ต้องให้ทุกเครื่องติดตั้ง .cer ใหม่
          New-Item -ItemType Directory -Force -Path $env:BACKUP_ROOT | Out-Null
          Copy-Item -Path $dir -Destination "$env:BACKUP_ROOT\secrets" -Recurse -Force
          icacls "$env:BACKUP_ROOT\secrets" /inheritance:r /grant:r "SYSTEM:(OI)(CI)F" "Administrators:(OI)(CI)F" "${runner}:(OI)(CI)F" | Out-Null
          Write-Host "Created system seal certificate (valid until 9999-12-31): $p12"
          Write-Host "Trust it in Adobe/Foxit with: $(Join-Path $dir 'system-seal.cer')"

      # 3) หยุด Windows Service "MyWebApp" ก่อน เพื่อปลดล็อกไฟล์ app.jar ที่กำลังถูกใช้งานอยู่
      #    -ErrorAction SilentlyContinue กันพังกรณี service ยังไม่เคยรัน/ไม่พบ service
      #    พร้อมรอจนกว่าสถานะจะ Stopped จริงเพื่อป้องกัน file lock ตอน Copy-Item
      - name: Stop MyWebApp service
        shell: powershell
        run: |
          Write-Host "Stopping service $env:SERVICE_NAME ..."
          Stop-Service -Name $env:SERVICE_NAME -Force -ErrorAction SilentlyContinue
          $waited = 0
          while ((Get-Service -Name $env:SERVICE_NAME -ErrorAction SilentlyContinue).Status -eq 'Running' -and $waited -lt 20) {
              Start-Sleep -Seconds 1
              $waited++
          }
          Start-Sleep -Seconds 2
          Write-Host "Service stopped and file lock released."

      # 4) คัดลอกไฟล์ .jar ที่ build ได้ ไปทับไฟล์ปลายทางเดิม (เลือก Fat JAR ตัวจริง ไม่เอา .original)
      - name: Copy new jar to deployment path
        shell: powershell
        run: |
          $jarFile = Get-ChildItem -Path "${{ env.PROJECT_DIR }}\target\*.jar" |
              Where-Object { $_.Name -notlike "*.original*" -and $_.Name -notlike "original-*" } |
              Sort-Object Length -Descending |
              Select-Object -First 1

          if (-not $jarFile) {
              throw "No executable fat jar found in ${{ env.PROJECT_DIR }}\target!"
          }
          Write-Host "Copying $($jarFile.FullName) ($([math]::Round($jarFile.Length/1MB, 2)) MB) -> $env:DEPLOY_PATH"
          Copy-Item -Path $jarFile.FullName -Destination $env:DEPLOY_PATH -Force

      # 4.1) ตั้งค่า JVM Options เพื่อตรวจจับ Virtual Thread Pinning บนเซิร์ฟเวอร์
      - name: Configure JVM options for Virtual Threads
        shell: powershell
        continue-on-error: true
        run: |
          try {
            $optName = "JAVA_TOOL_OPTIONS"
            $flag = "-Djdk.tracePinnedThreads=short"
            $current = [Environment]::GetEnvironmentVariable($optName, "Machine")
            if (-not $current) {
              [Environment]::SetEnvironmentVariable($optName, $flag, "Machine")
              Write-Host "Set $optName = $flag"
            } elseif (-not $current.Contains("-Djdk.tracePinnedThreads")) {
              $newVal = "$current $flag".Trim()
              [Environment]::SetEnvironmentVariable($optName, $newVal, "Machine")
              Write-Host "Updated $optName = $newVal"
            } else {
              Write-Host "$optName already contains -Djdk.tracePinnedThreads"
            }
          } catch {
            Write-Warning "Could not update Machine-level JAVA_TOOL_OPTIONS (insufficient permission): $($_.Exception.Message)"
          }

      # 5) สั่งรัน Windows Service "MyWebApp" กลับขึ้นมาใหม่ด้วยไฟล์ .jar ตัวล่าสุด
      - name: Start MyWebApp service
        shell: powershell
        run: |
          Write-Host "Starting service $env:SERVICE_NAME ..."
          Start-Service -Name $env:SERVICE_NAME
          Start-Sleep -Seconds 3
          $svc = Get-Service -Name $env:SERVICE_NAME
          Write-Host "Service status: $($svc.Status)"
          if ($svc.Status -ne 'Running') {
              throw "Service $env:SERVICE_NAME failed to start (current status: $($svc.Status))"
          }
          Write-Host "Service started successfully."
